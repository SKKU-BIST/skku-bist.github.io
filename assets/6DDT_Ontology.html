<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6DDT Ontology</title>
<!-- 6DDT ontology documentation site, single-file edition (generated by build_single.py). Needs internet for jsDelivr libraries and Google Fonts. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>/* 6DDT Ontology site: Book layout in the style of brickschema.org (Hugo Book theme)
 * 왼쪽: 로고·검색·메뉴 / 가운데: 본문 / 오른쪽: "이 페이지에서" 목차
 */
:root {
  --bg: #ffffff;
  --bg-soft: #f8f9fa;
  --bg-sunk: #f1f3f5;
  --surface: #ffffff;
  --text: #000000;
  --text-soft: #343a40;
  --text-faint: #6c757d;
  --border: #e9ecef;
  --border-strong: #ced4da;
  --brand: #0055bb;
  --brand-strong: #003f8a;
  --brand-tint: #e8f0fb;
  --code-bg: #f8f9fa;
  --shadow: none;

  /* E / P / C */
  --e: #2563eb; --e-tint: #e7efff;
  --p: #c2410c; --p-tint: #fdeee4;
  --c: #15803d; --c-tint: #e4f6ea;

  /* 독산 최상위 그룹 8종 */
  --g-service: #1f6feb; --g-actor: #be185d; --g-model: #7c3aed; --g-data: #0e7490;
  --g-tool: #5b6b7a; --g-physical: #15803d; --g-value: #c2410c; --g-rule: #a16207;
  /* 6DDT dimensions and the VB schema */
  --g-virtual: #7c3aed; --g-agent: #be185d; --g-tooldim: #c2410c; --g-vb: #a16207;
  /* (EPC 호환) */
  --g-asset: #0e7490;
  --g-material: #a16207;
  --g-space: #7c3aed;
  --g-info: #2563eb;
  --g-task: #c2410c;
  --g-actor: #be185d;

  /* Turtle 하이라이트 */
  --tk-kw: #8250df;
  --tk-iri: #0a6a9e;
  --tk-pname: #0550ae;
  --tk-str: #116329;
  --tk-num: #b35900;
  --tk-cmt: #6e7781;

  --ok: #15803d; --warn: #b45309; --err: #b91c1c;

  --radius: 6px;
  --menu-w: 256px;
  --toc-w: 256px;
  --body-w: 80ch;
  --font: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Roboto Mono", "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}

/* 다크 테마: common.js가 저장된 설정 또는 OS 설정에 따라 <html class="dark">를 붙인다 */
:root.dark {
  --bg: #121212;
  --bg-soft: #1a1c1f;
  --bg-sunk: #22252a;
  --surface: #16181b;
  --text: #e9ecef;
  --text-soft: #c4cad0;
  --text-faint: #8b949e;
  --border: #2a2e33;
  --border-strong: #3d434a;
  --brand: #84b2ff;
  --brand-strong: #b0ceff;
  --brand-tint: #1b2a40;
  --code-bg: #1a1c1f;
  --e: #6b9cff; --e-tint: #182a4a;
  --p: #f08a4b; --p-tint: #3a2216;
  --c: #4cc77a; --c-tint: #15301f;
  --g-service: #6b9cff; --g-actor: #f06aa8; --g-model: #a78bfa; --g-data: #22b8d6;
  --g-tool: #9aa8b5; --g-physical: #4cc77a; --g-value: #f08a4b; --g-rule: #e0a526;
  --g-virtual: #a78bfa; --g-agent: #f06aa8; --g-tooldim: #f08a4b; --g-vb: #e0a526;
  --g-asset: #22b8d6; --g-material: #e0a526; --g-space: #a78bfa;
  --g-info: #6b9cff; --g-task: #f08a4b; --g-actor: #f06aa8;
  --tk-kw: #c297ff; --tk-iri: #6cc4f2; --tk-pname: #8ab4ff;
  --tk-str: #7ee093; --tk-num: #f2b36b; --tk-cmt: #7d8a99;
  --ok: #4cc77a; --warn: #f2b36b; --err: #f37b7b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; font-size: 16px; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 1rem; line-height: 1.6;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
img { max-width: 100%; }
h1, h2, h3, h4 { font-weight: 400; line-height: 1.25; color: var(--text); }
h1 { font-size: 2rem; margin: 0 0 1rem; }
h2 { font-size: 1.5rem; margin: 2.4rem 0 .8rem; scroll-margin-top: 1rem; }
h3 { font-size: 1.25rem; margin: 2rem 0 .6rem; scroll-margin-top: 1rem; }
h4 { font-size: 1.05rem; margin: 1.4rem 0 .4rem; }
b, strong { font-weight: 700; }
p { margin: .6rem 0 1rem; }
ul, ol { padding-left: 1.6em; }
li { margin: .25rem 0; }
code, kbd, pre { font-family: var(--mono); font-size: .875em; }
:not(pre) > code { background: var(--bg-sunk); border-radius: 3px; padding: .1em .3em; white-space: nowrap; }
hr { border: 0; border-top: 1px solid var(--border); margin: 2.4rem 0; }

/* ---------- Book 레이아웃 ---------- */
.book { display: flex; min-height: 100vh; max-width: 1440px; margin: 0 auto; }
.book-menu { flex: 0 0 var(--menu-w); width: var(--menu-w); font-size: .875rem; }
.book-menu-inner {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  padding: 1rem; display: flex; flex-direction: column;
}
.book-brand { display: flex; align-items: center; gap: 10px; margin: .4rem 0 1rem; color: var(--text); font-size: 1.3rem; line-height: 1.15; }
.book-brand:hover { text-decoration: none; }
.book-brand .brand-mark { width: 32px; height: 32px; flex: none; }
.book-brand small { display: block; font-size: .72rem; color: var(--text-faint); }
.book-search { position: relative; margin-bottom: 1rem; }
.book-search input {
  width: 100%; padding: .5rem; border: 0; border-radius: 4px;
  background: var(--bg-soft); color: var(--text); font: inherit; font-size: .875rem;
}
.book-search input:focus { outline: 1px solid var(--border-strong); }
.search-results {
  position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 60;
  background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
  box-shadow: 0 8px 24px rgba(0,0,0,.12); max-height: 60vh; overflow: auto; display: none;
}
.search-results.open { display: block; }
.search-results a { display: block; padding: .45rem .6rem; color: var(--text); border-bottom: 1px solid var(--border); }
.search-results a:last-child { border-bottom: 0; }
.search-results a:hover, .search-results a.sel { background: var(--bg-soft); text-decoration: none; }
.search-results .k { font-size: .7rem; color: var(--text-faint); margin-left: 6px; }
.search-results .d { display: block; font-size: .75rem; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search-results .none { padding: .6rem; color: var(--text-faint); }

.book-nav ul { list-style: none; margin: 0; padding: 0; }
.book-nav li { margin: 0; }
.book-nav a { display: block; padding: .3em 0; color: var(--text); }
.book-nav a:hover { color: var(--brand); text-decoration: none; }
.book-nav a.active { color: var(--brand); font-weight: 700; }
.book-nav .num { display: inline-block; width: 1.7em; color: var(--text-faint); font-size: .8em; font-family: var(--mono); font-weight: 400; }
.book-nav .group { margin: 1.2rem 0 .3rem; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--text-faint); }
.book-nav .ext::after { content: " ↗"; font-size: .85em; color: var(--text-faint); }
.book-menu-foot { margin-top: auto; padding-top: 1.5rem; display: grid; gap: .7rem; }
.book-menu-foot .partners { display: grid; gap: 6px; }
.book-menu-foot .partners .x { display: none; }
.book-menu-foot .logo-slot { height: 46px; min-width: 0; width: 100%; }
.book-menu-foot .co { font-size: .75rem; color: var(--text-faint); }
.theme-btn {
  display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: .78rem;
  background: none; border: 1px solid var(--border); color: var(--text-soft); border-radius: 4px; padding: 3px 8px; cursor: pointer; width: fit-content;
}
.theme-btn:hover { border-color: var(--border-strong); color: var(--text); }

.book-page { flex: 1 1 0; min-width: 0; padding: 2rem 1rem; }
.book-header { display: none; }
.book-content { max-width: var(--body-w); }
body.wide .book-content { max-width: none; }
.book-footer {
  max-width: var(--body-w); margin-top: 4rem; padding-top: 1rem; border-top: 1px solid var(--border);
  font-size: .8rem; color: var(--text-faint); display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
}
body.wide .book-footer { max-width: none; }

.book-toc { flex: 0 0 var(--toc-w); width: var(--toc-w); font-size: .75rem; }
.book-toc-inner { position: sticky; top: 0; max-height: 100vh; overflow-y: auto; padding: 2rem 1rem; }
.book-toc b { display: block; font-weight: 400; color: var(--text-faint); margin-bottom: .4rem; }
.book-toc a { display: block; padding: .2em 0; color: var(--brand); }
.book-toc a.sub { padding-left: 1em; }
.book-toc a.on { font-weight: 700; }
body.wide .book-toc { display: none; }

/* 기존 페이지 안의 왼쪽 목차는 오른쪽 목차로 옮겨 표시 */
.doc > .toc { display: none; }
.doc { display: block; padding: 0; }
.doc-body { min-width: 0; }
.doc-body > h2:first-child { margin-top: 0; }

/* 페이지 제목 영역: 배너 대신 문서 제목 */
.page-hero { margin-bottom: 1.5rem; }
.page-hero .crumb { font-size: .72rem; letter-spacing: .08em; color: var(--text-faint); }
.page-hero h1 { margin: .15rem 0 .5rem; }
.page-hero p { color: var(--text-soft); margin: 0; }

.container { max-width: none; margin: 0; padding: 0; }

@media (max-width: 1280px) { .book-toc { display: none; } }
@media (max-width: 860px) {
  .book { display: block; }
  .book-menu {
    position: fixed; z-index: 80; left: 0; top: 0; bottom: 0;
    background: var(--bg); border-right: 1px solid var(--border);
    transform: translateX(-100%); transition: transform .2s;
  }
  body.menu-open .book-menu { transform: none; }
  body.menu-open::after { content: ""; position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.25); }
  .book-header { display: flex; align-items: center; gap: 10px; margin-bottom: 1.2rem; font-size: 1.1rem; }
  .book-header button { background: none; border: 0; color: var(--text); cursor: pointer; padding: 4px; display: inline-flex; }
  .book-page { padding: 1rem; }
}

/* ---------- 버튼 ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: .45rem .9rem; border-radius: 4px; font-weight: 500; font-size: .9rem;
  border: 1px solid transparent; cursor: pointer; font-family: inherit; line-height: 1.3;
}
.btn:hover { text-decoration: none; }
.btn-solid, .btn-primary { background: var(--brand); color: #fff; }
:root.dark .btn-solid, :root.dark .btn-primary { color: #0b1a2e; }
.btn-solid:hover, .btn-primary:hover { background: var(--brand-strong); }
.btn-line, .btn-ghost { border-color: var(--border-strong); color: var(--text); background: var(--surface); }
.btn-line:hover, .btn-ghost:hover { border-color: var(--brand); color: var(--brand); }
.btn-sm { padding: .3rem .7rem; font-size: .82rem; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 1rem 0; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* ---------- 그리드·카드 ---------- */
.grid { display: grid; gap: 12px; margin: 1rem 0; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 900px) { .grid-3, .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } }
.card { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; background: var(--surface); }
.card h3 { margin: 0 0 4px; font-size: 1rem; font-weight: 700; }
.card p { color: var(--text-soft); margin: 0 0 4px; font-size: .9rem; }
a.card { color: inherit; display: block; }
a.card:hover { border-color: var(--brand); text-decoration: none; }
.card .num { font-family: var(--mono); font-size: .75rem; color: var(--text-faint); }
.card .more { font-size: .85rem; color: var(--brand); }
.stat b { display: block; font-size: 1.8rem; font-weight: 400; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--text-faint); font-size: .8rem; }

.callout { border-left: 4px solid var(--brand); background: var(--bg-soft); border-radius: 0 4px 4px 0; padding: .8rem 1rem; margin: 1.2rem 0; }
.callout.warn { border-left-color: var(--warn); }
.callout.ok { border-left-color: var(--ok); }
.callout p:first-child { margin-top: 0; } .callout p:last-child { margin-bottom: 0; }
.callout b.t { display: block; margin-bottom: 2px; }

/* ---------- 표 ---------- */
.table-wrap { overflow-x: auto; margin: 1rem 0; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th, td { text-align: left; padding: .5rem; border: 1px solid var(--border); vertical-align: top; }
th { background: var(--bg-soft); font-weight: 700; white-space: nowrap; }
td code { white-space: nowrap; }

/* ---------- 코드 ---------- */
.code { position: relative; margin: 1rem 0; border-radius: 4px; background: var(--code-bg); overflow: hidden; }
.code-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  font-size: .72rem; color: var(--text-faint); padding: 4px 10px; border-bottom: 1px solid var(--border); font-family: var(--mono);
}
.code pre { margin: 0; padding: 1rem; overflow: auto; line-height: 1.55; font-size: .82rem; max-height: 560px; }
.copy-btn { font: inherit; background: none; border: 1px solid var(--border); color: var(--text-soft); border-radius: 3px; padding: 0 6px; cursor: pointer; }
.copy-btn:hover { color: var(--text); border-color: var(--border-strong); }
.tk-kw { color: var(--tk-kw); font-weight: 600; }
.tk-iri { color: var(--tk-iri); }
.tk-pname { color: var(--tk-pname); }
.tk-str { color: var(--tk-str); }
.tk-num { color: var(--tk-num); }
.tk-cmt { color: var(--tk-cmt); font-style: italic; }
.tk-lang { color: var(--tk-num); }

/* ---------- 칩·배지 ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; padding: 0 8px; border-radius: 999px;
  border: 1px solid var(--border-strong); color: var(--text-soft); white-space: nowrap; line-height: 1.6;
}
.stage { display: inline-flex; width: 20px; height: 20px; align-items: center; justify-content: center; border-radius: 4px; font-weight: 700; font-size: .75rem; font-family: var(--mono); }
.stage-E { background: var(--e-tint); color: var(--e); }
.stage-P { background: var(--p-tint); color: var(--p); }
.stage-C { background: var(--c-tint); color: var(--c); }
.sev-Violation { color: var(--err); border-color: color-mix(in srgb, var(--err) 45%, transparent); }
.sev-Warning { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.sev-Info { color: var(--brand); }

/* ---------- 그림 ---------- */
figure { margin: 1.4rem 0; }
figure svg { width: 100%; height: auto; display: block; }
figcaption { font-size: .82rem; color: var(--text-faint); margin-top: 6px; text-align: center; }
.figure-box { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }

.stack { display: grid; gap: 6px; margin: 1rem 0; }
.stack-row { display: grid; grid-template-columns: 140px 1fr; gap: 16px; align-items: center; border: 1px solid var(--border); border-radius: 4px; padding: .6rem 1rem; }
.stack-row .name { font-weight: 700; }
.stack-row .name small { display: block; font-weight: 400; color: var(--text-faint); font-size: .72rem; }
.stack-row p { margin: 0; color: var(--text-soft); font-size: .9rem; }
@media (max-width: 560px) { .stack-row { grid-template-columns: 1fr; gap: 2px; } }

/* ---------- 폼 ---------- */
input[type="search"], input[type="text"], select, textarea {
  font: inherit; font-size: .9rem; color: var(--text);
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: 4px; padding: .4rem .6rem;
}
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--brand) 40%, transparent); outline-offset: 0; }
textarea { width: 100%; font-family: var(--mono); font-size: .82rem; line-height: 1.55; }

.muted { color: var(--text-faint); }
.small { font-size: .85rem; }
.mono { font-family: var(--mono); }
.nowrap { white-space: nowrap; }
.hidden { display: none !important; }
.loading { color: var(--text-faint); padding: 40px 0; text-align: center; }
.err-box { border: 1px solid var(--err); color: var(--err); border-radius: 4px; padding: .7rem 1rem; background: color-mix(in srgb, var(--err) 6%, transparent); }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 4px; font-size: .85rem;
  opacity: 0; transition: .2s; pointer-events: none; z-index: 100;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- 공동 개발 기관 로고 ---------- */
/* 로고 원본 색을 지키기 위해 테마와 무관하게 흰 바탕 위에 둔다 */
.partners { display: inline-flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.partners .x { color: var(--text-faint); }
.logo-slot {
  display: inline-flex; align-items: center; justify-content: center;
  background: #fff; border: 1px solid var(--border); border-radius: 4px;
  height: 64px; min-width: 150px; padding: 8px 14px;
}
.logo-slot img { height: 100%; width: auto; max-width: 220px; object-fit: contain; display: block; }
.logo-slot .logo-text { display: none; color: #212529; font-weight: 700; font-size: .9rem; line-height: 1.2; text-align: center; }
.logo-slot .logo-text small { display: block; font-weight: 400; font-size: .68rem; color: #6c757d; }
.logo-slot.no-img .logo-text { display: block; }
.partners.lg .logo-slot { height: 80px; min-width: 200px; padding: 12px 20px; }

/* ---------- 3D 지식 그래프: 밝은 회색 배경 ---------- */
.kg-space { position: relative; background: #eef0f3 !important; border: 1px solid #d5d9df !important; overflow: hidden; }
.kg-controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin: 8px 0 4px; }
.kg-legend { display: flex; flex-wrap: wrap; gap: 6px; }
.kg-legend button {
  display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: .8rem; cursor: pointer;
  background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px;
}
.kg-legend button small { color: var(--text-faint); font-size: .72rem; }
.kg-legend button i { width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle, #fff 0 25%, var(--c) 45%); box-shadow: 0 0 6px var(--c); }
.kg-legend.filtering button:not(.on) { opacity: .45; }
.kg-legend button.on { border-color: var(--brand); }
.kg-group { font-size: .85rem; color: var(--text-soft); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
/* 3D 지식 그래프 툴팁 (3d-force-graph의 기본 툴팁 상자 안에 그려짐) */
.kg-space .float-tooltip-kap, .kg-space .scene-tooltip { background: transparent !important; padding: 0 !important; font-family: var(--font) !important; }
.kg-tip3 {
  background: rgba(8, 10, 18, .92); border: 1px solid var(--c, #7fa8ff); border-radius: 3px;
  padding: 3px 8px; font-size: 12px; color: #e6ecff; white-space: nowrap;
}
.kg-tip3 b { font-weight: 500; margin-right: 6px; }
.kg-tip3 span { color: #9aa6c4; }
/* 3D 지식 그래프 라벨 (켜기/끄기) */
.kg-labels { position: absolute; inset: 0; pointer-events: none; z-index: 2; display: none; overflow: hidden; }
.kg-labels.on { display: block; }
.kg-labels span {
  position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 12px; font-weight: 500; line-height: 1; color: #1b2430;
  text-shadow: 0 0 3px #eef0f3, 0 0 6px #eef0f3, 0 0 2px #fff; font-family: var(--font); will-change: transform;
}
.kg-opts { display: flex; gap: 16px; flex-wrap: wrap; }
.kg-space > canvas.kg-glow { position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; }
.kg-space > div:not(.kg-labels) { position: relative; z-index: 1; }
/* 열 너비를 colgroup으로 고정하는 표 */
table.fixed { table-layout: fixed; }
table.fixed td code { white-space: normal; word-break: break-word; }

/* ---------- 학술 도식 스타일 (epc.html의 .dg, index.html의 .intro) ----------
 * 색 채움·둥근 모서리 대신 흰 바탕의 직각 상자, 얇은 검은 선, 검은 화살촉, 기울임 속성명 */
.figure-box { border: 1px solid var(--border-strong); border-radius: 0; padding: 18px 14px 10px; }
.dg rect, .dg circle, .intro rect, .intro circle {
  fill: var(--bg) !important; stroke: var(--text) !important; stroke-width: 1 !important;
  rx: 0 !important; ry: 0 !important; opacity: 1 !important;
}
.dg rect.grp { fill: none !important; stroke: var(--text-faint) !important; stroke-dasharray: 4 3; }
.dg rect.lane { fill: var(--bg-soft) !important; stroke: var(--border-strong) !important; }
.dg text, .intro text { fill: var(--text) !important; font-family: var(--font); font-weight: 400 !important; opacity: 1 !important; }
.dg text[style*="font-weight:700"], .intro text[style*="font-weight:700"] { font-weight: 700 !important; }
.dg .sub, .intro .sub { fill: var(--text-faint) !important; font-size: 10.5px; }
.dg .lbl, .intro .lbl { fill: var(--text-soft) !important; font-family: var(--mono); font-style: italic; }
.dg .edge, .intro .edge, .dg .edge.strong { stroke: var(--text) !important; stroke-width: 0.9 !important; }
.dg .arrow, .dg .arrow.strong, .intro marker path { fill: var(--text) !important; }
figcaption { text-align: left; font-size: .82rem; color: var(--text-soft); border-top: 1px solid var(--border); padding-top: 6px; margin-top: 10px; }

/* ---------- 정보량 (BIT) ---------- */
.bit-metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 1rem 0; }
@media (max-width: 700px) { .bit-metrics { grid-template-columns: 1fr; } }
.bit-metrics .card b { display: block; font-size: 2rem; font-weight: 400; line-height: 1.1; font-variant-numeric: tabular-nums; }
.bit-metrics .card b small { font-size: .9rem; color: var(--text-faint); margin-left: 4px; }
.bit-metrics .card span { color: var(--text-faint); font-size: .8rem; }
.bars { display: grid; gap: 8px; margin: .8rem 0 1.2rem; }
.bar { display: grid; grid-template-columns: minmax(140px, 260px) 1fr auto; gap: 10px; align-items: center; font-size: .88rem; }
.bar .track { height: 12px; background: var(--bg-sunk); border: 1px solid var(--border); border-radius: 2px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--brand); }
.bar.warm .fill { background: var(--warn); }
.bar .v { font-family: var(--mono); font-size: .8rem; color: var(--text-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
.bar .lbl small { display: block; color: var(--text-faint); font-size: .74rem; }
.stacked { display: flex; height: 18px; border: 1px solid var(--border-strong); border-radius: 2px; overflow: hidden; margin: .6rem 0; }
.stacked i { display: block; height: 100%; }
.stacked-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; color: var(--text-soft); }
.stacked-legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: middle; }
.formula { font-family: var(--mono); background: var(--code-bg); border-radius: 4px; padding: .6rem 1rem; margin: .6rem 0; font-size: .9rem; }

/* Long inline code inside text boxes may wrap on narrow screens */
.callout code, .card code, td code { white-space: normal; overflow-wrap: anywhere; }
@media (max-width: 560px) { :not(pre) > code { white-space: normal; overflow-wrap: anywhere; } a { overflow-wrap: anywhere; } }

<script>window.SDDT_BUNDLE = [{"name": "6DDT_schema.ttl", "path": "files/6DDT_schema.ttl", "role": "ontology", "title": "6D Digital Twin Ontology (Schema Skeleton)", "version": "1.0", "size": 23679, "modified": "2026-10-30 17:18", "text": "@prefix owl: <http://www.w3.org/2002/07/owl#> .\n@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .\n@prefix sddt: <https://skku-bist.github.io/assets/6DDT_schema.ttl#> .\n@prefix xsd: <http://www.w3.org/2001/XMLSchema#> .\n\nsddt:AIAgentAnswer a owl:Class ;\n    rdfs:label \"AI Agent Answer\" ;\n    rdfs:comment \"DTData representing the agent final answer or service-related statement produced during O&M.\" ;\n    rdfs:subClassOf sddt:DTData .\n\nsddt:Location a owl:Class ;\n    rdfs:label \"Location\" ;\n    rdfs:comment \"A physical location or space container for assets such as a building, floor, or room.\" ;\n    rdfs:subClassOf sddt:PhysicalEntity .\n\nsddt:ModelingTool a owl:Class ;\n    rdfs:label \"Modeling Tool\" ;\n    rdfs:comment \"A tool used to construct, structure, or update model-based representations.\" ;\n    rdfs:subClassOf sddt:Tool .\n\nsddt:SimulationTool a owl:Class ;\n    rdfs:label \"Simulation Tool\" ;\n    rdfs:comment \"A tool that executes computational or diagnostic procedures, such as fault detection and diagnosis.\" ;\n    rdfs:subClassOf [ a owl:Restriction ;\n            owl:onProperty sddt:hasInput ;\n            owl:someValuesFrom sddt:DTData ],\n        sddt:Tool .\n\nsddt:SixDDT a owl:Ontology ;\n    rdfs:label \"6D Digital Twin Ontology (Schema Skeleton)\" ;\n    rdfs:comment \"Schema-only skeleton for 6DDT: classes, subclasses, relationships, and properties. Aligns with Brick and VB at schema level. Service is not a predefined class but emerges from interaction; each execution is recorded as a sddt:ServiceLog generated by the executing Tool and AI agent.\" ;\n    owl:versionInfo \"1.0\" .\n\nsddt:UserInterface a owl:Class ;\n    rdfs:label \"User Interface\" ;\n    rdfs:comment \"An interaction tool that supports service invocation, monitoring, and user-driven interaction, such as a dashboard or web UI.\" ;\n    rdfs:subClassOf sddt:InteractionTool .\n\nsddt:VisualizationTool a owl:Class ;\n    rdfs:label \"Visualization Tool\" ;\n    rdfs:comment \"A tool that presents service outputs, model states, or diagnostic results.\" ;\n    rdfs:subClassOf sddt:Tool .\n\nsddt:hasActuator a owl:ObjectProperty ;\n    rdfs:label \"has actuator\" ;\n    rdfs:comment \"Actuator point used in the loop.\" ;\n    rdfs:domain sddt:ControlLoop ;\n    rdfs:range sddt:Point .\n\nsddt:hasAgentId a owl:DatatypeProperty ;\n    rdfs:label \"has agent id\" ;\n    rdfs:comment \"Unique identifier for an AI agent.\" ;\n    rdfs:domain sddt:AIAgent ;\n    rdfs:range xsd:string ;\n    rdfs:subPropertyOf sddt:hasId .\n\nsddt:hasAgentSystemMessages a owl:DatatypeProperty ;\n    rdfs:label \"has agent system messages\" ;\n    rdfs:comment \"System messages defining the agent policy or task scope.\" ;\n    rdfs:domain sddt:AIAgent ;\n    rdfs:range xsd:string .\n\nsddt:hasAgentTuningParameters a owl:DatatypeProperty ;\n    rdfs:label \"has agent tuning parameters\" ;\n    rdfs:comment \"Agent tuning parameters such as temperature and max tokens stored as a JSON string.\" ;\n    rdfs:domain sddt:AIAgent ;\n    rdfs:range xsd:string .\n\nsddt:hasAgentUserPrompts a owl:DatatypeProperty ;\n    rdfs:label \"has agent user prompts\" ;\n    rdfs:comment \"User prompts consumed by the agent during service execution.\" ;\n    rdfs:domain sddt:AIAgent ;\n    rdfs:range xsd:string .\n\nsddt:hasAnalysisWindow a owl:DatatypeProperty ;\n    rdfs:label \"has analysis window\" ;\n    rdfs:comment \"Time window of the operational data analysed by the execution.\" ;\n    rdfs:domain sddt:ServiceLog ;\n    rdfs:range xsd:string .\n\nsddt:hasBehaviorTarget a owl:DatatypeProperty ;\n    rdfs:label \"has behavior target\" ;\n    rdfs:comment \"Target behaviour or control response that the behavior model represents.\" ;\n    rdfs:domain sddt:BehaviorModel ;\n    rdfs:range xsd:string .\n\nsddt:hasBoundaryCondition a owl:DatatypeProperty ;\n    rdfs:label \"has boundary condition\" ;\n    rdfs:comment \"Boundary condition under which the rule model is applicable.\" ;\n    rdfs:domain sddt:RuleModel ;\n    rdfs:range xsd:string .\n\nsddt:hasConnectedServiceId a owl:DatatypeProperty ;\n    rdfs:label \"has connected service id\" ;\n    rdfs:comment \"String identifier of the service execution (sddt:hasServiceInvocationID on its sddt:ServiceLog) that this entity participated in, supported, or produced.\" ;\n    rdfs:domain sddt:Entity ;\n    rdfs:range xsd:string .\n\nsddt:hasControlVariable a owl:ObjectProperty ;\n    rdfs:label \"has control variable\" ;\n    rdfs:comment \"Control variable point used in the loop.\" ;\n    rdfs:domain sddt:ControlLoop ;\n    rdfs:range sddt:Point .\n\nsddt:hasCoordinateSystem a owl:DatatypeProperty ;\n    rdfs:label \"has coordinate system\" ;\n    rdfs:comment \"Coordinate system used by the geometric model such as Cartesian or WGS84.\" ;\n    rdfs:domain sddt:GeometricModel ;\n    rdfs:range xsd:string .\n\nsddt:hasDTDataId a owl:DatatypeProperty ;\n    rdfs:label \"has DT data id\" ;\n    rdfs:comment \"Unique identifier for a DTData instance.\" ;\n    rdfs:domain sddt:DTData ;\n    rdfs:range xsd:string ;\n    rdfs:subPropertyOf sddt:hasId .\n\nsddt:hasDeviationValue a owl:DatatypeProperty ;\n    rdfs:label \"has deviation value\" ;\n    rdfs:comment \"Computed deviation value evaluated against the system threshold.\" ;\n    rdfs:domain sddt:DTData ;\n    rdfs:range xsd:decimal .\n\nsddt:hasEndTime a owl:DatatypeProperty,\n        owl:FunctionalProperty ;\n    rdfs:label \"has end time\" ;\n    rdfs:comment \"Time at which the execution was closed.\" ;\n    rdfs:domain sddt:ServiceLog ;\n    rdfs:range xsd:dateTime .\n\nsddt:hasEquipmentType a owl:DatatypeProperty ;\n    rdfs:label \"has equipment type\" ;\n    rdfs:comment \"Equipment type label such as AHU, VAV, or pump.\" ;\n    rdfs:domain sddt:Equipment ;\n    rdfs:range xsd:string .\n\nsddt:hasFaultCategory a owl:DatatypeProperty,\n        owl:FunctionalProperty ;\n    rdfs:label \"has fault category\" ;\n    rdfs:comment \"Fault category identified by one diagnostic execution, such as Fault A or Fault E-1.\" ;\n    rdfs:domain sddt:ServiceLog ;\n    rdfs:range xsd:string .\n\nsddt:hasFaultStatus a owl:DatatypeProperty,\n        owl:FunctionalProperty ;\n    rdfs:label \"has fault status\" ;\n    rdfs:comment \"Overall fault status of one diagnostic execution, such as normal or faulty.\" ;\n    rdfs:domain sddt:ServiceLog ;\n    rdfs:range xsd:string .\n\nsddt:hasGoverningEquation a owl:DatatypeProperty ;\n    rdfs:label \"has governing equation\" ;\n    rdfs:comment \"Governing equation of a virtual model, such as the physical equations of a physical model or the diagnostic condition of a rule model.\" ;\n    rdfs:domain sddt:VirtualModel ;\n    rdfs:range xsd:string .\n\nsddt:hasHyperparameters a owl:DatatypeProperty ;\n    rdfs:label \"has hyperparameters\" ;\n    rdfs:comment \"Hyperparameters used by the tool, stored as a JSON string.\" ;\n    rdfs:domain sddt:Tool ;\n    rdfs:range xsd:string .\n\nsddt:hasInputVariables a owl:DatatypeProperty ;\n    rdfs:label \"has input variables\" ;\n    rdfs:comment \"Input variables consumed by the tool during service execution.\" ;\n    rdfs:domain sddt:ServiceLog ;\n    rdfs:range xsd:string .\n\nsddt:hasManufacturer a owl:DatatypeProperty ;\n    rdfs:label \"has manufacturer\" ;\n    rdfs:comment \"Manufacturer name of equipment.\" ;\n    rdfs:domain sddt:Equipment ;\n    rdfs:range xsd:string .\n\nsddt:hasModelDescription a owl:DatatypeProperty ;\n    rdfs:label \"has model description\" ;\n    rdfs:comment \"Textual description of the physical model scope and assumptions.\" ;\n    rdfs:domain sddt:PhysicalModel ;\n    rdfs:range xsd:string .\n\nsddt:hasModeler a owl:DatatypeProperty ;\n    rdfs:label \"has modeler\" ;\n    rdfs:comment \"Name or identifier of the person or team who created the virtual model.\" ;\n    rdfs:domain sddt:VirtualModel ;\n    rdfs:range xsd:string .\n\nsddt:hasModelingDate a owl:DatatypeProperty ;\n    rdfs:label \"has modeling date\" ;\n    rdfs:comment \"Date on which the virtual model was created or last revised.\" ;\n    rdfs:domain sddt:VirtualModel ;\n    rdfs:range xsd:dateTime .\n\nsddt:hasOutputVariables a owl:DatatypeProperty ;\n    rdfs:label \"has output variables\" ;\n    rdfs:comment \"Output variables generated by the tool during service execution.\" ;\n    rdfs:domain sddt:ServiceLog ;\n    rdfs:range xsd:string .\n\nsddt:hasPhysicalEntityId a owl:DatatypeProperty ;\n    rdfs:label \"has physical entity id\" ;\n    rdfs:comment \"Unique identifier for a PhysicalEntity.\" ;\n    rdfs:domain sddt:PhysicalEntity ;\n    rdfs:range xsd:string ;\n    rdfs:subPropertyOf sddt:hasId .\n\nsddt:hasPhysicalEntityName a owl:DatatypeProperty ;\n    rdfs:label \"has physical entity name\" ;\n    rdfs:comment \"Human-readable name of a PhysicalEntity.\" ;\n    rdfs:domain sddt:PhysicalEntity ;\n    rdfs:range xsd:string .\n\nsddt:hasPhysicalEntityType a owl:DatatypeProperty ;\n    rdfs:label \"has physical entity type\" ;\n    rdfs:comment \"Type label for a PhysicalEntity.\" ;\n    rdfs:domain sddt:PhysicalEntity ;\n    rdfs:range xsd:string .\n\nsddt:hasPointType a owl:DatatypeProperty ;\n    rdfs:label \"has point type\" ;\n    rdfs:comment \"Point type label such as sensor, setpoint, or command.\" ;\n    rdfs:domain sddt:Point ;\n    rdfs:range xsd:string .\n\nsddt:hasSensor a owl:ObjectProperty ;\n    rdfs:label \"has sensor\" ;\n    rdfs:comment \"Sensor point used in the loop.\" ;\n    rdfs:domain sddt:ControlLoop ;\n    rdfs:range sddt:Point .\n\nsddt:hasServiceInvocationID a owl:DatatypeProperty,\n        owl:FunctionalProperty ;\n    rdfs:label \"has service invocation ID\" ;\n    rdfs:comment \"Identifier of one service execution, recorded on the sddt:ServiceLog generated for that execution.\" ;\n    rdfs:domain sddt:ServiceLog ;\n    rdfs:range xsd:string .\n\nsddt:hasServiceLatency a owl:DatatypeProperty,\n        owl:FunctionalProperty ;\n    rdfs:label \"has service latency\" ;\n    rdfs:comment \"Time required to complete one service execution; a quality-of-service metric recorded on the sddt:ServiceLog of that execution.\" ;\n    rdfs:domain sddt:ServiceLog ;\n    rdfs:range xsd:decimal .\n\nsddt:hasServiceOutput a owl:ObjectProperty ;\n    rdfs:label \"has service output\" ;\n    rdfs:comment \"AI Agent produced service output recorded as DTData.\" ;\n    rdfs:domain sddt:AIAgent ;\n    rdfs:range sddt:DTData .\n\nsddt:hasServiceStatus a owl:DatatypeProperty,\n        owl:FunctionalProperty ;\n    rdfs:label \"has service status\" ;\n    rdfs:comment \"Status of the service invocation event, such as completed, failed, or in progress.\" ;\n    rdfs:domain sddt:ServiceLog ;\n    rdfs:range xsd:string .\n\nsddt:hasSetpoint a owl:ObjectProperty ;\n    rdfs:label \"has setpoint\" ;\n    rdfs:comment \"Setpoint point used in the loop.\" ;\n    rdfs:domain sddt:ControlLoop ;\n    rdfs:range sddt:Point .\n\nsddt:hasSpatialDimension a owl:DatatypeProperty ;\n    rdfs:label \"has spatial dimension\" ;\n    rdfs:comment \"Spatial dimension metadata for a geometric model.\" ;\n    rdfs:domain sddt:GeometricModel ;\n    rdfs:range xsd:string .\n\nsddt:hasStartTime a owl:DatatypeProperty,\n        owl:FunctionalProperty ;\n    rdfs:label \"has start time\" ;\n    rdfs:comment \"Time at which the execution was requested.\" ;\n    rdfs:domain sddt:ServiceLog ;\n    rdfs:range xsd:dateTime .\n\nsddt:hasSystemCondition a owl:DatatypeProperty ;\n    rdfs:label \"has system condition\" ;\n    rdfs:comment \"System condition outcome label such as normal or faulty, as determined by the rule model.\" ;\n    rdfs:domain sddt:DTData ;\n    rdfs:range xsd:string .\n\nsddt:hasSystemMessage a owl:DatatypeProperty ;\n    rdfs:label \"has system message\" ;\n    rdfs:comment \"System message describing the target system and operating context provided to the tool.\" ;\n    rdfs:domain sddt:Tool ;\n    rdfs:range xsd:string .\n\nsddt:hasSystemThreshold a owl:DatatypeProperty ;\n    rdfs:label \"has system threshold\" ;\n    rdfs:comment \"Threshold value used by the rule model to evaluate system state deviation.\" ;\n    rdfs:domain sddt:RuleModel ;\n    rdfs:range xsd:decimal .\n\nsddt:hasTargetAlgorithm a owl:DatatypeProperty ;\n    rdfs:label \"has target algorithm\" ;\n    rdfs:comment \"Refers to the code or functions written for the algorithms used to operate the tool.\" ;\n    rdfs:domain sddt:Tool ;\n    rdfs:range xsd:string .\n\nsddt:hasTargetLoop a owl:DatatypeProperty ;\n    rdfs:label \"has target loop\" ;\n    rdfs:comment \"Target loop name or identifier.\" ;\n    rdfs:domain sddt:ControlLoop ;\n    rdfs:range xsd:string .\n\nsddt:hasTimestamp a owl:DatatypeProperty ;\n    rdfs:label \"has timestamp\" ;\n    rdfs:comment \"Timestamp of a DTData record.\" ;\n    rdfs:domain sddt:DTData ;\n    rdfs:range xsd:dateTime .\n\nsddt:hasTokenUsage a owl:DatatypeProperty ;\n    rdfs:label \"has token usage\" ;\n    rdfs:comment \"Input, output, and reasoning tokens consumed by the agent during the execution.\" ;\n    rdfs:domain sddt:ServiceLog ;\n    rdfs:range xsd:string .\n\nsddt:hasToolCallCount a owl:DatatypeProperty,\n        owl:FunctionalProperty ;\n    rdfs:label \"has tool call count\" ;\n    rdfs:comment \"Number of tool calls made by the agent during the execution.\" ;\n    rdfs:domain sddt:ServiceLog ;\n    rdfs:range xsd:integer .\n\nsddt:hasToolId a owl:DatatypeProperty ;\n    rdfs:label \"has tool id\" ;\n    rdfs:comment \"Unique identifier for a Tool.\" ;\n    rdfs:domain sddt:Tool ;\n    rdfs:range xsd:string ;\n    rdfs:subPropertyOf sddt:hasId .\n\nsddt:hasUnit a owl:DatatypeProperty ;\n    rdfs:label \"has unit\" ;\n    rdfs:comment \"Unit of measurement for a DTData value.\" ;\n    rdfs:domain sddt:DTData ;\n    rdfs:range xsd:string .\n\nsddt:hasValue a owl:DatatypeProperty ;\n    rdfs:label \"has value\" ;\n    rdfs:comment \"Stored value of a DTData instance.\" ;\n    rdfs:domain sddt:DTData ;\n    rdfs:range xsd:string .\n\nsddt:hasVirtualModelId a owl:DatatypeProperty ;\n    rdfs:label \"has virtual model id\" ;\n    rdfs:comment \"Unique identifier for a VirtualModel instance.\" ;\n    rdfs:domain sddt:VirtualModel ;\n    rdfs:range xsd:string ;\n    rdfs:subPropertyOf sddt:hasId .\n\nsddt:isInputOf a owl:ObjectProperty ;\n    rdfs:label \"is input of\" ;\n    rdfs:comment \"Inverse of hasInput.\" ;\n    rdfs:domain sddt:Entity ;\n    rdfs:range sddt:Entity ;\n    owl:inverseOf sddt:hasInput .\n\nsddt:isInvokedBy a owl:ObjectProperty ;\n    rdfs:label \"is invoked by\" ;\n    rdfs:comment \"Inverse of invokesService. Links the executing Tool to the AIAgent that invoked it.\" ;\n    rdfs:domain sddt:Tool ;\n    rdfs:range sddt:AIAgent ;\n    owl:inverseOf sddt:invokesService .\n\nsddt:isLinkedWith a owl:ObjectProperty ;\n    rdfs:label \"is linked with\" ;\n    rdfs:comment \"Links virtual models that are coupled or mutually dependent.\" ;\n    rdfs:domain sddt:VirtualModel ;\n    rdfs:range sddt:VirtualModel .\n\nsddt:isPartOf a owl:ObjectProperty ;\n    rdfs:label \"is part of\" ;\n    rdfs:comment \"Inverse of hasPart.\" ;\n    rdfs:domain sddt:Entity ;\n    rdfs:range sddt:Entity ;\n    owl:inverseOf sddt:hasPart .\n\nsddt:isVirtualDataOf a owl:ObjectProperty ;\n    rdfs:label \"is virtual data of\" ;\n    rdfs:comment \"Inverse of hasVirtualData.\" ;\n    rdfs:domain sddt:DTData ;\n    rdfs:range sddt:PhysicalEntity ;\n    owl:inverseOf sddt:hasVirtualData .\n\nsddt:referencesModel a owl:ObjectProperty ;\n    rdfs:label \"references model\" ;\n    rdfs:comment \"VirtualModelData references the model that generated it.\" ;\n    rdfs:domain sddt:VirtualModelData ;\n    rdfs:range sddt:VirtualModel .\n\nsddt:targetsComponent a owl:ObjectProperty ;\n    rdfs:label \"targets component\" ;\n    rdfs:comment \"ModelParameter references the target physical component.\" ;\n    rdfs:domain sddt:ModelParameter ;\n    rdfs:range sddt:PhysicalEntity .\n\nsddt:targetsControlLoop a owl:ObjectProperty ;\n    rdfs:label \"targets control loop\" ;\n    rdfs:comment \"VirtualModel targets a specific control loop.\" ;\n    rdfs:domain sddt:VirtualModel ;\n    rdfs:range sddt:ControlLoop .\n\nsddt:targetsModel a owl:ObjectProperty ;\n    rdfs:label \"targets model\" ;\n    rdfs:comment \"ModelParameter references the target virtual model.\" ;\n    rdfs:domain sddt:ModelParameter ;\n    rdfs:range sddt:VirtualModel .\n\nsddt:targetsSensor a owl:ObjectProperty ;\n    rdfs:label \"targets sensor\" ;\n    rdfs:comment \"SensorData references the target sensing point.\" ;\n    rdfs:domain sddt:SensorData ;\n    rdfs:range sddt:Point .\n\nsddt:targetsSystem a owl:ObjectProperty ;\n    rdfs:label \"targets system\" ;\n    rdfs:comment \"VirtualModel targets a PhysicalEntity it is intended to represent.\" ;\n    rdfs:domain sddt:VirtualModel ;\n    rdfs:range sddt:PhysicalEntity .\n\nsddt:targetsTool a owl:ObjectProperty ;\n    rdfs:label \"targets tool\" ;\n    rdfs:comment \"ToolData references the tool that produced or consumed it.\" ;\n    rdfs:domain sddt:ToolData ;\n    rdfs:range sddt:Tool .\n\nsddt:targetsVariable a owl:DatatypeProperty ;\n    rdfs:label \"targets variable\" ;\n    rdfs:comment \"Name of the target variable represented by the data.\" ;\n    rdfs:domain sddt:DTData ;\n    rdfs:range xsd:string .\n\nsddt:BehaviorModel a owl:Class ;\n    rdfs:label \"Behavior Model\" ;\n    rdfs:comment \"VirtualModel capturing expert-defined control logic and system behavioural patterns.\" ;\n    rdfs:subClassOf sddt:VirtualModel .\n\nsddt:InteractionTool a owl:Class ;\n    rdfs:label \"Interaction Tool\" ;\n    rdfs:comment \"A tool that supports human or agent interaction with the DT environment.\" ;\n    rdfs:subClassOf sddt:Tool .\n\nsddt:PhysicalModel a owl:Class ;\n    rdfs:label \"Physical Model\" ;\n    rdfs:comment \"VirtualModel defined primarily by governing physical equations representing first-principles system behaviour.\" ;\n    rdfs:subClassOf sddt:VirtualModel .\n\nsddt:SensorData a owl:Class ;\n    rdfs:label \"Sensor Data\" ;\n    rdfs:comment \"DTData that originates from physical sensing points.\" ;\n    rdfs:subClassOf sddt:DTData .\n\nsddt:ToolData a owl:Class ;\n    rdfs:label \"Tool Data\" ;\n    rdfs:comment \"DTData produced or used by a tool execution.\" ;\n    rdfs:subClassOf sddt:DTData .\n\nsddt:VirtualModelData a owl:Class ;\n    rdfs:label \"Virtual Model Data\" ;\n    rdfs:comment \"DTData generated by a VirtualModel such as predictions, estimates, or residuals.\" ;\n    rdfs:subClassOf sddt:DTData .\n\nsddt:generates a owl:ObjectProperty ;\n    rdfs:label \"generates\" ;\n    rdfs:comment \"Entity produces DTData as output.\" ;\n    rdfs:domain sddt:Entity ;\n    rdfs:range sddt:DTData .\n\nsddt:hasPart a owl:ObjectProperty ;\n    rdfs:label \"has part\" ;\n    rdfs:comment \"Whole-part compositional relationship between entities.\" ;\n    rdfs:domain sddt:Entity ;\n    rdfs:range sddt:Entity .\n\nsddt:hasVirtualData a owl:ObjectProperty ;\n    rdfs:label \"has virtual data\" ;\n    rdfs:comment \"PhysicalEntity is associated with DTData representing its measured or estimated state.\" ;\n    rdfs:domain sddt:PhysicalEntity ;\n    rdfs:range sddt:DTData .\n\nsddt:hasVirtualModel a owl:ObjectProperty ;\n    rdfs:label \"has virtual model\" ;\n    rdfs:comment \"PhysicalEntity is associated with a VirtualModel representing it.\" ;\n    rdfs:domain sddt:PhysicalEntity ;\n    rdfs:range sddt:VirtualModel .\n\nsddt:invokesService a owl:ObjectProperty ;\n    rdfs:label \"invokes service\" ;\n    rdfs:comment \"AIAgent invokes a Tool to execute a service; each execution is recorded as a sddt:ServiceLog generated by the Tool and the AI agent.\" ;\n    rdfs:domain sddt:AIAgent ;\n    rdfs:range sddt:Tool .\n\nsddt:isVirtualModelOf a owl:ObjectProperty ;\n    rdfs:label \"is virtual model of\" ;\n    rdfs:comment \"Inverse of hasVirtualModel.\" ;\n    rdfs:domain sddt:VirtualModel ;\n    rdfs:range sddt:PhysicalEntity ;\n    owl:inverseOf sddt:hasVirtualModel .\n\nsddt:Equipment a owl:Class ;\n    rdfs:label \"Equipment\" ;\n    rdfs:comment \"A physical equipment unit such as an AHU, VAV, fan, or coil.\" ;\n    rdfs:subClassOf sddt:PhysicalEntity .\n\nsddt:GeometricModel a owl:Class ;\n    rdfs:label \"Geometric Model\" ;\n    rdfs:comment \"VirtualModel describing spatial geometry, coordinates, and dimensional properties of physical locations.\" ;\n    rdfs:subClassOf sddt:VirtualModel .\n\nsddt:ModelParameter a owl:Class ;\n    rdfs:label \"Model Parameter\" ;\n    rdfs:comment \"DTData storing parameter values associated with a specific model or component.\" ;\n    rdfs:subClassOf sddt:DTData .\n\nsddt:RuleModel a owl:Class ;\n    rdfs:label \"Rule Model\" ;\n    rdfs:comment \"VirtualModel encoded as threshold-based diagnostic or control rules, such as those used in fault detection and diagnosis.\" ;\n    rdfs:subClassOf sddt:VirtualModel .\n\nsddt:isGeneratedBy a owl:ObjectProperty ;\n    rdfs:label \"is generated by\" ;\n    rdfs:comment \"Inverse of generates.\" ;\n    rdfs:domain sddt:DTData ;\n    rdfs:range sddt:Entity ;\n    owl:inverseOf sddt:generates .\n\nsddt:hasInput a owl:ObjectProperty ;\n    rdfs:label \"has input\" ;\n    rdfs:comment \"Entity consumes another entity as an input for service execution or reasoning.\" ;\n    rdfs:domain sddt:Entity ;\n    rdfs:range sddt:Entity .\n\nsddt:hasId a owl:DatatypeProperty ;\n    rdfs:label \"has id\" ;\n    rdfs:comment \"Unique identifier of an entity.\" ;\n    rdfs:domain sddt:Entity ;\n    rdfs:range xsd:string .\n\nsddt:ControlLoop a owl:Class ;\n    rdfs:label \"Control Loop\" ;\n    rdfs:comment \"A control loop that links sensors, control variables, setpoints, and actuators.\" ;\n    rdfs:subClassOf sddt:PhysicalEntity .\n\nsddt:Point a owl:Class ;\n    rdfs:label \"Point\" ;\n    rdfs:comment \"A physical sensing or actuation point including sensor, command, and setpoint points.\" ;\n    rdfs:subClassOf sddt:PhysicalEntity .\n\nsddt:AIAgent a owl:Class ;\n    rdfs:label \"AI Agent\" ;\n    rdfs:comment \"Autonomous system that perceives, reasons, and acts to achieve objectives by invoking tools. AI Agent is a Service executor in the 6DDT framework.\" ;\n    rdfs:subClassOf [ a owl:Restriction ;\n            owl:onProperty sddt:hasInput ;\n            owl:someValuesFrom sddt:Entity ],\n        sddt:Entity .\n\nsddt:ServiceLog a owl:Class ;\n    rdfs:label \"Service Log\" ;\n    rdfs:comment \"Record of one service execution. A new individual is generated by the executing Tool and the invoking AI agent for every request and is not modified after the execution closes; the Tool and the agent stay persistent individuals. Service is not a class of its own: it exists as these records.\" ;\n    rdfs:subClassOf [ a owl:Restriction ;\n            owl:onClass sddt:Tool ;\n            owl:onProperty sddt:isGeneratedBy ;\n            owl:qualifiedCardinality \"1\"^^xsd:nonNegativeInteger ],\n        [ a owl:Restriction ;\n            owl:onClass sddt:AIAgent ;\n            owl:onProperty sddt:isGeneratedBy ;\n            owl:qualifiedCardinality \"1\"^^xsd:nonNegativeInteger ],\n        sddt:DTData .\n\nsddt:Tool a owl:Class ;\n    rdfs:label \"Tool\" ;\n    rdfs:comment \"Software capability that executes tasks and produces outputs. Tool is a Service executor in the 6DDT framework.\" ;\n    rdfs:subClassOf [ a owl:Restriction ;\n            owl:onProperty sddt:hasInput ;\n            owl:someValuesFrom sddt:Entity ],\n        sddt:Entity .\n\nsddt:PhysicalEntity a owl:Class ;\n    rdfs:label \"Physical Entity\" ;\n    rdfs:comment \"Real-world manufactured product, system, or space that exists physically and has measurable characteristics across its lifecycle.\" ;\n    rdfs:subClassOf sddt:Entity .\n\nsddt:VirtualModel a owl:Class ;\n    rdfs:label \"Virtual Model\" ;\n    rdfs:comment \"Formal representation used to approximate, simulate, estimate, or calibrate behaviour or state under defined assumptions.\" ;\n    rdfs:subClassOf [ a owl:Restriction ;\n            owl:onProperty sddt:isVirtualModelOf ;\n            owl:someValuesFrom sddt:PhysicalEntity ],\n        sddt:Entity .\n\nsddt:DTData a owl:Class ;\n    rdfs:label \"DT Data\" ;\n    rdfs:comment \"Structured or unstructured records of measured, observed, or derived values describing system state over time.\" ;\n    rdfs:subClassOf sddt:Entity .\n\nsddt:Entity a owl:Class ;\n    rdfs:label \"Entity\" ;\n    rdfs:comment \"Top-level concept for anything represented in a 6D digital twin.\" .\n\n"}, {"name": "VB_schema.ttl", "path": "files/VB_schema.ttl", "role": "vb", "title": "VB schema (virtual building models)", "version": "1.0.0", "size": 7253, "modified": "2026-10-30 17:48", "text": "@prefix vb:      <https://skku-bist.github.io/method#> .\n@prefix owl:     <http://www.w3.org/2002/07/owl#> .\n@prefix rdf:     <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .\n@prefix rdfs:    <http://www.w3.org/2000/01/rdf-schema#> .\n@prefix xsd:     <http://www.w3.org/2001/XMLSchema#> .\n\n# =====================================================================\n# VB schema 1.0.0 (virtual building models), as published at https://skku-bist.github.io/method\n#   J. Lee, S. Yoon, Metadata schema for virtual building models in digital twins: VB schema\n#   implemented in GPT-based applications, Energy and Buildings 327 (2025) 115039.\n#   https://doi.org/10.1016/j.enbuild.2024.115039\n#   Classes and the eight relationships follow the published Method page; the website gives\n#   no namespace, so the one used in the 6DDT paper is used (vb: <https://skku-bist.github.io/method#>).\n#   The datatype properties come from the project file VB_schema.ttl used in the 6DDT study.\n# =====================================================================\n\n<https://skku-bist.github.io/method> a owl:Ontology ;\n    rdfs:label \"VB schema (virtual building models)\" ;\n    rdfs:comment \"Metadata schema that describes virtual building models representing physical behaviors in DT-enabled building operations: the data they use or produce and the semantic relationships among their sub-models.\" ;\n    owl:versionInfo \"1.0.0\" ;\n    rdfs:seeAlso <https://skku-bist.github.io/> , <https://doi.org/10.1016/j.enbuild.2024.115039> .\n\n#################################################################\n# Data classes\n#################################################################\n\nvb:Data a owl:Class ;\n    rdfs:label \"Data\" ;\n    rdfs:comment \"Data used or generated by virtual building models.\" .\n\nvb:OnSiteData a owl:Class ;\n    rdfs:subClassOf vb:Data ;\n    rdfs:label \"On-site data\" ;\n    rdfs:comment \"Operational data collected by the physical sensing network of the target building.\" .\n\nvb:NonintrusiveData a owl:Class ;\n    rdfs:subClassOf vb:OnSiteData ;\n    rdfs:label \"Nonintrusive data\" ;\n    rdfs:comment \"On-site data from the sensors already built into the building.\" .\n\nvb:IntrusiveData a owl:Class ;\n    rdfs:subClassOf vb:OnSiteData ;\n    rdfs:label \"Intrusive data\" ;\n    rdfs:comment \"On-site data from temporary devices installed for measurement.\" .\n\nvb:OffSiteData a owl:Class ;\n    rdfs:subClassOf vb:Data ;\n    rdfs:label \"Off-site data\" ;\n    rdfs:comment \"Data obtained from outside the building's sensing network, such as simulated or open data.\" .\n\nvb:VirtualData a owl:Class ;\n    rdfs:subClassOf vb:Data ;\n    rdfs:label \"Virtual data\" ;\n    rdfs:comment \"Data calculated by virtual models; it extends the sensing range and helps validate and calibrate physical and virtual data.\" .\n\n#################################################################\n# Virtual model classes\n#################################################################\n\nvb:VirtualModel a owl:Class ;\n    rdfs:label \"Virtual model\" ;\n    rdfs:comment \"Mathematical representation of the physical behavior of a building in operation.\" .\n\nvb:BehaviorModel a owl:Class ;\n    rdfs:subClassOf vb:VirtualModel ;\n    rdfs:label \"Behavior model\" ;\n    rdfs:comment \"Describes the physical-mathematical behavior of the target building operation.\" .\n\nvb:ObservedModel a owl:Class ;\n    rdfs:subClassOf vb:BehaviorModel ;\n    rdfs:label \"Observed model\" ;\n    rdfs:comment \"Behavior model whose output is measured by a physical sensor.\" .\n\nvb:UnobservedModel a owl:Class ;\n    rdfs:subClassOf vb:BehaviorModel ;\n    rdfs:label \"Unobserved model\" ;\n    rdfs:comment \"Behavior model whose output cannot be measured physically, or not reliably.\" .\n\nvb:CorrectionModel a owl:Class ;\n    rdfs:subClassOf vb:VirtualModel ;\n    rdfs:label \"Correction model\" ;\n    rdfs:comment \"Explains the gap between ground-truth values and the behavior model output; used to recalibrate the behavior model.\" .\n\nvb:DistanceModel a owl:Class ;\n    rdfs:subClassOf vb:VirtualModel ;\n    rdfs:label \"Distance model\" ;\n    rdfs:comment \"Verifies and validates behavior or correction models; an objective function between virtual output and its measured counterpart.\" .\n\n#################################################################\n# Relationships (model-model, model-data, model-physical entity, model-application)\n#################################################################\n\nvb:isAssembledWith a owl:ObjectProperty ;\n    rdfs:label \"is assembled with\" ;\n    rdfs:domain vb:BehaviorModel ;\n    rdfs:range  vb:VirtualModel ;\n    rdfs:comment \"The output of the behavior model becomes an input of the object virtual model through model assembly.\" .\n\nvb:isLinkedWith a owl:ObjectProperty ;\n    rdfs:label \"is linked with\" ;\n    rdfs:domain vb:BehaviorModel ;\n    rdfs:range  vb:DistanceModel ;\n    rdfs:comment \"The output of the behavior model becomes an input of the distance model, which serves as an objective function.\" .\n\nvb:calibrates a owl:ObjectProperty ;\n    rdfs:label \"calibrates\" ;\n    rdfs:domain vb:CorrectionModel ;\n    rdfs:range  vb:BehaviorModel ;\n    rdfs:comment \"The correction model improves the behavior model.\" .\n\nvb:estimates a owl:ObjectProperty ;\n    rdfs:label \"estimates\" ;\n    rdfs:domain vb:DistanceModel ;\n    rdfs:range  vb:VirtualModel ;\n    rdfs:comment \"The distance model estimates parameters of the correction or behavior model.\" .\n\nvb:isInputOf a owl:ObjectProperty ;\n    rdfs:label \"is input of\" ;\n    rdfs:domain vb:Data ;\n    rdfs:range  vb:VirtualModel ;\n    rdfs:comment \"The data is an input variable of the virtual model.\" .\n\nvb:hasVirtualData a owl:ObjectProperty ;\n    rdfs:label \"has virtual data\" ;\n    rdfs:domain vb:VirtualModel ;\n    rdfs:range  vb:VirtualData ;\n    rdfs:comment \"The virtual model produces the virtual data as output.\" .\n\nvb:isUsedFor a owl:ObjectProperty ;\n    rdfs:label \"is used for\" ;\n    rdfs:domain vb:VirtualModel ;\n    rdfs:comment \"The virtual model supports the object application.\" .\n\nvb:isVirtualModelOf a owl:ObjectProperty ;\n    rdfs:label \"is virtual model of\" ;\n    rdfs:domain vb:VirtualModel ;\n    rdfs:comment \"The virtual model represents the behavior of the object physical entity (for example a Brick entity).\" .\n\n#################################################################\n# Datatype properties\n#################################################################\n\nvb:modelName a owl:DatatypeProperty ;\n    rdfs:label \"model name\" ;\n    rdfs:domain vb:VirtualModel ;\n    rdfs:range xsd:string ;\n    rdfs:comment \"Name or identifier of the virtual model.\" .\n\nvb:modeler a owl:DatatypeProperty ;\n    rdfs:label \"modeler\" ;\n    rdfs:domain vb:VirtualModel ;\n    rdfs:range xsd:string ;\n    rdfs:comment \"Person or entity who developed the virtual model.\" .\n\nvb:modelingApproach a owl:DatatypeProperty ;\n    rdfs:label \"modeling approach\" ;\n    rdfs:domain vb:VirtualModel ;\n    rdfs:range xsd:string ;\n    rdfs:comment \"Modeling approach such as white-box, black-box, or grey-box.\" .\n\nvb:modelAccuracy a owl:DatatypeProperty ;\n    rdfs:label \"model accuracy\" ;\n    rdfs:domain vb:BehaviorModel ;\n    rdfs:range xsd:string ;\n    rdfs:comment \"Accuracy metric of the behavior model (e.g., RMSE, CVRMSE).\" .\n"}, {"name": "6DDT-shapes.ttl", "path": "files/6DDT-shapes.ttl", "role": "shapes", "title": "6DDT SHACL shapes", "version": "", "size": 6902, "modified": "2026-10-30 17:42", "text": "@prefix sddt: <https://skku-bist.github.io/assets/6DDT_schema.ttl#> .\n@prefix sh:   <http://www.w3.org/ns/shacl#> .\n@prefix owl:  <http://www.w3.org/2002/07/owl#> .\n@prefix rdf:  <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .\n@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .\n@prefix xsd:  <http://www.w3.org/2001/XMLSchema#> .\n\n# =====================================================================\n# 6DDT SHACL shapes\n#   Data-quality rules for a 6DDT knowledge graph. Run them on the graph after inverse\n#   properties are inferred (owl:inverseOf), so that a log stated with sddt:generates\n#   is also checked through sddt:isGeneratedBy.\n#   Violation = the record is wrong; Warning = the record is incomplete but usable.\n# =====================================================================\n\n<https://skku-bist.github.io/assets/6DDT-shapes.ttl> a owl:Ontology ;\n    rdfs:label \"6DDT SHACL shapes\" ;\n    rdfs:comment \"Checks that every service execution is recorded as one service log generated by exactly one tool and one AI agent, and that executors, control loops, rule models, and sensor data carry the identifiers and links the 6DDT schema expects.\" ;\n    sh:declare [ sh:prefix \"sddt\" ; sh:namespace \"https://skku-bist.github.io/assets/6DDT_schema.ttl#\"^^xsd:anyURI ] .\n\n# --- Service log: one record per execution -----------------------------------\n\nsddt:ServiceLogShape a sh:NodeShape ;\n    rdfs:label \"Service log\" ;\n    rdfs:comment \"One record per execution, generated by exactly one tool and one AI agent.\" ;\n    sh:targetClass sddt:ServiceLog ;\n    sh:property [\n        sh:path sddt:hasServiceInvocationID ; sh:name \"service invocation ID\" ;\n        sh:minCount 1 ; sh:maxCount 1 ; sh:datatype xsd:string ;\n        sh:message \"A service log needs exactly one invocation ID.\" ] ,\n      [ sh:path sddt:isGeneratedBy ; sh:name \"generating tool\" ;\n        sh:qualifiedValueShape [ sh:class sddt:Tool ] ;\n        sh:qualifiedMinCount 1 ; sh:qualifiedMaxCount 1 ;\n        sh:message \"A service log must be generated by exactly one tool.\" ] ,\n      [ sh:path sddt:isGeneratedBy ; sh:name \"generating AI agent\" ;\n        sh:qualifiedValueShape [ sh:class sddt:AIAgent ] ;\n        sh:qualifiedMinCount 1 ; sh:qualifiedMaxCount 1 ;\n        sh:message \"A service log must be generated by exactly one AI agent.\" ] ,\n      [ sh:path sddt:hasServiceStatus ; sh:name \"service status\" ;\n        sh:minCount 1 ; sh:maxCount 1 ; sh:in ( \"completed\" \"failed\" \"in progress\" ) ;\n        sh:message \"Service status must be one of: completed, failed, in progress.\" ] ,\n      [ sh:path sddt:hasServiceLatency ; sh:name \"service latency\" ;\n        sh:maxCount 1 ; sh:datatype xsd:decimal ; sh:minInclusive 0 ;\n        sh:message \"Service latency is one non-negative decimal (seconds).\" ] ,\n      [ sh:path sddt:hasStartTime ; sh:name \"start time\" ;\n        sh:minCount 1 ; sh:maxCount 1 ; sh:datatype xsd:dateTime ;\n        sh:lessThanOrEquals sddt:hasEndTime ;\n        sh:message \"A log needs one start time, no later than its end time.\" ] ,\n      [ sh:path sddt:hasEndTime ; sh:name \"end time\" ;\n        sh:maxCount 1 ; sh:datatype xsd:dateTime ] ,\n      [ sh:path sddt:hasFaultStatus ; sh:name \"fault status\" ;\n        sh:maxCount 1 ; sh:in ( \"normal\" \"faulty\" ) ;\n        sh:message \"Fault status must be normal or faulty.\" ] ,\n      [ sh:path sddt:hasToolCallCount ; sh:name \"tool call count\" ;\n        sh:minCount 1 ; sh:datatype xsd:integer ; sh:severity sh:Warning ;\n        sh:message \"The number of tool calls is not recorded for this execution.\" ] ,\n      [ sh:path sddt:hasInput ; sh:name \"input\" ;\n        sh:minCount 1 ; sh:severity sh:Warning ;\n        sh:message \"The log does not say what the execution used as input.\" ] .\n\n# A completed diagnostic run must state its outcome\nsddt:CompletedDiagnosisShape a sh:NodeShape ;\n    rdfs:label \"Completed diagnosis\" ;\n    rdfs:comment \"A completed execution that has a fault status also needs its latency and end time.\" ;\n    sh:targetClass sddt:ServiceLog ;\n    sh:sparql [ a sh:SPARQLConstraint ;\n        sh:message \"A completed execution needs a latency and an end time.\" ;\n        sh:prefixes <https://skku-bist.github.io/assets/6DDT-shapes.ttl> ;\n        sh:select \"\"\"SELECT $this WHERE {\n            $this sddt:hasServiceStatus \"completed\" .\n            FILTER ( NOT EXISTS { $this sddt:hasServiceLatency ?l } || NOT EXISTS { $this sddt:hasEndTime ?e } )\n        }\"\"\" ] .\n\n# --- Executors --------------------------------------------------------------\n\nsddt:ToolShape a sh:NodeShape ;\n    rdfs:label \"Tool\" ;\n    sh:targetClass sddt:Tool ;\n    sh:property [ sh:path sddt:hasToolId ; sh:name \"tool ID\" ; sh:minCount 1 ; sh:maxCount 1 ; sh:datatype xsd:string ;\n        sh:message \"A tool needs exactly one tool ID.\" ] .\n\nsddt:AIAgentShape a sh:NodeShape ;\n    rdfs:label \"AI agent\" ;\n    sh:targetClass sddt:AIAgent ;\n    sh:property [ sh:path sddt:hasAgentId ; sh:name \"agent ID\" ; sh:minCount 1 ; sh:maxCount 1 ; sh:datatype xsd:string ;\n        sh:message \"An AI agent needs exactly one agent ID.\" ] ,\n      [ sh:path sddt:invokesService ; sh:name \"invoked tool\" ; sh:class sddt:Tool ;\n        sh:message \"An AI agent invokes tools only.\" ] .\n\n# --- Physical entities and models -------------------------------------------\n\nsddt:ControlLoopShape a sh:NodeShape ;\n    rdfs:label \"Control loop\" ;\n    sh:targetClass sddt:ControlLoop ;\n    sh:property [ sh:path sddt:hasSensor ; sh:name \"sensor\" ; sh:minCount 1 ; sh:class sddt:Point ;\n        sh:message \"A control loop needs its sensor point.\" ] ,\n      [ sh:path sddt:hasSetpoint ; sh:name \"setpoint\" ; sh:minCount 1 ; sh:class sddt:Point ;\n        sh:message \"A control loop needs its setpoint point.\" ] ,\n      [ sh:path sddt:hasActuator ; sh:name \"actuator\" ; sh:minCount 1 ; sh:class sddt:Point ; sh:severity sh:Warning ;\n        sh:message \"The actuator of this control loop is not registered, so actuator faults cannot be traced.\" ] .\n\nsddt:RuleModelShape a sh:NodeShape ;\n    rdfs:label \"Rule model\" ;\n    sh:targetClass sddt:RuleModel ;\n    sh:property [ sh:path sddt:targetsControlLoop ; sh:name \"target control loop\" ; sh:minCount 1 ; sh:class sddt:ControlLoop ;\n        sh:message \"A rule model must target a control loop.\" ] ,\n      [ sh:path sddt:hasSystemThreshold ; sh:name \"system threshold\" ; sh:minCount 1 ; sh:maxCount 1 ; sh:datatype xsd:decimal ;\n        sh:message \"A rule model needs one decimal threshold.\" ] .\n\nsddt:SensorDataShape a sh:NodeShape ;\n    rdfs:label \"Sensor data\" ;\n    sh:targetClass sddt:SensorData ;\n    sh:property [ sh:path sddt:targetsSensor ; sh:name \"target sensor\" ; sh:minCount 1 ; sh:class sddt:Point ;\n        sh:message \"Sensor data must name the sensor point it comes from.\" ] ,\n      [ sh:path sddt:hasDTDataId ; sh:name \"DT data ID\" ; sh:minCount 1 ; sh:maxCount 1 ;\n        sh:message \"Sensor data needs one DT data ID.\" ] .\n"}, {"name": "6DDT-example.ttl", "path": "files/6DDT-example.ttl", "role": "data", "title": "", "version": "", "size": 15759, "modified": "2026-10-30 17:48", "text": "@prefix ex:    <https://skku-bist.github.io/data/6ddt-example#> .\n@prefix sddt:  <https://skku-bist.github.io/assets/6DDT_schema.ttl#> .\n@prefix brick: <https://brickschema.org/schema/Brick#> .\n@prefix vb:    <https://skku-bist.github.io/method#> .\n@prefix rdfs:  <http://www.w3.org/2000/01/rdf-schema#> .\n@prefix xsd:   <http://www.w3.org/2001/XMLSchema#> .\n\n# =====================================================================\n# 6DDT example knowledge graph (ILLUSTRATIVE)\n#   A fictional office floor with one air handling unit and two rooms, and an AI-agent\n#   fault detection and diagnosis (FDD) service that ran four times.\n#   Every name, ID, time, and value below is invented to show how the schema is used.\n#   It is NOT data from the building of the 6DDT paper.\n#   Inverse properties are written in one direction only; a reasoner adds the other.\n# =====================================================================\n\n# ---------------------------------------------------------------------\n# Physical entity (typed with 6DDT and with Brick)\n# ---------------------------------------------------------------------\nex:Floor_3 a sddt:Location , brick:Floor ;\n    rdfs:label \"Floor 3\" ; sddt:hasPhysicalEntityId \"PE-L-03\" ;\n    sddt:hasPart ex:Room_301 , ex:Room_302 .\nex:Room_301 a sddt:Location , brick:Room ; rdfs:label \"Room 301 (office)\" ; sddt:hasPhysicalEntityId \"PE-L-301\" .\nex:Room_302 a sddt:Location , brick:Room ; rdfs:label \"Room 302 (meeting room)\" ; sddt:hasPhysicalEntityId \"PE-L-302\" .\n\nex:AHU_1 a sddt:Equipment , brick:AHU ;\n    rdfs:label \"AHU-1\" ; sddt:hasPhysicalEntityId \"PE-E-AHU1\" ;\n    sddt:hasEquipmentType \"AHU\" ; sddt:hasManufacturer \"Example Air Co.\" .\nex:VAV_301 a sddt:Equipment , brick:VAV ; rdfs:label \"VAV-301\" ; sddt:hasPhysicalEntityId \"PE-E-VAV301\" ; sddt:hasEquipmentType \"VAV\" .\nex:VAV_302 a sddt:Equipment , brick:VAV ; rdfs:label \"VAV-302\" ; sddt:hasPhysicalEntityId \"PE-E-VAV302\" ; sddt:hasEquipmentType \"VAV\" .\n\nex:PT_301_Temp a sddt:Point , brick:Air_Temperature_Sensor ; rdfs:label \"Room 301 temperature\" ; sddt:hasPointType \"sensor\" .\nex:PT_301_SP   a sddt:Point , brick:Air_Temperature_Setpoint ; rdfs:label \"Room 301 temperature setpoint\" ; sddt:hasPointType \"setpoint\" .\nex:PT_301_Damper a sddt:Point , brick:Damper_Position_Command ; rdfs:label \"VAV-301 damper command\" ; sddt:hasPointType \"command\" .\nex:PT_302_Temp a sddt:Point , brick:Air_Temperature_Sensor ; rdfs:label \"Room 302 temperature\" ; sddt:hasPointType \"sensor\" .\nex:PT_302_SP   a sddt:Point , brick:Air_Temperature_Setpoint ; rdfs:label \"Room 302 temperature setpoint\" ; sddt:hasPointType \"setpoint\" .\nex:PT_302_Damper a sddt:Point , brick:Damper_Position_Command ; rdfs:label \"VAV-302 damper command\" ; sddt:hasPointType \"command\" .\nex:PT_SAT      a sddt:Point , brick:Supply_Air_Temperature_Sensor ; rdfs:label \"Supply air temperature\" ; sddt:hasPointType \"sensor\" .\nex:PT_SAT_SP   a sddt:Point , brick:Supply_Air_Temperature_Setpoint ; rdfs:label \"Supply air temperature setpoint\" ; sddt:hasPointType \"setpoint\" .\nex:PT_Valve    a sddt:Point , brick:Valve_Command ; rdfs:label \"Cooling coil valve command\" ; sddt:hasPointType \"command\" .\nex:PT_SAP      a sddt:Point , brick:Supply_Air_Static_Pressure_Sensor ; rdfs:label \"Supply air static pressure\" ; sddt:hasPointType \"sensor\" .\nex:PT_SAP_SP   a sddt:Point , brick:Supply_Air_Static_Pressure_Setpoint ; rdfs:label \"Static pressure setpoint\" ; sddt:hasPointType \"setpoint\" .\n\nex:Loop_301_Temp a sddt:ControlLoop ; rdfs:label \"Room 301 temperature loop\" ;\n    sddt:hasTargetLoop \"Room 301 indoor temperature\" ;\n    sddt:hasSensor ex:PT_301_Temp ; sddt:hasSetpoint ex:PT_301_SP ; sddt:hasActuator ex:PT_301_Damper ;\n    sddt:hasControlVariable ex:PT_301_Temp .\nex:Loop_302_Temp a sddt:ControlLoop ; rdfs:label \"Room 302 temperature loop\" ;\n    sddt:hasTargetLoop \"Room 302 indoor temperature\" ;\n    sddt:hasSensor ex:PT_302_Temp ; sddt:hasSetpoint ex:PT_302_SP ; sddt:hasActuator ex:PT_302_Damper ;\n    sddt:hasControlVariable ex:PT_302_Temp .\nex:Loop_SAT a sddt:ControlLoop ; rdfs:label \"Supply air temperature loop\" ;\n    sddt:hasTargetLoop \"AHU-1 supply air temperature\" ;\n    sddt:hasSensor ex:PT_SAT ; sddt:hasSetpoint ex:PT_SAT_SP ; sddt:hasActuator ex:PT_Valve .\n# The fan speed command of this loop is not registered yet (SHACL warning)\nex:Loop_SAP a sddt:ControlLoop ; rdfs:label \"Static pressure loop\" ;\n    sddt:hasTargetLoop \"AHU-1 supply air static pressure\" ;\n    sddt:hasSensor ex:PT_SAP ; sddt:hasSetpoint ex:PT_SAP_SP .\n\n# ---------------------------------------------------------------------\n# Virtual model (6DDT; the zone models are also VB observed behavior models)\n# ---------------------------------------------------------------------\nex:VM_301_Temp a sddt:PhysicalModel , vb:ObservedModel ; rdfs:label \"Room 301 temperature model\" ;\n    sddt:hasVirtualModelId \"VM-301-T\" ; sddt:hasModeler \"Example modeling team\" ;\n    sddt:hasModelingDate \"2026-01-15T00:00:00\"^^xsd:dateTime ;\n    sddt:hasModelDescription \"Grey-box zone temperature model\" ;\n    sddt:isVirtualModelOf ex:Room_301 ; sddt:targetsControlLoop ex:Loop_301_Temp ;\n    sddt:hasInput ex:SD_301_Temp ;\n    vb:isVirtualModelOf ex:Room_301 ; vb:hasVirtualData ex:VD_301_Temp ; vb:isLinkedWith ex:DM_301_Temp .\nex:DM_301_Temp a vb:DistanceModel ; rdfs:label \"Room 301 CV(RMSE) check\" ;\n    vb:modelName \"DM-301-T\" ; vb:estimates ex:VM_301_Temp .\nex:VM_302_Temp a sddt:PhysicalModel , vb:ObservedModel ; rdfs:label \"Room 302 temperature model\" ;\n    sddt:hasVirtualModelId \"VM-302-T\" ; sddt:hasModeler \"Example modeling team\" ;\n    sddt:isVirtualModelOf ex:Room_302 ; sddt:targetsControlLoop ex:Loop_302_Temp ;\n    sddt:hasInput ex:SD_302_Temp .\nex:VM_301_Damper a sddt:BehaviorModel ; rdfs:label \"VAV-301 damper behavior model\" ;\n    sddt:hasVirtualModelId \"VM-301-D\" ; sddt:hasBehaviorTarget \"Damper position response\" ;\n    sddt:isVirtualModelOf ex:VAV_301 ; sddt:targetsControlLoop ex:Loop_301_Temp ;\n    sddt:isLinkedWith ex:VM_301_Temp .\nex:GM_Floor_3 a sddt:GeometricModel ; rdfs:label \"Floor 3 geometry\" ;\n    sddt:hasVirtualModelId \"VM-F3-G\" ; sddt:hasCoordinateSystem \"Cartesian\" ; sddt:hasSpatialDimension \"3D\" ;\n    sddt:isVirtualModelOf ex:Floor_3 .\n\n# Rule models (four of the expert-defined rules, for each room)\nex:RM1_301 a sddt:RuleModel ; rdfs:label \"Rule 1, Room 301: setpoint satisfied\" ;\n    sddt:hasVirtualModelId \"RM-1-301\" ; sddt:targetsControlLoop ex:Loop_301_Temp ; sddt:targetsSystem ex:Room_301 ;\n    sddt:hasGoverningEquation \"|T_room - T_setpoint| <= threshold\" ; sddt:hasSystemThreshold 1.0 .\nex:RM2_301 a sddt:RuleModel ; rdfs:label \"Rule 2, Room 301: sensor fault\" ;\n    sddt:hasVirtualModelId \"RM-2-301\" ; sddt:targetsControlLoop ex:Loop_301_Temp ; sddt:targetsSystem ex:Room_301 ;\n    sddt:hasGoverningEquation \"|T_room - T_virtual| <= threshold\" ; sddt:hasSystemThreshold 0.8 .\nex:RM5_301 a sddt:RuleModel ; rdfs:label \"Rule 5.1, Room 301: supply air temperature loop\" ;\n    sddt:hasVirtualModelId \"RM-5.1-301\" ; sddt:targetsControlLoop ex:Loop_SAT ; sddt:targetsSystem ex:AHU_1 ;\n    sddt:hasGoverningEquation \"|T_supply - T_supply_setpoint| <= threshold\" ; sddt:hasSystemThreshold 1.5 .\nex:RM6_301 a sddt:RuleModel ; rdfs:label \"Rule 6.1, Room 301: supply air setpoint design\" ;\n    sddt:hasVirtualModelId \"RM-6.1-301\" ; sddt:targetsControlLoop ex:Loop_SAT ; sddt:targetsSystem ex:AHU_1 ;\n    sddt:hasGoverningEquation \"Room loop unsatisfied while supply loop tracks its setpoint\" ; sddt:hasSystemThreshold 1.0 .\nex:RM1_302 a sddt:RuleModel ; rdfs:label \"Rule 1, Room 302: setpoint satisfied\" ;\n    sddt:hasVirtualModelId \"RM-1-302\" ; sddt:targetsControlLoop ex:Loop_302_Temp ; sddt:targetsSystem ex:Room_302 ;\n    sddt:hasGoverningEquation \"|T_room - T_setpoint| <= threshold\" ; sddt:hasSystemThreshold 1.0 .\nex:RM2_302 a sddt:RuleModel ; rdfs:label \"Rule 2, Room 302: sensor fault\" ;\n    sddt:hasVirtualModelId \"RM-2-302\" ; sddt:targetsControlLoop ex:Loop_302_Temp ; sddt:targetsSystem ex:Room_302 ;\n    sddt:hasGoverningEquation \"|T_room - T_virtual| <= threshold\" ; sddt:hasSystemThreshold 0.8 .\nex:RM5_302 a sddt:RuleModel ; rdfs:label \"Rule 5.1, Room 302: supply air temperature loop\" ;\n    sddt:hasVirtualModelId \"RM-5.1-302\" ; sddt:targetsControlLoop ex:Loop_SAT ; sddt:targetsSystem ex:AHU_1 ;\n    sddt:hasGoverningEquation \"|T_supply - T_supply_setpoint| <= threshold\" ; sddt:hasSystemThreshold 1.5 .\nex:RM6_302 a sddt:RuleModel ; rdfs:label \"Rule 6.1, Room 302: supply air setpoint design\" ;\n    sddt:hasVirtualModelId \"RM-6.1-302\" ; sddt:targetsControlLoop ex:Loop_SAT ; sddt:targetsSystem ex:AHU_1 ;\n    sddt:hasGoverningEquation \"Room loop unsatisfied while supply loop tracks its setpoint\" ; sddt:hasSystemThreshold 1.0 .\n\n# ---------------------------------------------------------------------\n# DT data\n# ---------------------------------------------------------------------\nex:SD_301_Temp a sddt:SensorData , vb:NonintrusiveData ; rdfs:label \"Room 301 temperature readings\" ;\n    sddt:hasDTDataId \"D-301-T\" ; sddt:targetsSensor ex:PT_301_Temp ; sddt:hasUnit \"degC\" ;\n    sddt:isGeneratedBy ex:PT_301_Temp .\nex:SD_302_Temp a sddt:SensorData , vb:NonintrusiveData ; rdfs:label \"Room 302 temperature readings\" ;\n    sddt:hasDTDataId \"D-302-T\" ; sddt:targetsSensor ex:PT_302_Temp ; sddt:hasUnit \"degC\" ;\n    sddt:isGeneratedBy ex:PT_302_Temp .\nex:SD_SAT a sddt:SensorData , vb:NonintrusiveData ; rdfs:label \"Supply air temperature readings\" ;\n    sddt:hasDTDataId \"D-SAT\" ; sddt:targetsSensor ex:PT_SAT ; sddt:hasUnit \"degC\" ;\n    sddt:isGeneratedBy ex:PT_SAT .\nex:VD_301_Temp a sddt:VirtualModelData , vb:VirtualData ; rdfs:label \"Room 301 predicted temperature\" ;\n    sddt:hasDTDataId \"D-301-TV\" ; sddt:referencesModel ex:VM_301_Temp ; sddt:targetsVariable \"indoor temperature\" ;\n    sddt:isGeneratedBy ex:VM_301_Temp .\nex:MP_SP_Threshold a sddt:ModelParameter ; rdfs:label \"Setpoint threshold\" ;\n    sddt:hasDTDataId \"P-SP-TH\" ; sddt:hasValue \"1.0\" ; sddt:hasUnit \"degC\" ;\n    sddt:targetsModel ex:RM1_301 , ex:RM1_302 .\n\n# ---------------------------------------------------------------------\n# Tool and AI agent (executors)\n# ---------------------------------------------------------------------\nex:FDD_Tool a sddt:SimulationTool ; rdfs:label \"FDD tool\" ;\n    sddt:hasToolId \"T-FDD\" ; sddt:hasTargetAlgorithm \"Expert-defined rule models for air-side control loops\" ;\n    sddt:hasHyperparameters \"{\\\"window_min\\\": 10}\" ;\n    sddt:hasSystemMessage \"You diagnose the air-side HVAC control loops of Floor 3.\" .\nex:FDD_UI a sddt:UserInterface ; rdfs:label \"FDD user interface\" ; sddt:hasToolId \"T-UI\" .\nex:Report_Viewer a sddt:VisualizationTool ; rdfs:label \"Weekly report viewer\" ; sddt:hasToolId \"T-VIZ\" .\n\nex:FDD_Agent a sddt:AIAgent ; rdfs:label \"FDD executor agent\" ;\n    sddt:hasAgentId \"A-FDD\" ; sddt:hasAgentTuningParameters \"{\\\"temperature\\\": 0, \\\"max_tokens\\\": 4000}\" ;\n    sddt:invokesService ex:FDD_Tool .\nex:Report_Agent a sddt:AIAgent ; rdfs:label \"Reporting agent\" ;\n    sddt:hasAgentId \"A-REP\" ; sddt:invokesService ex:Report_Viewer .\n\nex:FDD_UI sddt:isInputOf ex:FDD_Agent .\n\n# ---------------------------------------------------------------------\n# Service logs: one per execution\n# ---------------------------------------------------------------------\nex:LOG_0001 a sddt:ServiceLog ; rdfs:label \"FDD run 0001 (Room 301)\" ;\n    sddt:hasServiceInvocationID \"FDD-301-0001\" ;\n    sddt:isGeneratedBy ex:FDD_Tool , ex:FDD_Agent ;\n    sddt:hasStartTime \"2026-03-02T09:00:00\"^^xsd:dateTime ; sddt:hasEndTime \"2026-03-02T09:00:31\"^^xsd:dateTime ;\n    sddt:hasServiceLatency 31.4 ; sddt:hasToolCallCount 2 ; sddt:hasTokenUsage \"in 5200, out 640\" ;\n    sddt:hasAnalysisWindow \"2026-03-02 08:50 to 09:00\" ;\n    sddt:hasServiceStatus \"completed\" ; sddt:hasFaultStatus \"normal\" ; sddt:hasFaultCategory \"Normal\" ;\n    sddt:hasInputVariables \"T_room, T_setpoint, T_supply\" ; sddt:hasOutputVariables \"fault status, fault category\" ;\n    sddt:hasInput ex:SD_301_Temp , ex:SD_SAT , ex:RM1_301 , ex:RM2_301 , ex:RM5_301 , ex:RM6_301 ;\n    sddt:hasPart ex:OUT_0001_RM1 , ex:ANS_0001 .\nex:LOG_0002 a sddt:ServiceLog ; rdfs:label \"FDD run 0002 (Room 302)\" ;\n    sddt:hasServiceInvocationID \"FDD-302-0002\" ;\n    sddt:isGeneratedBy ex:FDD_Tool , ex:FDD_Agent ;\n    sddt:hasStartTime \"2026-03-02T09:01:00\"^^xsd:dateTime ; sddt:hasEndTime \"2026-03-02T09:01:36\"^^xsd:dateTime ;\n    sddt:hasServiceLatency 36.2 ; sddt:hasToolCallCount 2 ; sddt:hasTokenUsage \"in 5400, out 910\" ;\n    sddt:hasAnalysisWindow \"2026-03-02 08:50 to 09:00\" ;\n    sddt:hasServiceStatus \"completed\" ; sddt:hasFaultStatus \"faulty\" ; sddt:hasFaultCategory \"Fault E-1\" ;\n    sddt:hasInputVariables \"T_room, T_setpoint, T_supply\" ; sddt:hasOutputVariables \"fault status, fault category\" ;\n    sddt:hasInput ex:SD_302_Temp , ex:SD_SAT , ex:RM1_302 , ex:RM2_302 , ex:RM5_302 , ex:RM6_302 ;\n    sddt:hasPart ex:OUT_0002_RM1 , ex:OUT_0002_RM5 , ex:OUT_0002_RM6 , ex:ANS_0002 .\n# Still running when the graph was exported: no end time, latency, or result yet\nex:LOG_0003 a sddt:ServiceLog ; rdfs:label \"FDD run 0003 (Room 302, re-check)\" ;\n    sddt:hasServiceInvocationID \"FDD-302-0003\" ;\n    sddt:isGeneratedBy ex:FDD_Tool , ex:FDD_Agent ;\n    sddt:hasStartTime \"2026-03-02T10:00:00\"^^xsd:dateTime ;\n    sddt:hasServiceStatus \"in progress\" ;\n    sddt:hasInput ex:SD_302_Temp , ex:RM1_302 .\nex:LOG_0004 a sddt:ServiceLog ; rdfs:label \"Weekly report 0004\" ;\n    sddt:hasServiceInvocationID \"REP-0004\" ;\n    sddt:isGeneratedBy ex:Report_Viewer , ex:Report_Agent ;\n    sddt:hasStartTime \"2026-03-06T18:00:00\"^^xsd:dateTime ; sddt:hasEndTime \"2026-03-06T18:00:12\"^^xsd:dateTime ;\n    sddt:hasServiceLatency 12.0 ; sddt:hasToolCallCount 1 ;\n    sddt:hasServiceStatus \"completed\" ;\n    sddt:hasInput ex:LOG_0001 , ex:LOG_0002 .\n\n# Rule outcomes generated by the FDD tool in each run\nex:OUT_0001_RM1 a sddt:ToolData ; rdfs:label \"Run 0001, rule 1 outcome\" ;\n    sddt:hasDTDataId \"O-0001-1\" ; sddt:targetsTool ex:FDD_Tool ; sddt:isGeneratedBy ex:FDD_Tool ;\n    sddt:hasSystemCondition \"normal\" ; sddt:hasDeviationValue 0.42 ; sddt:hasUnit \"degC\" .\nex:OUT_0002_RM1 a sddt:ToolData ; rdfs:label \"Run 0002, rule 1 outcome\" ;\n    sddt:hasDTDataId \"O-0002-1\" ; sddt:targetsTool ex:FDD_Tool ; sddt:isGeneratedBy ex:FDD_Tool ;\n    sddt:hasSystemCondition \"faulty\" ; sddt:hasDeviationValue 1.38 ; sddt:hasUnit \"degC\" ;\n    sddt:hasInput ex:RM1_302 .\nex:OUT_0002_RM5 a sddt:ToolData ; rdfs:label \"Run 0002, rule 5.1 outcome\" ;\n    sddt:hasDTDataId \"O-0002-5.1\" ; sddt:targetsTool ex:FDD_Tool ; sddt:isGeneratedBy ex:FDD_Tool ;\n    sddt:hasSystemCondition \"normal\" ; sddt:hasDeviationValue 0.55 ; sddt:hasUnit \"degC\" ;\n    sddt:hasInput ex:RM5_302 .\nex:OUT_0002_RM6 a sddt:ToolData ; rdfs:label \"Run 0002, rule 6.1 outcome\" ;\n    sddt:hasDTDataId \"O-0002-6.1\" ; sddt:targetsTool ex:FDD_Tool ; sddt:isGeneratedBy ex:FDD_Tool ;\n    sddt:hasSystemCondition \"faulty\" ; sddt:hasDeviationValue 1.38 ; sddt:hasUnit \"degC\" ;\n    sddt:hasInput ex:RM6_302 .\nex:OUT_0001_RM1 sddt:hasInput ex:RM1_301 .\n\n# Agent answers\nex:ANS_0001 a sddt:AIAgentAnswer ; rdfs:label \"Run 0001 answer\" ;\n    sddt:hasDTDataId \"AN-0001\" ; sddt:isGeneratedBy ex:FDD_Agent ;\n    sddt:hasValue \"Room 301 meets its setpoint; no fault found.\" .\nex:ANS_0002 a sddt:AIAgentAnswer ; rdfs:label \"Run 0002 answer\" ;\n    sddt:hasDTDataId \"AN-0002\" ; sddt:isGeneratedBy ex:FDD_Agent ;\n    sddt:hasValue \"Room 302 misses its setpoint while the supply air loop tracks its own setpoint: review the supply air temperature setpoint (Fault E-1).\" .\n"}];</script>

  function logoHtml(p, cls) {

  function renderChrome() {
    const here = '#/' + (window.SINGLE_PAGE || 'index');
    const idx = Math.max(0, PAGES.findIndex(p => p.href === here));

    const book = document.createElement('div');
    book.className = 'book';
    book.innerHTML = `
      <aside class="book-menu"><div class="book-menu-inner">
        <a class="book-brand" href="#/index"><span>6DDT Ontology<small>v${SITE_VERSION} · Six-dimensional digital twin</small></span></a>
