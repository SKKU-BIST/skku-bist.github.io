><\/div>\n      <div class=\"card\"><h3>Two executors, split by role<\/h3><p>An AI agent decides which tool to invoke and formulates the answer; a tool is invoked to produce outputs from inputs. The split rests on role, not technology: one agent can invoke many tools, and one tool can serve many agents.<\/p><\/div>\n      <div class=\"card\"><h3>Reuse Brick and VB<\/h3><p>Every 6DDT subclass under physical entity, DT data, and virtual model links to a Brick or VB class. Only Tool and AI agent are new, because neither schema defines an executor.<\/p><\/div>\n      <div class=\"card\"><h3>One log per execution, never edited<\/h3><p>Each run adds a new service log generated by exactly one tool and one AI agent. Latency, inputs, and outcomes belong to the run, so the tool and the agent stay persistent individuals.<\/p><\/div>\n    <\/div>\n\n    <h2 id=\"core\">Core model<\/h2>\n    <figure class=\"figure-box dg\">\n      <svg viewBox=\"0 0 760 320\" role=\"img\" aria-label=\"6DDT core model with the number of example individuals per class\">\n        <defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--text-faint)\"/><\/marker><\/defs>\n        <rect x=\"20\" y=\"20\" width=\"160\" height=\"44\"/><text x=\"100\" y=\"38\" text-anchor=\"middle\" style=\"font-weight:700\">UserInterface<\/text><text class=\"sub\" x=\"100\" y=\"54\" text-anchor=\"middle\">Interaction tool · request<\/text>\n        <rect x=\"20\" y=\"130\" width=\"160\" height=\"44\"/><text x=\"100\" y=\"148\" text-anchor=\"middle\" style=\"font-weight:700\">AIAgent<\/text><text class=\"sub\" x=\"100\" y=\"164\" text-anchor=\"middle\">reasons · invokes tools<\/text>\n        <rect x=\"20\" y=\"240\" width=\"160\" height=\"44\"/><text x=\"100\" y=\"258\" text-anchor=\"middle\" style=\"font-weight:700\">Tool<\/text><text class=\"sub\" x=\"100\" y=\"274\" text-anchor=\"middle\">Simulation · Visualization · …<\/text>\n        <rect x=\"290\" y=\"130\" width=\"170\" height=\"44\"/><text x=\"375\" y=\"148\" text-anchor=\"middle\" style=\"font-weight:700\">ServiceLog<\/text><text class=\"sub\" x=\"375\" y=\"164\" text-anchor=\"middle\">ID · time · latency · status · fault<\/text>\n        <rect x=\"290\" y=\"20\" width=\"170\" height=\"44\"/><text x=\"375\" y=\"38\" text-anchor=\"middle\" style=\"font-weight:700\">AIAgentAnswer · ToolData<\/text><text class=\"sub\" x=\"375\" y=\"54\" text-anchor=\"middle\">answer · rule outcomes<\/text>\n        <rect x=\"290\" y=\"240\" width=\"170\" height=\"44\"/><text x=\"375\" y=\"258\" text-anchor=\"middle\" style=\"font-weight:700\">SensorData · RuleModel<\/text><text class=\"sub\" x=\"375\" y=\"274\" text-anchor=\"middle\">inputs of the run<\/text>\n        <rect x=\"570\" y=\"130\" width=\"170\" height=\"44\"/><text x=\"655\" y=\"148\" text-anchor=\"middle\" style=\"font-weight:700\">ControlLoop<\/text><text class=\"sub\" x=\"655\" y=\"164\" text-anchor=\"middle\">sensor · setpoint · actuator<\/text>\n        <rect x=\"570\" y=\"20\" width=\"170\" height=\"44\"/><text x=\"655\" y=\"38\" text-anchor=\"middle\" style=\"font-weight:700\">VirtualModel<\/text><text class=\"sub\" x=\"655\" y=\"54\" text-anchor=\"middle\">physical · behavior · rule · geometric<\/text>\n        <rect x=\"570\" y=\"240\" width=\"170\" height=\"44\"/><text x=\"655\" y=\"258\" text-anchor=\"middle\" style=\"font-weight:700\">Point · Equipment · Location<\/text><text class=\"sub\" x=\"655\" y=\"274\" text-anchor=\"middle\">Brick<\/text>\n        <path class=\"edge\" d=\"M100 64 L100 128\" marker-end=\"url(#ar)\"/><text class=\"lbl\" x=\"106\" y=\"100\">isInputOf<\/text>\n        <path class=\"edge\" d=\"M100 174 L100 238\" marker-end=\"url(#ar)\"/><text class=\"lbl\" x=\"106\" y=\"210\">invokesService<\/text>\n        <path class=\"edge\" d=\"M180 152 L288 152\" marker-end=\"url(#ar)\"/><text class=\"lbl\" x=\"190\" y=\"145\">generates<\/text>\n        <path class=\"edge\" d=\"M180 262 L300 176\" marker-end=\"url(#ar)\"/><text class=\"lbl\" x=\"200\" y=\"230\">generates<\/text>\n        <path class=\"edge\" d=\"M375 130 L375 66\" marker-end=\"url(#ar)\"/><text class=\"lbl\" x=\"381\" y=\"102\">hasPart<\/text>\n        <path class=\"edge\" d=\"M375 174 L375 238\" marker-end=\"url(#ar)\"/><text class=\"lbl\" x=\"381\" y=\"210\">hasInput<\/text>\n        <path class=\"edge\" d=\"M460 262 L568 160\" marker-end=\"url(#ar)\"/><text class=\"lbl\" x=\"470\" y=\"214\">targetsControlLoop<\/text>\n        <path class=\"edge\" d=\"M655 174 L655 238\" marker-end=\"url(#ar)\"/><text class=\"lbl\" x=\"661\" y=\"210\">hasSensor · hasSetpoint<\/text>\n        <path class=\"edge\" d=\"M655 64 L655 128\" marker-end=\"url(#ar)\" stroke-dasharray=\"4 3\"/><text class=\"lbl\" x=\"661\" y=\"100\">targetsControlLoop<\/text>\n        <path class=\"edge\" d=\"M570 268 L462 268\" marker-end=\"url(#ar)\" stroke-dasharray=\"4 3\"/><text class=\"lbl\" x=\"476\" y=\"290\">generates (sensor data)<\/text>\n      <\/svg>\n      <figcaption>Core classes and the main relationships. Dashed arrows link models and data to the physical side. All classes and properties are in <a href=\"#/reference\">Classes &amp; properties<\/a>.<\/figcaption>\n    <\/figure>\n\n    <h2 id=\"cycle\">One execution cycle<\/h2>\n    <p>The six dimensions operate as one cycle on a shared knowledge graph: the graph both drives the service and records it.<\/p>\n    <div class=\"table-wrap\"><table>\n      <tr><th>#<\/th><th>Step<\/th><th>From → to<\/th><th>Relationship<\/th><\/tr>\n      <tr><td>1<\/td><td>Request<\/td><td>Interaction tool → AI agent<\/td><td><code>sddt:isInputOf<\/code><\/td><\/tr>\n      <tr><td>2<\/td><td>Context<\/td><td>AI agent → physical entity and virtual model<\/td><td><code>brick:hasPoint<\/code>, <code>sddt:targetsControlLoop<\/code> (SPARQL)<\/td><\/tr>\n      <tr><td>3<\/td><td>Delegation<\/td><td>AI agent → tool<\/td><td><code>sddt:invokesService<\/code><\/td><\/tr>\n      <tr><td>4<\/td><td>Execution<\/td><td>Tool → DT data and rule models<\/td><td><code>sddt:hasInput<\/code><\/td><\/tr>\n      <tr><td>5<\/td><td>Output<\/td><td>Tool and AI agent → DT data<\/td><td><code>sddt:generates<\/code><\/td><\/tr>\n      <tr><td>6<\/td><td>Record<\/td><td>Tool and AI agent → service log<\/td><td><code>sddt:generates<\/code><\/td><\/tr>\n      <tr><td>7<\/td><td>Result<\/td><td>Tool and AI agent → interaction tool<\/td><td><code>sddt:isInputOf<\/code><\/td><\/tr>\n    <\/table><\/div>\n\n    <h2 id=\"link\">Four core paths<\/h2>\n    <div class=\"grid grid-2\">\n      <a class=\"card pathcard\" href=\"#path1\"><h3>① Executor identity · <code>isGeneratedBy<\/code>, <code>invokesService<\/code><\/h3><p>Which tool and which AI agent ran each execution, and what it cost in time, calls, and tokens<\/p><\/a>\n      <a class=\"card pathcard\" href=\"#path2\"><h3>② Diagnostic provenance · <code>hasPart<\/code>, <code>hasInput<\/code><\/h3><p>From the fault category of a run to the rule outcomes, rule models, and control loops behind it<\/p><\/a>\n      <a class=\"card pathcard\" href=\"#path3\"><h3>③ Data lineage · <code>generates<\/code>, <code>targetsSensor<\/code><\/h3><p>Which point produced the data a run used, and which model it feeds<\/p><\/a>\n      <a class=\"card pathcard\" href=\"#path4\"><h3>④ Brick and VB alignment · <code>brick:<\/code>, <code>vb:<\/code><\/h3><p>The same individuals described by Brick and VB, with only the executors added by 6DDT<\/p><\/a>\n    <\/div>\n\n    <h3 id=\"path1\">① Executor identity: <code>isGeneratedBy<\/code>, <code>invokesService<\/code><\/h3>\n    <p>The tool and the agent are persistent individuals; each execution is a new log that points back to both. The SHACL shapes check that every log has exactly one of each.<\/p>\n    <pre data-lang=\"turtle\" data-label=\"6DDT-example.ttl (excerpt)\">\nex:FDD_Agent a sddt:AIAgent ; sddt:hasAgentId \"A-FDD\" ; sddt:invokesService ex:FDD_Tool .\nex:FDD_Tool  a sddt:SimulationTool ; sddt:hasToolId \"T-FDD\" .\nex:FDD_UI    a sddt:UserInterface ; sddt:isInputOf ex:FDD_Agent .\n\nex:LOG_0002 a sddt:ServiceLog ;\n    sddt:hasServiceInvocationID \"FDD-302-0002\" ;\n    sddt:isGeneratedBy ex:FDD_Tool , ex:FDD_Agent ;\n    sddt:hasStartTime \"2026-03-02T09:01:00\"^^xsd:dateTime ; sddt:hasEndTime \"2026-03-02T09:01:36\"^^xsd:dateTime ;\n    sddt:hasServiceLatency 36.2 ; sddt:hasToolCallCount 2 ; sddt:hasTokenUsage \"in 5400, out 910\" ;\n    sddt:hasServiceStatus \"completed\" .<\/pre>\n\n    <h3 id=\"path2\">② Diagnostic provenance: <code>hasPart<\/code>, <code>hasInput<\/code><\/h3>\n    <p>A log is composed of the rule outcomes and the answer of its run. Each outcome points to the rule model it evaluated, and the rule model to its control loop, so a fault category can be traced to its evidence.<\/p>\n    <pre data-lang=\"turtle\" data-label=\"6DDT-example.ttl (excerpt)\">\nex:LOG_0002 sddt:hasFaultStatus \"faulty\" ; sddt:hasFaultCategory \"Fault E-1\" ;\n    sddt:hasPart ex:OUT_0002_RM1 , ex:OUT_0002_RM6 , ex:ANS_0002 .\nex:OUT_0002_RM1 a sddt:ToolData ; sddt:isGeneratedBy ex:FDD_Tool ;\n    sddt:hasInput ex:RM1_302 ; sddt:hasSystemCondition \"faulty\" ; sddt:hasDeviationValue 1.38 .\nex:RM1_302 a sddt:RuleModel ; sddt:hasSystemThreshold 1.0 ;\n    sddt:targetsControlLoop ex:Loop_302_Temp ; sddt:targetsSystem ex:Room_302 .<\/pre>\n\n    <h3 id=\"path3\">③ Data lineage: <code>generates<\/code>, <code>targetsSensor<\/code><\/h3>\n    <p>Sensor data name the point they come from, and the point generates them. A log that uses the data can therefore be traced to a physical sensor, its control loop, and its room.<\/p>\n    <pre data-lang=\"turtle\" data-label=\"asserted → inferred\">\nex:SD_302_Temp a sddt:SensorData ; sddt:targetsSensor ex:PT_302_Temp ; sddt:isGeneratedBy ex:PT_302_Temp .\nex:Loop_302_Temp sddt:hasSensor ex:PT_302_Temp ; sddt:hasSetpoint ex:PT_302_SP ; sddt:hasActuator ex:PT_302_Damper .\nex:LOG_0002 sddt:hasInput ex:SD_302_Temp .\n\n# ⇒ inferred\nex:PT_302_Temp sddt:generates ex:SD_302_Temp .\nex:SD_302_Temp sddt:isInputOf ex:LOG_0002 .<\/pre>\n\n    <h3 id=\"path4\">④ Brick and VB alignment: <code>brick:<\/code>, <code>vb:<\/code><\/h3>\n    <p>Physical entities carry their Brick class next to the 6DDT dimension; zone models and their data carry VB classes and VB relationships. Rule models, tools, agents, and logs have no Brick or VB counterpart.<\/p>\n    <pre data-lang=\"turtle\" data-label=\"6DDT-example.ttl (excerpt)\">\nex:PT_302_Temp a sddt:Point , brick:Air_Temperature_Sensor .\nex:AHU_1       a sddt:Equipment , brick:AHU .\nex:SD_302_Temp a sddt:SensorData , vb:NonintrusiveData .\nex:VM_301_Temp a sddt:PhysicalModel , vb:ObservedModel ;\n    vb:isVirtualModelOf ex:Room_301 ; vb:hasVirtualData ex:VD_301_Temp ; vb:isLinkedWith ex:DM_301_Temp .\nex:DM_301_Temp a vb:DistanceModel ; vb:estimates ex:VM_301_Temp .<\/pre>\n    <div class=\"table-wrap\"><table>\n      <tr><th>6DDT class<\/th><th>Linked Brick or VB class<\/th><\/tr>\n      <tr><td><code>sddt:Location<\/code>, <code>sddt:Equipment<\/code>, <code>sddt:Point<\/code><\/td><td><code>brick:Location<\/code>, <code>brick:Equipment<\/code>, <code>brick:Point<\/code><\/td><\/tr>\n      <tr><td><code>sddt:ControlLoop<\/code><\/td><td><code>brick:Collection<\/code><\/td><\/tr>\n      <tr><td><code>sddt:SensorData<\/code><\/td><td><code>vb:OnSiteData<\/code>, <code>vb:OffSiteData<\/code><\/td><\/tr>\n      <tr><td><code>sddt:VirtualModelData<\/code><\/td><td><code>vb:VirtualData<\/code><\/td><\/tr>\n      <tr><td><code>sddt:PhysicalModel<\/code><\/td><td><code>vb:BehaviorModel<\/code> (physical principles of a phenomenon)<\/td><\/tr>\n      <tr><td><code>sddt:BehaviorModel<\/code><\/td><td><code>vb:DistanceModel<\/code> and <code>vb:CorrectionModel<\/code> (control-system behavior)<\/td><\/tr>\n      <tr><td><code>sddt:Tool<\/code>, <code>sddt:AIAgent<\/code><\/td><td class=\"muted\">none: new in 6DDT<\/td><\/tr>\n    <\/table><\/div>\n\n    <h2 id=\"abox\">Example individuals<\/h2>\n    <p class=\"small muted\">The example graph is illustrative: a fictional floor with one AHU and two rooms, and an FDD service that ran four times. All names and values are invented.<\/p>\n    <div class=\"table-wrap\"><table id=\"abox-table\"><tr><th>Dimension<\/th><th>Class<\/th><th>Individuals<\/th><\/tr><\/table><\/div>\n\n    <h2 id=\"gaps\">Known gaps<\/h2>\n    <ul>\n      <li>The case study covers one service type (FDD) and one executor agent per run; multi-agent orchestration is not modeled yet.<\/li>\n      <li>Each execution adds a new log, so the graph grows linearly with use; long-running deployments need logs archived or partitioned by period.<\/li>\n      <li>The schema declares <code>hasInput<\/code>, <code>generates<\/code>, and <code>hasPart<\/code> broadly on <code>sddt:Entity<\/code>; the intended domain–range pairs are documented, and SHACL checks the ones that matter for logs.<\/li>\n      <li>The VB schema website gives no namespace; this site uses <code>https://skku-bist.github.io/method#<\/code>, as in the 6DDT paper.<\/li>\n      <li>In the example, the static pressure loop has no registered actuator and run 0003 is still in progress (two SHACL warnings, see <a href=\"#/examples/validate\">Competency questions<\/a>).<\/li>\n    <\/ul>\n  <\/article>\n<\/main>\n<script>\ndocument.addEventListener('DOMContentLoaded', () => {\n  const { M } = SDDT.load();\n  if (!M) return;\n  const { esc, GROUPS } = SDDT;\n  const rows = {};\n  M.individuals.forEach(i => {\n    const c = M.classes.get(i.types[0]); if (!c) return;\n    const k = c.group + '|' + c.name;\n    rows[k] = rows[k] || { group: c.group, cls: c.name, qn: c.qn, n: 0 };\n    rows[k].n++;\n  });\n  const order = Object.keys(GROUPS);\n  const html = Object.values(rows).sort((a, b) => order.indexOf(a.group) - order.indexOf(b.group) || b.n - a.n)\n    .map(r => `<tr><td><span style=\"display:inline-block;width:10px;height:10px;border-radius:2px;background:${SDDT.groupColor(r.group)};margin-right:6px\"><\/span>${esc((GROUPS[r.group] || {}).label || r.group)}<\/td>\n      <td><a href=\"#/reference/${esc(r.cls)}\"><code>${esc(r.qn)}<\/code><\/a><\/td><td>${r.n}<\/td><\/tr>`).join('');\n  document.getElementById('abox-table').insertAdjacentHTML('beforeend', html);\n});\n<\/script>\n"}, "visualize": {"title": "6DDT Visualizer", "bodyClass": "wide", "html": "<style>\n  .viz { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; padding-bottom: 60px; }\n  @media (max-width: 960px) { .viz { grid-template-columns: minmax(0, 1fr); } }\n  .viz > section { min-width: 0; }\n  #kg3d { overflow: hidden; max-width: 100%; }\n  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }\n  .tabs button {\n    font: inherit; font-size: .92rem; padding: 8px 14px; border-radius: 8px; cursor: pointer;\n    border: 1px solid var(--border); background: var(--surface); color: var(--text-soft);\n  }\n  .tabs button.on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }\n  :root.dark .tabs button.on { color: #06263b; }\n  .canvas-wrap { position: relative; }\n  #cy, #kg3d { height: calc(100vh - 250px); min-height: 480px; border: 1px solid var(--border-strong); border-radius: 2px; background: var(--bg); position: relative; }\n  #kg3d { height: min(calc(100vh - 300px), 560px) !important; min-height: 420px !important; }\n  .floating { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; }\n  .side { display: flex; flex-direction: column; gap: 14px; }\n  .panel { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 14px 16px; }\n  .panel h3 { margin: 0 0 8px; font-size: .95rem; }\n  .legend { display: grid; gap: 4px; }\n  .legend label { display: flex; align-items: center; gap: 8px; font-size: .9rem; cursor: pointer; }\n  .legend .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }\n  .legend .n { margin-left: auto; color: var(--text-faint); font-size: .8rem; font-variant-numeric: tabular-nums; }\n  #detail { font-size: .9rem; }\n  #detail dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; }\n  #detail dt { color: var(--text-faint); font-size: .8rem; }\n  #detail dd { margin: 0; word-break: break-all; }\n  #search { width: 100%; }\n  .hint { font-size: .82rem; color: var(--text-faint); margin: 8px 0 0; }\n<\/style>\n<div class=\"page-hero\"><div class=\"container\">\n  <div class=\"crumb\">04 · VISUALIZATION<\/div>\n  <h1>Ontology visualization<\/h1>\n  <p>Drawn from the published files (<a href=\"#/files\">downloads<\/a>): the class hierarchy of 6DDT and VB, the object properties, and the example Knowledge Graph.<\/p>\n<\/div><\/div>\n\n<main class=\"container viz\">\n  <section>\n    <div class=\"tabs\" role=\"tablist\">\n      <button type=\"button\" data-mode=\"hierarchy\" class=\"on\">Class hierarchy (subClassOf)<\/button>\n      <button type=\"button\" data-mode=\"schema\">Object properties (domain → range)<\/button>\n      <button type=\"button\" data-mode=\"instance\">Knowledge Graph (individuals)<\/button>\n    <\/div>\n    <div class=\"canvas-wrap\">\n      <div id=\"cy\"><\/div>\n      <div id=\"kg3d\" class=\"hidden\"><\/div>\n      <div class=\"floating\">\n        <button class=\"btn btn-line btn-sm\" id=\"fit\" type=\"button\">Fit<\/button>\n        <button class=\"btn btn-line btn-sm\" id=\"relayout\" type=\"button\">Re-layout<\/button>\n        <button class=\"btn btn-line btn-sm\" id=\"png\" type=\"button\">Save PNG<\/button>\n      <\/div>\n    <\/div>\n    <p class=\"hint\" id=\"hint\"><\/p>\n  <\/section>\n\n  <aside class=\"side\">\n    <div class=\"panel\">\n      <h3>Search<\/h3>\n      <input id=\"search\" type=\"search\" placeholder=\"Class or individual, e.g. ServiceLog, FDD_Tool\">\n    <\/div>\n    <div class=\"panel\">\n      <h3>Dimensions<\/h3>\n      <div class=\"legend\" id=\"legend\"><\/div>\n    <\/div>\n    <div class=\"panel hidden\" id=\"kg-group-panel\">\n      <h3>Display<\/h3>\n      <div style=\"display:grid;gap:6px\">\n        <label class=\"kg-group\"><input type=\"checkbox\" id=\"kg-labels\" checked> Show labels<\/label>\n        <label class=\"kg-group\"><input type=\"checkbox\" id=\"kg-group\"> Group by dimension<\/label>\n      <\/div>\n      <p class=\"hint\">Sphere color = dimension, size = number of object-property links. Hover a sphere to see its name.<\/p>\n    <\/div>\n    <div class=\"panel\">\n      <h3>Details<\/h3>\n      <div id=\"detail\" class=\"muted\">Select a node.<\/div>\n    <\/div>\n  <\/aside>\n<\/main>\n\n<script>\ndocument.addEventListener('DOMContentLoaded', () => {\n  const { G, M, errors } = SDDT.load();\n  SDDT.showLoadErrors(document.querySelector('.viz section'), errors);\n  if (!M || !window.cytoscape) {\n    document.getElementById('cy').innerHTML = '<p class=\"loading\">The graph library could not be loaded (check the internet connection).<\/p>';\n    return;\n  }\n  const { esc, qname, local, GROUPS } = SDDT;\n  let mode = 'hierarchy';\n  const hidden = new Set();\n  const HINT2D = 'Wheel: zoom · drag: pan · click a node: highlight its neighbors and show details · click empty space: clear';\n  const HINT3D = 'Drag: rotate · wheel: zoom · right-drag: pan · click a sphere: highlight its neighbors and show details · click empty space: clear';\n\n  const cy = cytoscape({\n    container: document.getElementById('cy'), style: SDDTGraph.style(),\n    wheelSensitivity: 0.25, minZoom: 0.1, maxZoom: 3,\n  });\n  // The Knowledge Graph tab is drawn in 3D (3d-force-graph), created on first use\n  let kg = null;\n  const kgBox = document.getElementById('kg3d');\n  const ensureKg = () => {\n    if (!kg) {\n      kg = KG3D.create(kgBox, G, M, { onSelect: id => showDetail(id) });\n      if (kg) kg.setHidden(hidden);\n    }\n    return kg;\n  };\n  document.getElementById('kg-group').addEventListener('change', e => kg && kg.setGrouped(e.target.checked));\n  document.getElementById('kg-labels').addEventListener('change', e => kg && kg.setLabels(e.target.checked));\n\n  function layoutFor(m) {\n    if (m === 'hierarchy') {\n      // Indented trees: Entity on top with one column per 6DDT dimension, then one column per VB root\n      const ROW = 34, INDENT = 36, GAP = 56;\n      const widthOf = iri => (cy.getElementById(iri).data('w') || 120);\n      const roots = [...M.classes.values()].filter(c => !c.parents.length);\n      const entity = roots.find(c => c.group === 'Entity');\n      const columns = [];\n      if (entity) entity.children.forEach(d => columns.push({ iri: d, depth: 0 }));\n      roots.filter(c => c !== entity).forEach(c => columns.push({ iri: c.iri, depth: 0 }));\n      const left = {};\n      let x0 = INDENT;\n      for (const col of columns) {\n        if (hidden.has(M.classes.get(col.iri).group)) continue;\n        const rows = [];\n        const walk = (iri, depth) => { rows.push({ iri, depth }); M.classes.get(iri).children.forEach(k => walk(k, depth + 1)); };\n        walk(col.iri, 0);\n        rows.forEach((r, i) => { left[r.iri] = { x: x0 + r.depth * INDENT, y: (i + 2) * ROW }; });\n        x0 += Math.max(...rows.map(r => r.depth * INDENT + widthOf(r.iri))) + GAP;\n      }\n      if (entity) {\n        const dims = entity.children.filter(d => left[d]);\n        const span = dims.length ? left[dims[dims.length - 1]].x + widthOf(dims[dims.length - 1]) : x0;\n        left[entity.iri] = { x: Math.max(0, (INDENT + span) / 2 - widthOf(entity.iri) / 2), y: 0 };\n      }\n      return { name: 'preset', padding: 20, animate: false,\n               positions: n => { const p = left[n.id()] || { x: 0, y: 0 }; return { x: p.x + n.data('w') / 2, y: p.y }; } };\n    }\n    return { name: 'cose', animate: false, randomize: true, nodeDimensionsIncludeLabels: true,\n             nodeRepulsion: 60000, idealEdgeLength: 130, edgeElasticity: 100, gravity: 1.2, numIter: 2500, padding: 30 };\n  }\n\n  function build() {\n    const is3d = mode === 'instance';\n    document.getElementById('cy').classList.toggle('hidden', is3d);\n    kgBox.classList.toggle('hidden', !is3d);\n    document.getElementById('kg-group-panel').classList.toggle('hidden', !is3d);\n    document.getElementById('hint').textContent = is3d ? HINT3D : HINT2D;\n    if (kg) kg.pause(!is3d);\n    if (is3d) { ensureKg(); renderLegend(); showDetail(null); return; }\n    const els = mode === 'hierarchy' ? SDDTGraph.hierarchyElements(M) : SDDTGraph.schemaElements(M);\n    cy.style(SDDTGraph.style());\n    cy.elements().remove();\n    cy.add(els);\n    applyFilter();\n    cy.layout(layoutFor(mode)).run();\n    fitView();\n    renderLegend();\n    showDetail(null);\n  }\n\n  // The tree is wide, so a full fit makes labels unreadable: keep a readable zoom and show it from the top left\n  function fitView() {\n    const vis = cy.elements(':visible');\n    if (mode !== 'hierarchy') { cy.fit(vis, 24); return; }\n    SDDTGraph.treeEdges(cy);\n    const bb = vis.boundingBox(), W = cy.width() - 40;\n    const z = Math.max(0.6, Math.min(1, W / Math.max(1, bb.w)));\n    cy.zoom(z);\n    const slack = Math.max(0, W - bb.w * z);   // center when it fits\n    cy.pan({ x: 20 + slack / 2 - bb.x1 * z, y: 20 - bb.y1 * z });\n  }\n\n  function renderLegend() {\n    const counts = {};\n    if (mode === 'instance') M.individuals.forEach(i => { if (i.group) counts[i.group] = (counts[i.group] || 0) + 1; });\n    else cy.nodes().forEach(n => { const g = n.data('group'); if (g) counts[g] = (counts[g] || 0) + 1; });\n    document.getElementById('legend').innerHTML = Object.entries(GROUPS).filter(([g]) => g !== 'Entity').map(([g, info]) =>\n      `<label><input type=\"checkbox\" data-g=\"${g}\" ${hidden.has(g) ? '' : 'checked'}>\n        <span class=\"sw\" style=\"background:${mode === 'instance' ? KG3D.color(g) : SDDT.groupColor(g)}\"><\/span>${info.label}\n        <span class=\"n\">${counts[g] || 0}<\/span><\/label>`).join('');\n  }\n  document.getElementById('legend').addEventListener('change', e => {\n    const g = e.target.dataset.g;\n    e.target.checked ? hidden.delete(g) : hidden.add(g);\n    applyFilter();\n    if (mode === 'hierarchy') { cy.layout(layoutFor(mode)).run(); fitView(); }\n  });\n  function applyFilter() {\n    cy.nodes().forEach(n => n.style('display', hidden.has(n.data('group')) ? 'none' : 'element'));\n    if (kg) kg.setHidden(new Set(hidden));\n  }\n\n  // Details: a class or an individual (IRI), or another node (label)\n  function showDetail(id) {\n    const el = document.getElementById('detail');\n    if (!id) { el.className = 'muted'; el.textContent = 'Select a node.'; return; }\n    el.className = '';\n    const c = M.classes.get(id);\n    if (c) {\n      const props = M.objectProps.concat(M.dataProps).filter(p => p.domain.some(d => d && d.kind === 'iri' && (d.iri === id || c.ancestors.includes(d.iri))));\n      el.innerHTML = `<div style=\"font-weight:700;font-size:1.05rem\">${esc(c.name)}<\/div>\n        <p class=\"small\" style=\"margin:4px 0 10px\">${esc(c.comment || 'No description.')}<\/p>\n        <dl><dt>IRI<\/dt><dd><code>${esc(c.qn)}<\/code><\/dd>\n        <dt>Group<\/dt><dd>${esc((GROUPS[c.group] || {}).label || c.group)}<\/dd>\n        <dt>Superclass<\/dt><dd>${c.parents.map(p => `<code>${esc(qname(p))}<\/code>`).join(' ') || '-'}<\/dd>\n        <dt>Subclasses<\/dt><dd>${c.children.length ? c.children.map(k => `<code>${esc(qname(k))}<\/code>`).join(' ') : '-'}<\/dd>\n        <dt>Properties<\/dt><dd>${props.length} (incl. inherited)<\/dd>\n        <dt>Individuals<\/dt><dd>${[...M.individuals.values()].filter(i => i.types.includes(id)).length}<\/dd><\/dl>\n        <p style=\"margin:10px 0 0\"><a href=\"#/reference/${esc(c.name)}\">Open in the reference →<\/a><\/p>`;\n      return;\n    }\n    const ind = M.individuals.get(id);\n    if (ind) {\n      const rows = G.quads(id, null, null).map(q => {\n        const o = q.object.termType === 'Literal' ? `\"${esc(q.object.value)}\"` : `<code>${esc(qname(q.object.value))}<\/code>`;\n        return `<dt>${esc(qname(q.predicate.value).replace(/^sddt:/, ''))}<\/dt><dd>${o}<\/dd>`;\n      }).join('');\n      const incoming = G.quads(null, null, id).map(q => `<code>${esc(qname(q.subject.value))}<\/code> <span class=\"muted\">${esc(local(q.predicate.value))}<\/span>`).join('<br>');\n      el.innerHTML = `<div style=\"font-weight:700;font-size:1.05rem\">${esc(ind.name)}<\/div>\n        <p class=\"small muted\" style=\"margin:2px 0 10px\">${esc(ind.title || '')}<\/p><dl>${rows}<\/dl>\n        ${incoming ? `<p class=\"small\" style=\"margin:10px 0 2px\"><b>Incoming links<\/b><\/p><div class=\"small\">${incoming}<\/div>` : ''}`;\n      return;\n    }\n    el.innerHTML = '<p class=\"small\">Object properties without a declared range.<\/p>';\n  }\n\n  cy.on('tap', 'node', e => {\n    const n = e.target;\n    cy.elements().addClass('faded').removeClass('hl');\n    n.closedNeighborhood().removeClass('faded').addClass('hl');\n    showDetail(n.id());\n  });\n  cy.on('tap', e => { if (e.target === cy) { cy.elements().removeClass('faded hl'); showDetail(null); } });\n\n  document.getElementById('search').addEventListener('input', e => {\n    const q = e.target.value.trim().toLowerCase();\n    if (mode === 'instance') { if (kg) kg.search(q); return; }\n    cy.elements().removeClass('faded hl');\n    if (!q) return;\n    const hit = cy.nodes().filter(n => (n.data('label') || '').toLowerCase().includes(q));\n    cy.elements().addClass('faded');\n    hit.removeClass('faded').addClass('hl');\n    if (hit.length) cy.animate({ fit: { eles: hit, padding: 80 }, duration: 250 });\n  });\n\n  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {\n    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));\n    mode = b.dataset.mode;\n    try { history.replaceState(null, '', '#' + mode); } catch (e) {}\n    build();\n  }));\n  document.getElementById('fit').addEventListener('click', () => mode === 'instance' ? kg && kg.fit() : cy.fit(cy.elements(':visible'), 20));\n  document.getElementById('relayout').addEventListener('click', () => { if (mode === 'instance') { kg && kg.reheat(); return; } cy.layout(layoutFor(mode)).run(); fitView(); });\n  document.getElementById('png').addEventListener('click', () => {\n    const a = document.createElement('a');\n    a.href = mode === 'instance' && kg ? kg.png() : cy.png({ full: true, scale: 2, bg: SDDT.cssVar('--bg') });\n    a.download = `6ddt-${mode}.png`;\n    a.click();\n  });\n  document.addEventListener('epc:theme', () => build());\n\n  const initial = location.hash.slice(1);\n  if (['hierarchy', 'schema', 'instance'].includes(initial)) {\n    mode = initial;\n    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x.dataset.mode === mode));\n  }\n  build();\n});\n<\/script>\n"}, "reference": {"title": "6DDT Class Reference", "bodyClass": "wide", "html": "<style>\n  .ref { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 36px; padding-bottom: 80px; }\n  @media (max-width: 900px) { .ref { grid-template-columns: minmax(0, 1fr); } .tree-wrap { position: static !important; max-height: 320px !important; } }\n  .tree-wrap { position: sticky; top: 16px; align-self: start; max-height: calc(100vh - 32px); overflow: auto;\n    border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 12px; }\n  .ref > * { min-width: 0; }\n  .tree-wrap input { width: 100%; margin-bottom: 10px; }\n  .tree ul { list-style: none; margin: 0; padding-left: 12px; }\n  .tsec > ul { padding-left: 0; }\n  .tree li { margin: 0; }\n  .tree li > ul { display: none; }\n  .tree li.open > ul, .tree.searching li.sopen > ul { display: block; }\n  .tree li { display: grid; grid-template-columns: 16px minmax(0, 1fr); align-items: center; }\n  .tree li > ul { grid-column: 1 / -1; padding-left: 16px; }\n  .tree .caret, .tree .caret-i { width: 16px; height: 20px; border: 0; background: none; padding: 0; cursor: pointer; color: var(--text-faint); }\n  .tree .caret::before, .tree .caret-i::before { content: '▸'; display: inline-block; font-size: .72rem; transition: transform .12s; }\n  .tree li.open > .caret::before, .tree.searching li.sopen > .caret::before, .tsec.open > .tsec-h .caret-i::before { transform: rotate(90deg); }\n  .tree .caret:hover { color: var(--text); }\n  .tree .caret-sp { width: 16px; }\n  .tree .glabel { cursor: pointer; padding: 2px 6px; font-size: .84rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n  .tree .cnt { margin-left: 6px; font-size: .72rem; color: var(--text-faint); font-weight: 400; }\n  .tsec { margin-bottom: 6px; }\n  .tsec > ul { display: none; }\n  .tsec.open > ul { display: block; }\n  .tsec-h { display: flex; align-items: center; width: 100%; font: inherit; font-size: .78rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;\n    color: var(--text-soft); background: none; border: 0; border-bottom: 1px solid var(--border); padding: 6px 0 4px; margin: 6px 0 4px; cursor: pointer; text-align: left; }\n  .tsec-h .caret-i { display: inline-flex; align-items: center; height: auto; }\n  .tree-tools { display: flex; gap: 6px; margin: -2px 0 8px; }\n  .tree-tools button { font: inherit; font-size: .75rem; color: var(--text-soft); background: none; border: 1px solid var(--border); border-radius: 3px; padding: 1px 8px; cursor: pointer; }\n  .tree-tools button:hover { color: var(--text); border-color: var(--border-strong); }\n  tr.anchor.hit td { background: var(--brand-tint); }\n  .tree a { display: block; padding: 2px 6px; border-radius: 4px; color: var(--text-soft); font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n  .tree a:hover { background: var(--bg-sunk); text-decoration: none; color: var(--text); }\n  .tree a.on { background: var(--brand-tint); color: var(--brand); font-weight: 600; }\n  .tree .root > a { font-weight: 700; color: var(--text); margin-top: 6px; }\n  .tree .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }\n  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 22px; flex-wrap: wrap; }\n  .tabs a { padding: 9px 14px; color: var(--text-soft); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }\n  .tabs a:hover { text-decoration: none; color: var(--text); }\n  .tabs a.on { color: var(--brand); border-color: var(--brand); font-weight: 700; }\n  .tabs .n { font-size: .78rem; color: var(--text-faint); margin-left: 4px; }\n  .cls { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 20px 22px; margin-bottom: 18px; scroll-margin-top: 80px; }\n  .cls h2 { margin: 0; font-size: 1.35rem; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }\n  .cls h2 .lb { font-size: 1rem; font-weight: 500; color: var(--text-soft); }\n  .cls .iri { font-family: var(--mono); font-size: .8rem; color: var(--text-faint); word-break: break-all; }\n  .crumbs { font-size: .85rem; margin: 10px 0 4px; color: var(--text-faint); }\n  .crumbs a { font-family: var(--mono); }\n  .cls h4 { margin: 18px 0 6px; font-size: .9rem; color: var(--text-soft); }\n  .tag-inh { font-size: .72rem; color: var(--text-faint); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; margin-left: 4px; }\n  .anchor { scroll-margin-top: 80px; }\n<\/style>\n<div class=\"page-hero\"><div class=\"container\">\n  <div class=\"crumb\">05 · REFERENCE<\/div>\n  <h1>Classes and properties<\/h1>\n  <p id=\"hero-sub\">Generated from the published TTL file.<\/p>\n<\/div><\/div>\n\n<main class=\"container ref\">\n  <aside class=\"tree-wrap\">\n    <input type=\"search\" id=\"q\" placeholder=\"Search classes and properties\">\n    <div class=\"tree-tools\"><button type=\"button\" id=\"expand-all\">Expand all<\/button><button type=\"button\" id=\"collapse-all\">Collapse all<\/button><\/div>\n    <div class=\"tree\" id=\"tree\"><\/div>\n  <\/aside>\n  <section>\n    <nav class=\"tabs\" id=\"tabs\">\n      <a href=\"#classes\" data-tab=\"classes\">Classes<span class=\"n\" id=\"n-classes\"><\/span><\/a>\n      <a href=\"#object-properties\" data-tab=\"object-properties\">Object properties<span class=\"n\" id=\"n-op\"><\/span><\/a>\n      <a href=\"#datatype-properties\" data-tab=\"datatype-properties\">Datatype properties<span class=\"n\" id=\"n-dp\"><\/span><\/a>\n      <a href=\"#shapes\" data-tab=\"shapes\">SHACL shapes<span class=\"n\" id=\"n-sh\"><\/span><\/a>\n    <\/nav>\n    <div id=\"pane-classes\"><\/div>\n    <div id=\"pane-object-properties\" class=\"hidden\"><\/div>\n    <div id=\"pane-datatype-properties\" class=\"hidden\"><\/div>\n    <div id=\"pane-shapes\" class=\"hidden\"><\/div>\n  <\/section>\n<\/main>\n\n<script>\ndocument.addEventListener('DOMContentLoaded', () => {\n  const { M, files, errors } = SDDT.load();\n  SDDT.showLoadErrors(document.querySelector('.ref section'), errors);\n  if (!M) return;\n  const { esc, qname, local, typeLabel, GROUPS } = SDDT;\n  const o = M.ontology || {};\n  document.getElementById('hero-sub').textContent =\n    `Generated from ${files.map(f => f.name).join(', ')}. 6DDT classes use sddt:, VB schema classes vb:.`;\n\n  const clsLink = iri => M.classes.has(iri)\n    ? `<a href=\"#${esc(local(iri))}\"><code>${esc(qname(iri))}<\/code><\/a>` : `<code>${esc(qname(iri))}<\/code>`;\n  const typeHtml = t => {\n    if (!t) return '<span class=\"muted\">-<\/span>';\n    if (t.kind === 'iri') return clsLink(t.iri);\n    if (t.kind === 'union') return t.members.map(clsLink).join(' ∪ ');\n    return `<code>${esc(typeLabel(t))}<\/code>`;\n  };\n  const propLink = iri => `<a href=\"#p-${esc(local(iri))}\"><code>${esc(qname(iri))}<\/code><\/a>`;\n  const traitHtml = p => [\n    ...p.traits.map(t => `<span class=\"chip\">${esc(t)}<\/span>`),\n    p.inverse ? `<span class=\"small\">inverse of ${propLink(p.inverse)}<\/span>` : '',\n    p.parent ? `<span class=\"small\">sub-property of ${propLink(p.parent)}<\/span>` : '',\n  ].filter(Boolean).join('<br>');\n  const dimLabel = c => (GROUPS[c.group] || {}).label || c.group;\n\n  // ---------------- Sidebar tree ----------------\n  const caret = '<button class=\"caret\" type=\"button\" aria-label=\"Expand or collapse\"><\/button>';\n  const leaf = '<span class=\"caret-sp\"><\/span>';\n  function classTree(iris, depth) {\n    return '<ul>' + iris.map(i => {\n      const c = M.classes.get(i);\n      const kids = c.children.length ? classTree(c.children, depth + 1) : '';\n      return `<li class=\"${depth <= 1 ? 'root' : ''}${kids ? ' has-kids' + (depth === 0 ? ' open' : '') : ''}\" data-name=\"${esc((c.name + ' ' + c.label).toLowerCase())}\">\n        ${kids ? caret : leaf}<a href=\"#${esc(c.name)}\">${depth === 1 ? `<span class=\"sw\" style=\"background:${SDDT.groupColor(c.group)}\"><\/span>` : ''}${esc(c.name)}<\/a>\n        ${kids}<\/li>`;\n    }).join('') + '<\/ul>';\n  }\n  // Properties grouped by domain\n  function propTree(list) {\n    const groups = new Map();\n    for (const pr of list) {\n      const keys = pr.domain.length ? pr.domain.map(d => d.kind === 'iri' ? local(d.iri) : typeLabel(d)) : ['No domain'];\n      keys.forEach(k => { if (!groups.has(k)) groups.set(k, []); groups.get(k).push(pr); });\n    }\n    return '<ul>' + [...groups].map(([k, ps]) => `<li class=\"grp has-kids\" data-name=\"${esc(k.toLowerCase())}\">${caret}<span class=\"glabel\">${esc(k)}<span class=\"cnt\">${ps.length}<\/span><\/span>\n        <ul>${ps.map(pr => `<li data-name=\"${esc((pr.name + ' ' + pr.label).toLowerCase())}\">${leaf}<a href=\"#p-${esc(pr.name)}\">${esc(pr.name)}<\/a><\/li>`).join('')}<\/ul><\/li>`).join('') + '<\/ul>';\n  }\n  const section = (key, title, n, body) =>\n    `<div class=\"tsec open\" data-sec=\"${key}\"><button class=\"tsec-h\" type=\"button\"><span class=\"caret-i\"><\/span>${title}<span class=\"cnt\">${n}<\/span><\/button>${body}<\/div>`;\n  const roots = [...M.classes.values()].filter(c => !c.parents.length).map(c => c.iri);\n  const tree = document.getElementById('tree');\n  tree.innerHTML =\n    section('classes', 'Classes', M.classes.size, classTree(roots, 0)) +\n    section('op', 'Object properties', M.objectProps.length, propTree(M.objectProps)) +\n    section('dp', 'Datatype properties', M.dataProps.length, propTree(M.dataProps));\n\n  tree.addEventListener('click', e => {\n    const c = e.target.closest('.caret, .glabel');\n    if (c) { c.closest('li').classList.toggle('open'); return; }\n    const h = e.target.closest('.tsec-h');\n    if (h) h.parentElement.classList.toggle('open');\n  });\n  document.getElementById('expand-all').addEventListener('click', () => tree.querySelectorAll('.tsec, li.has-kids').forEach(x => x.classList.add('open')));\n  document.getElementById('collapse-all').addEventListener('click', () => {\n    tree.querySelectorAll('li.has-kids').forEach(x => x.classList.remove('open'));\n    tree.querySelectorAll('.tsec').forEach(x => x.classList.add('open'));\n  });\n  // Search: show matches and their path, expanded\n  document.getElementById('q').addEventListener('input', e => {\n    const q = e.target.value.trim().toLowerCase();\n    tree.classList.toggle('searching', !!q);\n    tree.querySelectorAll('li').forEach(li => {\n      const self = li.dataset.name.includes(q);\n      const sub = [...li.querySelectorAll('li')].some(x => x.dataset.name.includes(q));\n      li.style.display = !q || self || sub ? '' : 'none';\n      li.classList.toggle('sopen', !!q && sub);\n    });\n    tree.querySelectorAll('.tsec').forEach(sec => {\n      const any = [...sec.querySelectorAll('li')].some(li => li.style.display !== 'none');\n      sec.style.display = !q || any ? '' : 'none';\n    });\n  });\n  function revealInTree(a) {\n    let li = a.closest('li');\n    while (li) { li.classList.add('open'); li = li.parentElement.closest('li'); }\n    const sec = a.closest('.tsec'); if (sec) sec.classList.add('open');\n  }\n\n  // ---------------- Classes ----------------\n  const allProps = M.objectProps.map(p => Object.assign({ kind: 'Object' }, p)).concat(M.dataProps.map(p => Object.assign({ kind: 'Datatype' }, p)));\n  const domainHas = (p, iri) => p.domain.some(d => d && d.kind === 'iri' && d.iri === iri);\n  const rangeOf = iri => M.objectProps.filter(p => p.range.some(r => r && r.kind === 'iri' && r.iri === iri));\n\n  function classDetail(c) {\n    const chain = [c.iri, ...c.ancestors].reverse();\n    const own = allProps.filter(p => domainHas(p, c.iri));\n    const inh = c.ancestors.flatMap(a => allProps.filter(p => domainHas(p, a)).map(p => Object.assign({ from: a }, p)));\n    const props = own.concat(inh);\n    const incoming = rangeOf(c.iri);\n    return `<article class=\"cls\" id=\"${esc(c.name)}\">\n      <h2>${esc(c.name)} <span class=\"lb\">${esc(c.label)}<\/span><\/h2>\n      <div class=\"iri\">${esc(c.iri)}<\/div>\n      ${c.comment ? `<p style=\"margin:10px 0 0\">${esc(c.comment)}<\/p>` : ''}\n      <div class=\"crumbs\">Hierarchy: ${chain.map(clsLink).join(' › ')}<\/div>\n      <div class=\"crumbs\">Dimension: ${esc(dimLabel(c))}<\/div>\n      ${c.children.length ? `<div class=\"crumbs\">Subclasses: ${c.children.map(clsLink).join(', ')}<\/div>` : ''}\n      ${c.restrictions.length ? `<h4>Restrictions<\/h4><div class=\"table-wrap\"><table><tr><th>Property<\/th><th>Constraint<\/th><th>Class<\/th><\/tr>\n        ${c.restrictions.map(r => `<tr><td>${propLink(r.prop)}<\/td><td>${esc(r.kind)}<\/td><td>${clsLink(r.cls)}<\/td><\/tr>`).join('')}<\/table><\/div>` : ''}\n      ${props.length ? `<h4>Properties (${props.length})<\/h4>\n        <div class=\"table-wrap\"><table><tr><th>Property<\/th><th>Kind<\/th><th>Range<\/th><th>Description<\/th><\/tr>\n        ${props.map(p => `<tr><td>${propLink(p.iri)}${p.from ? `<span class=\"tag-inh\" title=\"Inherited from a superclass\">${esc(local(p.from))}<\/span>` : ''}<\/td>\n          <td class=\"nowrap\">${p.kind}<\/td><td>${p.range.map(typeHtml).join(', ') || '<span class=\"muted\">-<\/span>'}<\/td>\n          <td class=\"small\">${esc(p.comment)}<\/td><\/tr>`).join('')}\n        <\/table><\/div>` : ''}\n      ${instCount(c.iri) ? `<div class=\"crumbs\">Individuals in the example: <b>${instCount(c.iri)}<\/b><\/div>` : ''}\n      ${shapeRows(c)}\n      ${incoming.length ? `<h4>Range of<\/h4><div class=\"small\">${incoming.map(p => propLink(p.iri)).join(' ')}<\/div>` : ''}\n    <\/article>`;\n  }\n\n  const instCount = iri => [...M.individuals.values()].filter(i => i.types.includes(iri)).length;\n  const card = p => (p.minCount != null || p.maxCount != null) ? `${p.minCount || 0}..${p.maxCount == null ? '*' : p.maxCount}`\n    : (p.qMin != null || p.qMax != null) ? `${p.qMin || 0}..${p.qMax == null ? '*' : p.qMax}` : '';\n  const constraintText = p => [\n    p.qClass && `values of class ${clsLink(p.qClass)} (qualified count)`,\n    p.datatype && `<code>${esc(qname(p.datatype))}<\/code>`,\n    p.cls && `class ${clsLink(p.cls)}`,\n    p.in && `one of ${p.in.map(v => `<code>\"${esc(v)}\"<\/code>`).join(' ')}`,\n    p.minInclusive != null && `≥ ${p.minInclusive}`,\n    p.lessThanOrEquals && `≤ ${propLink(p.lessThanOrEquals)}`,\n  ].filter(Boolean).join(' · ');\n  // SHACL constraints on this class and its superclasses\n  function shapeRows(c) {\n    const rules = [c.iri, ...c.ancestors].flatMap(a => M.shapes.filter(s => s.targets.includes(a)).map(s => ({ s, from: a })));\n    if (!rules.length) return '';\n    return `<h4>SHACL constraints<\/h4><div class=\"table-wrap\"><table><tr><th>Path<\/th><th>Count<\/th><th>Constraint<\/th><th>Severity · message<\/th><th>Shape<\/th><\/tr>\n      ${rules.flatMap(({ s, from }) => [\n        ...s.sparql.map(q => `<tr><td colspan=\"3\">SPARQL constraint<\/td><td><span class=\"chip sev-Violation\">Violation<\/span> <span class=\"small\">${esc(q.message)}<\/span><\/td><td class=\"small\"><a href=\"#s-${esc(local(s.iri))}\"><code>${esc(s.qn)}<\/code><\/a><\/td><\/tr>`),\n        ...s.props.map(p => `<tr><td>${propLink(p.path)}<\/td><td class=\"mono small\">${card(p)}<\/td><td class=\"small\">${constraintText(p)}<\/td>\n          <td><span class=\"chip sev-${p.severity}\">${p.severity}<\/span>${p.message ? ` <span class=\"small\">${esc(p.message)}<\/span>` : ''}<\/td>\n          <td class=\"small\"><a href=\"#s-${esc(local(s.iri))}\"><code>${esc(s.qn)}<\/code><\/a><\/td><\/tr>`)]).join('')}<\/table><\/div>`;\n  }\n\n  function classOverview() {\n    const rows = [...M.classes.values()].map(c => `<tr>\n      <td style=\"padding-left:${14 + c.depth * 18}px\"><a href=\"#${esc(c.name)}\"><code>${esc(c.qn)}<\/code><\/a><\/td>\n      <td class=\"nowrap\">${esc(dimLabel(c))}<\/td><td class=\"small\">${esc(c.comment)}<\/td><td>${instCount(c.iri) || ''}<\/td><\/tr>`).join('');\n    return `<h2 style=\"margin-top:0\">All classes (${M.classes.size})<\/h2>\n      <p class=\"small muted\">Indentation shows inheritance depth. Click a class to see its restrictions and the properties that apply to it.<\/p>\n      <div class=\"table-wrap\"><table><tr><th>Class<\/th><th>Group<\/th><th>Description<\/th><th>Individuals<\/th><\/tr>${rows}<\/table><\/div>`;\n  }\n\n  // ---------------- Properties ----------------\n  function propTable(list, title) {\n    return `<h2 style=\"margin-top:0\">${title}<\/h2>\n      <div class=\"table-wrap\"><table>\n      <tr><th>Property<\/th><th>Domain<\/th><th>Range<\/th><th>Characteristics<\/th><th>Description<\/th><\/tr>\n      ${list.map(p => `<tr class=\"anchor\" id=\"p-${esc(p.name)}\"><td><code>${esc(p.qn)}<\/code><br><span class=\"small muted\">${esc(p.label)}<\/span><\/td>\n        <td>${p.domain.map(typeHtml).join(', ') || '<span class=\"muted\">-<\/span>'}<\/td>\n        <td>${p.range.map(typeHtml).join(', ') || '<span class=\"muted\">-<\/span>'}<\/td>\n        <td>${traitHtml(p)}<\/td>\n        <td class=\"small\">${esc(p.comment)}<\/td><\/tr>`).join('')}\n      <\/table><\/div>`;\n  }\n  document.getElementById('pane-object-properties').innerHTML = propTable(M.objectProps, 'Object properties (owl:ObjectProperty)');\n  document.getElementById('pane-datatype-properties').innerHTML = propTable(M.dataProps, 'Datatype properties (owl:DatatypeProperty)')\n    + `<p class=\"small muted\"><b>Functional<\/b> properties take at most one value per individual, e.g. one latency per service log.<\/p>`;\n\n  document.getElementById('pane-shapes').innerHTML = `<h2 style=\"margin-top:0\">SHACL node shapes (sh:NodeShape)<\/h2>\n    <p class=\"small muted\">From <code>6DDT-shapes.ttl<\/code>. Validation results are on <a href=\"#/examples/validate\">Competency questions<\/a>.<\/p>\n    <div class=\"table-wrap\"><table><tr><th>Shape<\/th><th>Target class<\/th><th>Constraints<\/th><th>Description<\/th><\/tr>\n    ${M.shapes.map(s => {\n      const warn = s.props.filter(p => p.severity === 'Warning').length;\n      return `<tr class=\"anchor\" id=\"s-${esc(local(s.iri))}\"><td><code>${esc(s.qn)}<\/code><br><span class=\"small muted\">${esc(s.label)}<\/span><\/td>\n        <td>${s.targets.map(clsLink).join(', ')}<\/td>\n        <td class=\"nowrap\">${s.props.length + s.sparql.length}${warn ? ` <span class=\"chip sev-Warning\">W ${warn}<\/span>` : ''}<\/td>\n        <td class=\"small\">${esc(s.comment)}<\/td><\/tr>`;\n    }).join('')}<\/table><\/div>`;\n  document.getElementById('n-sh').textContent = M.shapes.length;\n  document.getElementById('n-classes').textContent = M.classes.size;\n  document.getElementById('n-op').textContent = M.objectProps.length;\n  document.getElementById('n-dp').textContent = M.dataProps.length;\n\n  // ---------------- Routing ----------------\n  const TABS = ['classes', 'object-properties', 'datatype-properties', 'shapes'];\n  function route() {\n    const h = decodeURIComponent(location.hash.slice(1));\n    let tab = 'classes', target = null;\n    if (TABS.includes(h)) tab = h;\n    else if (h.startsWith('p-')) {\n      tab = M.objectProps.some(p => 'p-' + p.name === h) ? 'object-properties' : 'datatype-properties';\n      target = h;\n    } else if (h.startsWith('s-')) {\n      tab = 'shapes'; target = h;\n    } else if (h) target = h;\n    if (tab === 'classes') {\n      const c = target && [...M.classes.values()].find(x => x.name === target);\n      document.getElementById('pane-classes').innerHTML = c\n        ? `<p style=\"margin:0 0 12px\"><a href=\"#classes\">← All classes<\/a><\/p>${classDetail(c)}`\n        : classOverview();\n      target = null;\n    }\n    TABS.forEach(t => document.getElementById('pane-' + t).classList.toggle('hidden', t !== tab));\n    document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === tab));\n    document.querySelectorAll('#tree a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + h));\n    const on = document.querySelector('#tree a.on');\n    if (on) { revealInTree(on); const w = document.querySelector('.tree-wrap'); w.scrollTop = on.offsetTop - w.clientHeight / 3; }\n    document.querySelectorAll('tr.anchor.hit').forEach(r => r.classList.remove('hit'));\n    const el = target && document.getElementById(target);\n    if (el) { el.classList.add('hit'); el.scrollIntoView({ block: 'start' }); }\n    else window.scrollTo(0, 0);\n  }\n  window.addEventListener('hashchange', route);\n  route();\n});\n<\/script>\n"}, "examples": {"title": "Competency Questions and Validation", "bodyClass": "", "html": "<style>\n  .tool { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 16px; margin: 16px 0; }\n  .tool-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }\n  #cy { height: 460px; border-radius: var(--radius); overflow: hidden; max-width: 100%; }\n  .tool { min-width: 0; overflow: hidden; }\n  .cq { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin: 14px 0; background: var(--surface); }\n  .cq h3 { margin: 0 0 6px; font-size: 1rem; }\n  .cq details summary { cursor: pointer; color: var(--brand); font-size: .85rem; margin: 6px 0; }\n  .cq table { font-size: .82rem; }\n  .cq td { font-family: var(--mono); font-size: .78rem; word-break: break-word; }\n  .sumrow { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 12px; }\n  .sumrow .chip { font-size: .85rem; padding: 3px 12px; }\n<\/style>\n<div class=\"page-hero\"><div class=\"container\">\n  <div class=\"crumb\">06 · COMPETENCY QUESTIONS · VALIDATION<\/div>\n  <h1>Competency questions and validation<\/h1>\n  <p>Nine questions the ontology must answer, written in SPARQL and run on the example graph after inference, and the SHACL validation result. The results are computed in advance by <code>export_results.py<\/code> and embedded here.<\/p>\n<\/div><\/div>\n\n<main class=\"container doc\">\n  <nav class=\"toc\">\n    <b>Contents<\/b>\n    <a href=\"#graph\">Knowledge Graph<\/a>\n    <a href=\"#cq\">Competency questions<\/a>\n    <a href=\"#validate\">SHACL validation<\/a>\n    <a href=\"#run\">Run it yourself<\/a>\n  <\/nav>\n  <article class=\"doc-body\">\n    <h2 id=\"graph\">Knowledge Graph<\/h2>\n    <p>The individuals and object properties of the example graph in 3D. Sphere color is the dimension, size the number of links. Click <b>Show in graph<\/b> under a question to highlight the individuals in its answer.<\/p>\n    <div class=\"tool\">\n      <div class=\"tool-bar\"><div id=\"kg-ctl\" style=\"flex:1\"><\/div><button class=\"btn btn-line btn-sm\" id=\"reset\" type=\"button\">Clear highlight<\/button><\/div>\n      <div id=\"cy\"><\/div>\n    <\/div>\n\n    <h2 id=\"cq\">Competency questions<\/h2>\n    <p class=\"small muted\">CQ1 to CQ3 test executor identity, quality of service, and service-event recovery; CQ4 and CQ5 test rule-model typing, fault classification, and diagnostic scoping; CQ6 to CQ9 test data lineage, delegation, virtual models, and the agent answer.<\/p>\n    <div id=\"cq-list\"><\/div>\n\n    <h2 id=\"validate\">SHACL validation<\/h2>\n    <div id=\"val-out\"><\/div>\n\n    <h2 id=\"run\">Run it yourself<\/h2>\n    <pre data-lang=\"python\" data-label=\"PowerShell · in the 6DDT website folder\">\n# precompute CQ answers and the SHACL report, then rebuild the single HTML file\npip install rdflib pyshacl\npython export_results.py\npython build_single.py<\/pre>\n  <\/article>\n<\/main>\n\n<script>\ndocument.addEventListener('DOMContentLoaded', () => {\n  const { G, M, errors } = SDDT.load();\n  SDDT.showLoadErrors(document.querySelector('.doc-body'), errors);\n  if (!M) return;\n  const { esc } = SDDT;\n  const R = window.SDDT_RESULTS;\n\n  const kg = KG3D.create(document.getElementById('cy'), G, M);\n  if (kg) KG3D.controls(document.getElementById('kg-ctl'), kg, M);\n  document.getElementById('reset').addEventListener('click', () => { if (kg) { kg.clear(); kg.fit(); } });\n\n  if (!R) { document.getElementById('cq-list').innerHTML = '<div class=\"err-box\">No results: run export_results.py first.<\/div>'; return; }\n\n  // Turn ex:… cells back into IRIs to highlight them in the graph\n  const toIri = s => { const m = /^(sddt|ex|vb|brick):(.+)$/.exec(s); return m ? SDDT.NS[m[1]] + m[2] : null; };\n  document.getElementById('cq-list').innerHTML = R.cq.map((q, i) => `<div class=\"cq\" id=\"${esc(q.id)}\">\n      <h3>${esc(q.title)}<\/h3>\n      <div class=\"sumrow\"><span class=\"chip\">${q.total} row${q.total === 1 ? '' : 's'}<\/span>\n        <button class=\"btn btn-line btn-sm\" type=\"button\" data-cq=\"${i}\">Show in graph<\/button><\/div>\n      <details><summary>Show SPARQL<\/summary>${SDDT.codeBlock(q.sparql, 'SPARQL')}<\/details>\n      <div class=\"table-wrap\"><table><tr>${q.columns.map(c => `<th>${esc(c)}<\/th>`).join('')}<\/tr>\n        ${q.rows.map(r => `<tr>${r.map(v => `<td>${esc(v) || '<span class=\"muted\">-<\/span>'}<\/td>`).join('')}<\/tr>`).join('')}<\/table><\/div>\n      ${q.total > q.rows.length ? `<p class=\"small muted\">First ${q.rows.length} rows shown.<\/p>` : ''}\n    <\/div>`).join('');\n  document.getElementById('cq-list').addEventListener('click', e => {\n    const b = e.target.closest('[data-cq]'); if (!b || !kg) return;\n    const q = R.cq[Number(b.dataset.cq)];\n    const ids = new Set();\n    q.rows.forEach(r => r.forEach(v => { const iri = toIri(v); if (iri && M.individuals.has(iri)) ids.add(iri); }));\n    kg.highlight(ids, null);\n    document.getElementById('cy').scrollIntoView({ behavior: 'smooth', block: 'center' });\n  });\n\n  const V = R.shacl;\n  if (!V) { document.getElementById('val-out').innerHTML = '<div class=\"err-box\">No SHACL result: install pyshacl and run export_results.py.<\/div>'; return; }\n  const viol = V.findings.filter(f => f.severity === 'Violation').length, warn = V.findings.length - viol;\n  document.getElementById('val-out').innerHTML = `\n    <div class=\"callout ${V.conforms ? 'ok' : 'warn'}\"><p><b class=\"t\">${V.conforms ? 'Conforms' : 'Violations found'}<\/b>\n      ${V.shapes} shapes · closure of ${R.triples.closure.toLocaleString()} triples (asserted ${R.triples.asserted.toLocaleString()}) · ${R.individuals} individuals.\n      Warnings mark incomplete records and do not block conformance.<\/p><\/div>\n    <div class=\"sumrow\"><span class=\"chip sev-Violation\">Violation ${viol}<\/span><span class=\"chip sev-Warning\">Warning ${warn}<\/span><\/div>\n    ${V.findings.length ? `<div class=\"table-wrap\"><table><tr><th>Severity<\/th><th>Focus<\/th><th>Message<\/th><th>Shape<\/th><\/tr>\n      ${V.findings.map(f => `<tr><td><span class=\"chip sev-${esc(f.severity)}\">${esc(f.severity)}<\/span><\/td><td><code>${esc(f.focus)}<\/code><\/td><td>${esc(f.message)}<\/td><td class=\"small\"><a href=\"#/reference/s-${esc(f.shape.split(':').pop())}\"><code>${esc(f.shape)}<\/code><\/a><\/td><\/tr>`).join('')}<\/table><\/div>` : ''}`;\n});\n<\/script>\n"}, "files": {"title": "6DDT Downloads", "bodyClass": "", "html": "<style>\n  .file { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 14px; align-items: center;\n    border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }\n  .file .ic { width: 46px; height: 46px; border-radius: 6px; display: flex; align-items: center; justify-content: center;\n    font-family: var(--mono); font-weight: 700; font-size: .72rem; color: #fff; }\n  .ic.ontology { background: var(--g-service); } .ic.vb { background: var(--g-vb); } .ic.shapes { background: var(--g-value); } .ic.data { background: var(--g-data); }\n  .file .nm { font-weight: 700; font-family: var(--mono); font-size: .95rem; word-break: break-all; }\n  .file .meta { font-size: .82rem; color: var(--text-faint); }\n  .file .desc { font-size: .88rem; color: var(--text-soft); margin-top: 2px; }\n  @media (max-width: 560px) { .file { grid-template-columns: 46px minmax(0, 1fr); } .file .btn { grid-column: 1 / -1; justify-self: start; } }\n<\/style>\n<div class=\"page-hero\"><div class=\"container\">\n  <div class=\"crumb\">07 · DOWNLOADS<\/div>\n  <h1>Downloads<\/h1>\n  <p>The files behind this site: the 6DDT schema, the VB schema it aligns with, the SHACL shapes, and the illustrative example graph. All are Turtle (<code>.ttl<\/code>) in UTF-8.<\/p>\n<\/div><\/div>\n\n<main class=\"container doc\">\n  <nav class=\"toc\">\n    <b>Contents<\/b>\n    <a href=\"#files\">Files<\/a>\n    <a href=\"#use\">Load and validate<\/a>\n  <\/nav>\n  <article class=\"doc-body\">\n    <h2 id=\"files\">Files<\/h2>\n    <div id=\"file-list\"><\/div>\n    <p class=\"small muted\">The published schema is at <a href=\"https://skku-bist.github.io/assets/6DDT_schema.ttl\" target=\"_blank\" rel=\"noopener\">skku-bist.github.io/assets/6DDT_schema.ttl<\/a>; the VB schema is documented at <a href=\"https://skku-bist.github.io/\" target=\"_blank\" rel=\"noopener\">skku-bist.github.io<\/a>.\n      The example graph is invented for illustration and contains no data from the 6DDT case study.<\/p>\n\n    <h2 id=\"use\">Load and validate<\/h2>\n    <p>Any RDF or OWL tool reads the files. In Python, use rdflib and pySHACL.<\/p>\n    <pre data-lang=\"python\" data-label=\"Python (rdflib · pySHACL)\">\nfrom rdflib import Graph\nfrom pyshacl import validate\n\ng = Graph()\nfor f in [\"6DDT_schema.ttl\", \"VB_schema.ttl\", \"6DDT-example.ttl\"]:\n    g.parse(f)\nshapes = Graph().parse(\"6DDT-shapes.ttl\")\n# inference=\"owlrl\" adds inverse properties and superclass types before checking\nconforms, _, report = validate(g, shacl_graph=shapes, inference=\"owlrl\", advanced=True, allow_warnings=True)\nprint(conforms)\nprint(report)<\/pre>\n  <\/article>\n<\/main>\n\n<script>\ndocument.addEventListener('DOMContentLoaded', () => {\n  const { esc, fmtBytes } = SDDT;\n  const ROLE = {\n    ontology: ['OWL', '6DDT schema (TBox · RBox)', 'Classes, object and datatype properties, and axioms of the six dimensions'],\n    vb: ['VB', 'VB schema', 'Virtual models (behavior, correction, distance) and their data, with the eight VB relationships'],\n    shapes: ['SHACL', 'SHACL shapes', 'Data-quality rules for service logs, executors, control loops, rule models, and sensor data'],\n    data: ['ABox', 'Example knowledge graph (illustrative)', 'A fictional floor with an FDD service that ran four times; all values invented'],\n  };\n  const count = f => { try { return SDDT.parseTurtle(f.text, f.name).length; } catch (e) { return null; } };\n  document.getElementById('file-list').innerHTML = (window.SDDT_BUNDLE || []).map(f => {\n    const [ab, kind, desc] = ROLE[f.role] || ROLE.data;\n    const n = count(f);\n    return `<div class=\"file\" id=\"${esc(f.name)}\">\n      <div class=\"ic ${f.role}\">${ab}<\/div>\n      <div><div class=\"nm\">${esc(f.name)}<\/div>\n        <div class=\"desc\">${kind}: ${desc}<\/div>\n        <div class=\"meta\">${f.version ? 'version ' + esc(f.version) + ' · ' : ''}${fmtBytes(f.size || 0)}${n != null ? ` · ${n.toLocaleString()} triples` : ''} · updated ${esc(f.modified || '')}<\/div><\/div>\n      <button class=\"btn btn-solid btn-sm\" type=\"button\" data-dl=\"${esc(f.name)}\">Download<\/button>\n    <\/div>`;\n  }).join('') || '<p class=\"muted\">No files.<\/p>';\n});\n<\/script>\n"}};</script>
<script>(function () {
  // Address: #/page  or  #/page/anchor-in-page. A change of the in-page anchor alone does not reload.
  var PAGES = window.SINGLE_PAGES, KEY = 'sddt.single.page';
  var h = location.hash, page = null, rest = null;
  var m = /^#\/([a-z]+)(?:\/(.*))?$/.exec(h);
  if (m && PAGES[m[1]]) { page = m[1]; rest = m[2] || ''; }
  if (!page) { try { page = sessionStorage.getItem(KEY); } catch (e) {} }
  if (!page || !PAGES[page]) page = 'index';
  try { sessionStorage.setItem(KEY, page); } catch (e) {}
  if (rest !== null) history.replaceState(null, '', rest ? '#' + decodeURIComponent(rest) : location.pathname + location.search);
  window.SINGLE_PAGE = page;
  var P = PAGES[page];
  document.title = P.title;
  if (P.bodyClass) document.body.className = P.bodyClass;
  window.addEventListener('hashchange', function () { if (/^#\/[a-z]+/.test(location.hash)) location.reload(); });
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-dl]');
    if (!b) return;
    var f = (window.SDDT_BUNDLE || []).find(function (x) { return x.name === b.dataset.dl; });
    if (f) window.SDDT.download(f.name, f.text);
  });
  document.write(P.html);
})();
</script>
