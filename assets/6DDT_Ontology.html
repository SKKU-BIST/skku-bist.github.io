        <div class="book-search">
          <input type="search" id="site-search" placeholder="Search classes, properties, pages" autocomplete="off" aria-label="Search the site">
          <div class="search-results" id="search-results"></div>
        </div>
        <nav class="book-nav">
          <ul>${PAGES.map(p => `<li><a href="${p.href}"${p.href === here ? ' class="active"' : ''}><span class="num">${p.num}</span>${p.title}</a></li>`).join('')}</ul>
          ${LINK_GROUPS.map(([g, links]) => `<div class="group">${g}</div>
          <ul>${links.map(([t, u]) => `<li><a class="ext" href="${u}" target="_blank" rel="noopener">${t}</a></li>`).join('')}</ul>`).join('')}
        </nav>
        <div class="book-menu-foot">
          <div class="co">Developed by</div>
          ${partnersHtml()}
          <button class="theme-btn" type="button">◐ Light / dark</button>
        </div>
      </div></aside>
      <div class="book-page">
        <header class="book-header"><button type="button" aria-label="Open menu">${MENU}</button><span>${esc(PAGES[idx].title)}</span></header>
        <div class="book-content"></div>
        <footer class="book-footer">
          <span>6DDT Ontology · BIST Lab, Sungkyunkwan University</span>
          <span class="pager">${idx > 0 ? `<a href="${PAGES[idx - 1].href}">← ${PAGES[idx - 1].title}</a>` : ''}
            ${idx < PAGES.length - 1 ? `&nbsp;&nbsp;<a href="${PAGES[idx + 1].href}">${PAGES[idx + 1].title} →</a>` : ''}</span>
        </footer>
      </div>
      <aside class="book-toc"><div class="book-toc-inner"></div></aside>`;

    // Move the page content into the middle column (scripts stay where they are)
    const content = book.querySelector('.book-content');
    [...document.body.childNodes].forEach(n => { if (n.nodeName !== 'SCRIPT') content.append(n); });
    document.body.prepend(book);

    book.querySelector('.theme-btn').addEventListener('click', toggleTheme);
    book.querySelector('.book-header button').addEventListener('click', e => {
      e.stopPropagation();
      document.body.classList.toggle('menu-open');
    });
    document.addEventListener('click', e => {
      if (document.body.classList.contains('menu-open') && !e.target.closest('.book-menu')) document.body.classList.remove('menu-open');
    });
    buildToc(book.querySelector('.book-toc-inner'), content);
    setupSearch();
  }

  // Right-hand "On this page": the page's own .toc if it has one, otherwise its h2/h3
  function buildToc(box, content) {
    let items = [...content.querySelectorAll('.doc > .toc a[href^="#"]')]
      .map(a => ({ href: a.getAttribute('href'), text: a.textContent, sub: a.classList.contains('sub') }));
    if (!items.length) {
      let n = 0;
      items = [...content.querySelectorAll('h2, h3')].filter(h => !h.closest('.card, .page-hero, .cls, .cq')).map(h => {
        if (!h.id) h.id = 'sec-' + (++n);
        return { href: '#' + h.id, text: h.textContent, sub: h.tagName === 'H3' };
      });
    }
    if (!items.length) { box.parentElement.classList.add('hidden'); return; }
    box.innerHTML = '<b>On this page</b>' + items.map(i =>
      `<a href="${esc(i.href)}"${i.sub ? ' class="sub"' : ''}>${esc(i.text)}</a>`).join('');
  }

  // Sidebar search: pages + classes + properties (the TTL is parsed once, on the first search)
  let searchIndex = null;
  function getSearchIndex() {
    if (searchIndex) return searchIndex;
    searchIndex = PAGES.map(p => ({ t: p.title, k: 'Page', d: '', href: p.href }));
    try {
      const { M } = load();
      if (M) {
        M.classes.forEach(c => searchIndex.push({ t: c.name, t2: c.label, k: 'Class', d: c.comment || c.qn, href: '#/reference/' + c.name }));
        M.objectProps.forEach(p => searchIndex.push({ t: p.name, k: 'Object property', d: p.comment || p.qn, href: '#/reference/p-' + p.name }));
        M.dataProps.forEach(p => searchIndex.push({ t: p.name, k: 'Datatype property', d: p.comment || p.qn, href: '#/reference/p-' + p.name }));
      }
    } catch (e) { /* if parsing fails, search pages only */ }
    return searchIndex;
  }
  function setupSearch() {
    const input = document.getElementById('site-search'), box = document.getElementById('search-results');
    let sel = -1;
    const render = () => {
      const q = input.value.trim().toLowerCase();
      if (!q) { box.classList.remove('open'); return; }
      const starts = i => (i.t.toLowerCase().startsWith(q) ? 0 : 1);
      const hits = getSearchIndex().filter(i => (i.t + ' ' + (i.t2 || '')).toLowerCase().includes(q))
        .sort((a, b) => starts(a) - starts(b)).slice(0, 12);
      sel = -1;
      box.innerHTML = hits.length ? hits.map(h => `<a href="${esc(h.href)}">${esc(h.t)}<span class="k">${h.k}</span><span class="d">${esc(h.d)}</span></a>`).join('')
        : '<div class="none">No results</div>';
      box.classList.add('open');
    };
    input.addEventListener('input', render);
    input.addEventListener('focus', render);
    input.addEventListener('keydown', e => {
      const links = [...box.querySelectorAll('a')];
      if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && links.length) {
        e.preventDefault();
        sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + links.length) % links.length;
        links.forEach((a, i) => a.classList.toggle('sel', i === sel));
      } else if (e.key === 'Enter' && links.length) {
        location.href = links[Math.max(sel, 0)].getAttribute('href');
      } else if (e.key === 'Escape') { box.classList.remove('open'); input.blur(); }
    });
    document.addEventListener('click', e => { if (!e.target.closest('.book-search')) box.classList.remove('open'); });
  }

  // ------------------------------------------------------------------
  // Utilities
  // ------------------------------------------------------------------
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function fmtBytes(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(2) + ' MB';
  }
  let toastTimer;
  function toast(msg) {
    let el = document.querySelector('.toast');
    if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.append(el); }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
  }
  function download(name, text, type) {
    const blob = new Blob([text], { type: type || 'text/turtle;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.append(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  }

  // ------------------------------------------------------------------
  // Turtle / SPARQL highlighting
  // ------------------------------------------------------------------
  const TOKEN = /(<[^>\s]*>)|("""[\s\S]*?"""|"(?:[^"\\\n]|\\.)*")(@[A-Za-z-]+|\^\^[A-Za-z_][\w-]*:[\w-]*)?|(#[^\n]*)|(@prefix|@base|\bPREFIX\b|\bSELECT\b|\bWHERE\b|\bFILTER\b|\bOPTIONAL\b|\bDISTINCT\b|\bUNION\b|\bVALUES\b|\bASK\b|\bCONSTRUCT\b|\bORDER BY\b|\bGROUP BY\b|\bNOT EXISTS\b|\bimport\b|\bfrom\b|\bfor\b|\bin\b|\bprint\b)|([A-Za-z_][\w-]*:(?:[\w-]|\.(?=[\w-]))*|:[\w-]+)|(\?\w+|\$\w+)|(\b\d+(?:\.\d+)?\b)|(\ba\b)/g;
  function highlight(src) {
    let out = '', last = 0, m;
    TOKEN.lastIndex = 0;
    while ((m = TOKEN.exec(src))) {
      out += esc(src.slice(last, m.index));
      if (m[1]) out += `<span class="tk-iri">${esc(m[1])}</span>`;
      else if (m[2]) {
        out += `<span class="tk-str">${esc(m[2])}</span>`;
        if (m[3]) out += `<span class="tk-lang">${esc(m[3])}</span>`;
      }
      else if (m[4]) out += `<span class="tk-cmt">${esc(m[4])}</span>`;
      else if (m[5]) out += `<span class="tk-kw">${esc(m[5])}</span>`;
      else if (m[6]) out += `<span class="tk-pname">${esc(m[6])}</span>`;
      else if (m[7]) out += `<span class="tk-kw">${esc(m[7])}</span>`;
      else if (m[8]) out += `<span class="tk-num">${esc(m[8])}</span>`;
      else if (m[9]) out += `<span class="tk-kw">a</span>`;
      last = TOKEN.lastIndex;
    }
    return out + esc(src.slice(last));
  }
  function codeBlock(src, label) {
    return `<div class="code"><div class="code-head"><span>${esc(label || 'turtle')}</span>
      <button class="copy-btn" type="button">Copy</button></div><pre>${highlight(src.replace(/^\n+|\s+$/g, ''))}</pre></div>`;
  }
  // Turn <pre data-lang> blocks on the page into highlighted blocks
  function enhanceCode(root) {
    (root || document).querySelectorAll('pre[data-lang]').forEach(pre => {
      const wrap = document.createElement('div');
      wrap.innerHTML = codeBlock(pre.textContent, pre.dataset.label || pre.dataset.lang);
      pre.replaceWith(wrap.firstElementChild);
    });
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('.copy-btn');
    if (!b) return;
    const pre = b.closest('.code').querySelector('pre');
    const done = () => toast('Copied');
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(pre.textContent).then(done, () => fallbackCopy(pre.textContent, done));
    else fallbackCopy(pre.textContent, done);
  });
  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.append(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('Could not copy'); }
    ta.remove();
  }

  // ------------------------------------------------------------------
  // Published files: window.SDDT_BUNDLE (embedded by build_single.py from files/*.ttl)
  // ------------------------------------------------------------------
  function activeFiles() { return (window.SDDT_BUNDLE || []).map(f => Object.assign({}, f)); }

  // ------------------------------------------------------------------
  // Parsing
  // ------------------------------------------------------------------
  function parseTurtle(text, name) {
    if (!window.N3) throw new Error('N3.js could not be loaded. Check the internet connection (CDN).');
    const parser = new N3.Parser({ format: 'text/turtle' });
    try {
      return parser.parse(text, null, (p, iri) => {
        const v = iri && (iri.value || iri.id || String(iri));
        if (p && v && !PREFIXES[p]) PREFIXES[p] = v;
      });
    } catch (e) {
      throw new Error(`${name || 'Turtle'}: ${e.message}`);
    }
  }

  class Graph {
    constructor(quads) {
      this.s = new N3.Store(quads || []);
      // N3.Store does not keep source order, so record the first appearance of each subject
      this.order = new Map();
      (quads || []).forEach(q => { if (!this.order.has(q.subject.value)) this.order.set(q.subject.value, this.order.size); });
    }
    pos(iri) { const i = this.order.get(iri); return i === undefined ? 1e9 : i; }
    get size() { return this.s.size; }
    _t(x) { return typeof x === 'string' ? N3.DataFactory.namedNode(x) : x; }
    objs(s, p) { return this.s.getObjects(this._t(s), this._t(p), null); }
    subs(p, o) { return this.s.getSubjects(this._t(p), this._t(o), null); }
    one(s, p) { return this.objs(s, p)[0] || null; }
    quads(s, p, o) { return this.s.getQuads(s ? this._t(s) : null, p ? this._t(p) : null, o ? this._t(o) : null, null); }
    iris(s, p) { return this.objs(s, p).filter(t => t.termType === 'NamedNode').map(t => t.value); }
    lit(s, p, lang) {
      const all = this.objs(s, p).filter(t => t.termType === 'Literal');
      if (!all.length) return '';
      const hit = lang !== undefined ? all.find(t => t.language === lang) : null;
      return (hit || all[0]).value;
    }
    list(head) {
      const out = []; let n = head, guard = 0;
      while (n && n.value !== NS.rdf + 'nil' && guard++ < 1000) {
        const f = this.one(n, NS.rdf + 'first');
        if (f) out.push(f);
        n = this.one(n, NS.rdf + 'rest');
      }
      return out;
    }
  }

  // ------------------------------------------------------------------
  // Model
  //   The five classes under sddt:Entity are the 6DDT dimensions; the sixth, Connection,
  //   is carried by the relationships (hasInput, generates, hasPart and their inverses).
  //   VB schema classes form their own group.
  // ------------------------------------------------------------------
  const GROUPS = {
    PhysicalEntity: { label: 'Physical entity', color: '--g-physical' },
    VirtualModel: { label: 'Virtual model', color: '--g-virtual' },
    DTData: { label: 'DT data', color: '--g-data' },
    Tool: { label: 'Tool', color: '--g-tooldim' },
    AIAgent: { label: 'AI agent', color: '--g-agent' },
    VB: { label: 'VB schema', color: '--g-vb' },
    Entity: { label: 'Entity (root)', color: '--text-faint' },
  };
  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#888';
  }
  function groupColor(g) { return cssVar((GROUPS[g] || {}).color || '--text-faint'); }

  function describeType(G, t) {
    if (!t) return null;
    if (t.termType === 'NamedNode') return { kind: 'iri', iri: t.value };
    const union = G.one(t, NS.owl + 'unionOf');
    if (union) return { kind: 'union', members: G.list(union).map(x => x.value) };
    const oneOf = G.one(t, NS.owl + 'oneOf');
    if (oneOf) return { kind: 'oneOf', values: G.list(oneOf).map(x => x.value) };
    return { kind: 'blank' };
  }

  function buildModel(G) {
    const T = NS.rdf + 'type', SUB = NS.rdfs + 'subClassOf';
    const M = { ontology: null, ontologies: [], classes: new Map(), objectProps: [], dataProps: [], shapes: [], individuals: new Map() };
    for (const o of G.subs(T, NS.owl + 'Ontology')) {
      const info = {
        iri: o.value,
        title: G.lit(o, NS.rdfs + 'label', 'en'),
        comment: G.lit(o, NS.rdfs + 'comment', 'en'),
        version: G.lit(o, NS.owl + 'versionInfo'),
      };
      M.ontologies.push(info);
      if (/6DDT_schema\.ttl#?SixDDT$/.test(o.value) || o.value === NS.sddt + 'SixDDT') M.ontology = info;
    }
    M.ontology = M.ontology || M.ontologies[0] || null;

    // Classes, with their someValuesFrom / allValuesFrom / qualified cardinality restrictions
    const bySource = terms => terms.sort((a, b) => G.pos(a.value) - G.pos(b.value));
    for (const c of bySource(G.subs(T, NS.owl + 'Class'))) {
      if (c.termType !== 'NamedNode') continue;
      const restrictions = [];
      for (const s of G.objs(c, SUB)) {
        if (s.termType !== 'BlankNode') continue;
        const on = G.one(s, NS.owl + 'onProperty');
        const some = G.one(s, NS.owl + 'someValuesFrom'), all = G.one(s, NS.owl + 'allValuesFrom');
        const exact = G.one(s, NS.owl + 'qualifiedCardinality'), onClass = G.one(s, NS.owl + 'onClass');
        if (!on) continue;
        if (some || all) restrictions.push({ prop: on.value, kind: some ? 'some' : 'only', cls: (some || all).value });
        else if (exact && onClass) restrictions.push({ prop: on.value, kind: 'exactly ' + exact.value, cls: onClass.value });
      }
      M.classes.set(c.value, {
        iri: c.value, qn: qname(c.value), name: local(c.value),
        label: G.lit(c, NS.rdfs + 'label', 'en') || local(c.value),
        comment: G.lit(c, NS.rdfs + 'comment', 'en'),
        parents: G.iris(c, SUB), children: [], restrictions,
      });
    }
    // VB and 6DDT both have a class named VirtualModel: give VB classes their prefix in the name
    for (const c of M.classes.values()) if (c.iri.startsWith(NS.vb)) c.name = 'vb:' + c.name;
    for (const c of M.classes.values()) {
      c.parents.forEach(p => M.classes.has(p) && M.classes.get(p).children.push(c.iri));
    }
    // List the dimensions in the order of the 6DDT model, not the file order
    const rank = iri => { const i = Object.keys(GROUPS).indexOf(local(iri)); return i < 0 ? 99 : i; };
    for (const c of M.classes.values()) {
      if (!c.parents.length) c.children.sort((a, b) => rank(a) - rank(b));
    }
    for (const c of M.classes.values()) {
      const anc = ancestors(M, c.iri);
      c.ancestors = anc;
      c.depth = anc.length;
      if (c.iri.startsWith(NS.vb)) { c.group = 'VB'; continue; }
      // group = the dimension class directly under the root (Entity)
      const chain = [c.iri, ...anc];
      c.group = local(chain.length > 1 ? chain[chain.length - 2] : chain[0]);
    }

    // Properties
    const props = (type, arr) => {
      for (const p of bySource(G.subs(T, type))) {
        if (p.termType !== 'NamedNode') continue;
        const types = G.iris(p, T).map(local);
        arr.push({
          iri: p.value, qn: qname(p.value), name: p.value.startsWith(NS.vb) ? 'vb:' + local(p.value) : local(p.value),
          label: G.lit(p, NS.rdfs + 'label', 'en') || local(p.value),
          comment: G.lit(p, NS.rdfs + 'comment', 'en'),
          domain: G.objs(p, NS.rdfs + 'domain').map(t => describeType(G, t)),
          range: G.objs(p, NS.rdfs + 'range').map(t => describeType(G, t)),
          parent: G.iris(p, NS.rdfs + 'subPropertyOf')[0] || null,
          inverse: G.iris(p, NS.owl + 'inverseOf')[0] || null,
          traits: types.filter(t => !/^(ObjectProperty|DatatypeProperty)$/.test(t)).map(t => t.replace('Property', '')),
        });
      }
    };
    props(NS.owl + 'ObjectProperty', M.objectProps);
    props(NS.owl + 'DatatypeProperty', M.dataProps);
    for (const p of M.objectProps) {
      if (!p.inverse) continue;
      const q = M.objectProps.find(x => x.iri === p.inverse);
      if (q && !q.inverse) q.inverse = p.iri;
    }

    // SHACL shapes (for display; validation results are computed by export_results.py)
    const SH = NS.sh;
    const num = t => t ? Number(t.value) : null;
    for (const s of bySource(G.subs(T, SH + 'NodeShape'))) {
      const shape = {
        iri: s.value, qn: s.termType === 'NamedNode' ? qname(s.value) : '(blank)',
        label: G.lit(s, NS.rdfs + 'label'), comment: G.lit(s, NS.rdfs + 'comment'),
        targets: G.iris(s, SH + 'targetClass'), sparql: [], props: [],
      };
      for (const q of G.objs(s, SH + 'sparql')) shape.sparql.push({ message: G.lit(q, SH + 'message'), select: G.lit(q, SH + 'select') });
      for (const ps of G.objs(s, SH + 'property')) {
        const inL = G.one(ps, SH + 'in');
        const sev = G.one(ps, SH + 'severity');
        const qv = G.one(ps, SH + 'qualifiedValueShape');
        shape.props.push({
          path: (G.one(ps, SH + 'path') || {}).value,
          name: G.lit(ps, SH + 'name'),
          minCount: num(G.one(ps, SH + 'minCount')),
          maxCount: num(G.one(ps, SH + 'maxCount')),
          qClass: qv ? (G.one(qv, SH + 'class') || {}).value || null : null,
          qMin: num(G.one(ps, SH + 'qualifiedMinCount')), qMax: num(G.one(ps, SH + 'qualifiedMaxCount')),
          datatype: (G.one(ps, SH + 'datatype') || {}).value || null,
          cls: (G.one(ps, SH + 'class') || {}).value || null,
          in: inL ? G.list(inL).map(x => x.value) : null,
          minInclusive: num(G.one(ps, SH + 'minInclusive')),
          lessThanOrEquals: (G.one(ps, SH + 'lessThanOrEquals') || {}).value || null,
          severity: sev ? local(sev.value) : 'Violation',
          message: G.lit(ps, SH + 'message'),
        });
      }
      M.shapes.push(shape);
    }

    // Individuals: resources typed with an ontology class (the 6DDT type is preferred over the VB type)
    for (const q of G.quads(null, T, null).sort((a, b) => G.pos(a.subject.value) - G.pos(b.subject.value))) {
      if (!M.classes.has(q.object.value) || q.subject.termType !== 'NamedNode') continue;
      const iri = q.subject.value;
      let ind = M.individuals.get(iri);
      if (!ind) {
        ind = { iri, qn: qname(iri), name: local(iri), types: [], title: G.lit(iri, NS.rdfs + 'label') };
        M.individuals.set(iri, ind);
      }
      if (q.object.value.startsWith(NS.sddt)) ind.types.unshift(q.object.value); else ind.types.push(q.object.value);
    }
    for (const ind of M.individuals.values()) {
      const c = M.classes.get(ind.types[0]);
      ind.group = c ? c.group : '';
    }
    return M;
  }

  function ancestors(M, iri) {
    const out = [], seen = new Set([iri]);
    let frontier = [iri];
    while (frontier.length) {
      const next = [];
      for (const c of frontier) {
        for (const p of (M.classes.get(c) || { parents: [] }).parents) {
          if (!seen.has(p)) { seen.add(p); out.push(p); next.push(p); }
        }
      }
      frontier = next;
    }
    return out;
  }
  function typeLabel(t) {
    if (!t) return '';
    if (t.kind === 'iri') return qname(t.iri);
    if (t.kind === 'union') return t.members.map(qname).join(' ∪ ');
    if (t.kind === 'oneOf') return '{ ' + t.values.map(v => `"${v}"`).join(', ') + ' }';
    return '(anonymous)';
  }

  // ------------------------------------------------------------------
  // Loading: parse every published file and return { G, M, files, errors }
  // ------------------------------------------------------------------
  let cached = null;
  function load() {
    if (cached) return cached;
    const files = activeFiles();
    const quads = [], errors = [];
    for (const f of files) {
      try {
        const qs = parseTurtle(f.text, f.name);
        f.tripleCount = qs.length;
        quads.push(...qs);
      } catch (e) { errors.push(e.message); }
    }
    if (!window.N3) return { G: null, M: null, files, errors };
    const G = new Graph(quads);
    cached = { G, M: buildModel(G), files, errors };
    return cached;
  }

  function showLoadErrors(el, errors) {
    if (!errors.length || !el) return;
    el.insertAdjacentHTML('afterbegin',
      `<div class="err-box" style="margin:16px 0">${errors.map(e => esc(e)).join('<br>')}</div>`);
  }

  // TOC scroll spy
  function scrollSpy() {
    const links = [...document.querySelectorAll('.book-toc a[href^="#"]')];
    if (!links.length) return;
    const targets = links.map(a => document.getElementById(a.getAttribute('href').slice(1))).filter(Boolean);
    const onScroll = () => {
      let cur = targets[0];
      for (const t of targets) if (t.getBoundingClientRect().top < 120) cur = t;
      links.forEach(a => a.classList.toggle('on', cur && a.getAttribute('href') === '#' + cur.id));
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  // kg3d.js and graph.js read window.EPC (the name used by the EPC and Doksan sites)
  window.EPC = window.SDDT = {
    NS, PREFIXES, GROUPS, store, esc, qname, local, fmtBytes, toast, download, cssVar, groupColor,
    PARTNERS, logoHtml, logoFallback, partnersHtml,
    highlight, codeBlock, enhanceCode, activeFiles,
    parseTurtle, Graph, buildModel, ancestors, typeLabel, load, showLoadErrors,
  };

  document.addEventListener('DOMContentLoaded', () => {
    renderChrome();
    document.querySelectorAll('[data-partners]').forEach(el => { el.outerHTML = partnersHtml(el.dataset.partners); });
    enhanceCode();
    scrollSpy();
  });
})();
</script>
<script>/* Cytoscape graph elements and style for the Visualization page (class hierarchy and object property tabs) */
(function () {
  'use strict';
  const { NS, qname, local, groupColor, cssVar } = window.SDDT;

  // Label width, so that each box fits its label
  const ctx = document.createElement('canvas').getContext('2d');
  function textW(label, size, weight) {
    ctx.font = `${weight || 400} ${size}px Roboto, system-ui, sans-serif`;
    return Math.max(...String(label).split(/\n/).map(l => ctx.measureText(l).width));
  }
  const lines = label => String(label).split(/\n/).length;

  // Academic diagram style: white boxes with thin black borders; subClassOf drawn as a hollow UML triangle
  function style() {
    const ink = cssVar('--text'), soft = cssVar('--text-soft'), paper = cssVar('--bg'), rule = cssVar('--text-faint');
    const FONT = 'Roboto, system-ui, sans-serif';
    return [
      { selector: 'node', style: {
        'shape': 'rectangle', 'background-color': paper, 'border-width': 1, 'border-color': ink,
        'label': 'data(label)', 'color': ink, 'font-family': FONT, 'font-size': 11, 'font-weight': 400,
        'text-valign': 'center', 'text-halign': 'center', 'text-wrap': 'wrap', 'text-max-width': 220,
        'width': 'data(w)', 'height': 'data(h)',
      } },
      { selector: 'node[?root]', style: { 'font-size': 12.5, 'font-weight': 700, 'border-width': 1.6 } },
      { selector: 'node[kind = "any"]', style: { 'border-style': 'dashed', 'color': soft } },
      { selector: 'edge', style: {
        'width': 0.9, 'line-color': soft, 'target-arrow-color': soft, 'target-arrow-shape': 'vee', 'arrow-scale': 0.8,
        'curve-style': 'bezier',
        'label': 'data(label)', 'font-size': 9.5, 'font-style': 'italic', 'color': ink, 'font-family': 'Roboto Mono, monospace',
        'text-rotation': 'autorotate', 'text-background-color': paper, 'text-background-opacity': 1, 'text-background-padding': 1,
      } },
      // Generalization: hollow triangle on an elbow line of the indented tree,
      //   from the left middle of the child box to 14px right of the parent's bottom-left corner.
      //   treeEdges() computes the bend point after layout and stores it in data(sw)/data(sd).
      { selector: 'edge[kind = "sub"]', style: {
        'line-color': rule, 'target-arrow-color': ink, 'target-arrow-shape': 'triangle', 'target-arrow-fill': 'hollow', 'arrow-scale': 0.9,
        'curve-style': 'segments', 'edge-distances': 'endpoints',
        'segment-weights': 'data(sw)', 'segment-distances': 'data(sd)',
        'source-endpoint': '-50% 0', 'target-endpoint': 'data(tep)',
      } },
      { selector: 'edge[kind = "subroot"]', style: {
        'line-color': rule, 'target-arrow-color': ink, 'target-arrow-shape': 'triangle', 'target-arrow-fill': 'hollow', 'arrow-scale': 0.9,
        'curve-style': 'taxi', 'taxi-direction': 'upward', 'taxi-turn': '50%',
      } },
      { selector: 'edge[kind = "subdash"]', style: {
        'line-style': 'solid', 'target-arrow-shape': 'triangle', 'target-arrow-fill': 'hollow', 'arrow-scale': 1, 'font-style': 'normal', 'color': soft,
      } },
      { selector: 'edge[?loop]', style: { 'loop-direction': '-30deg', 'loop-sweep': '-40deg', 'control-point-step-size': 50 } },
      { selector: '.faded', style: { 'opacity': 0.15 } },
      { selector: 'node.hl', style: { 'border-width': 2.4 } },
      { selector: 'edge.hl', style: { 'line-color': ink, 'target-arrow-color': ink, 'width': 1.8 } },
      { selector: 'node:selected', style: { 'border-width': 2.4, 'background-color': cssVar('--bg-soft') } },
    ];
  }

  // After the tree layout, convert each subClassOf bend point into Cytoscape weight/distance
  function treeEdges(cy) {
    cy.edges('[kind = "sub"]').forEach(e => {
      const s = e.source(), t = e.target();
      const S = { x: s.position('x') - s.data('w') / 2, y: s.position('y') };
      const T = { x: t.position('x') - t.data('w') / 2 + 14, y: t.position('y') + t.data('h') / 2 };
      const C = { x: T.x, y: S.y };                     // bend point
      const vx = T.x - S.x, vy = T.y - S.y, L2 = vx * vx + vy * vy || 1;
      const w = ((C.x - S.x) * vx + (C.y - S.y) * vy) / L2;
      const d = -((C.x - S.x) * vy - (C.y - S.y) * vx) / Math.sqrt(L2);   // match Cytoscape's sign for the perpendicular distance
      e.data({ sw: w, sd: d, tep: `${-t.data('w') / 2 + 14}px ${t.data('h') / 2}px` });
    });
  }

  function sized(data) {
    const fs = data.root ? 12.5 : 11;
    data.w = Math.ceil(textW(data.label, fs, data.root ? 700 : 400)) + 20;
    data.h = lines(data.label) * (fs + 4) + 10;
    return data;
  }

  // Class hierarchy: the subClassOf tree
  function hierarchyElements(M) {
    const els = [];
    for (const c of M.classes.values()) {
      els.push({ data: sized({
        id: c.iri, kind: 'class', label: c.name,
        color: groupColor(c.group), group: c.group, root: c.parents.length === 0,
      }) });
      // Links to the root (Entity) span columns, so they are drawn as an org-chart bracket instead of an elbow
      c.parents.forEach(p => M.classes.has(p) && els.push({ data: {
        id: c.iri + '>' + p, source: c.iri, target: p, label: '', sw: 0.5, sd: 0, tep: '0 0',
        kind: M.classes.get(p).group === 'Entity' ? 'subroot' : 'sub',
      } }));
    }
    return els;
  }

  // Object properties: domain -> range
  function schemaElements(M) {
    const els = [], seen = new Set();
    const addClass = iri => {
      if (seen.has(iri)) return;
      seen.add(iri);
      const c = M.classes.get(iri);
      els.push({ data: sized({
        id: iri, kind: 'class', label: c ? (c.ko ? `${c.name}\n${c.ko}` : c.name) : qname(iri),
        color: c ? groupColor(c.group) : '#888', group: c ? c.group : '', root: c ? c.parents.length === 0 : false,
      }) });
    };
    const expand = t => !t ? [] : t.kind === 'iri' ? [t.iri] : t.kind === 'union' ? t.members : [];
    let i = 0;
    for (const p of M.objectProps) {
      const dom = p.domain.flatMap(expand);
      let rng = p.range.flatMap(expand);
      if (!rng.length) {
        if (!seen.has('any')) { seen.add('any'); els.push({ data: sized({ id: 'any', kind: 'any', label: '(no range)' }) }); }
        rng = ['any'];
      }
      for (const d of dom) {
        addClass(d);
        for (const r of rng) {
          if (r !== 'any') addClass(r);
          els.push({ data: { id: 'p' + (i++), source: d, target: r, label: p.name, pred: p.iri, loop: d === r } });
        }
      }
    }
    // Link shown classes to their shown superclasses
    for (const iri of [...seen]) {
      const c = M.classes.get(iri);
      if (!c) continue;
      c.parents.forEach(pa => { if (seen.has(pa)) els.push({ data: { id: iri + '>' + pa, source: iri, target: pa, kind: 'subdash', label: 'subClassOf' } }); });
    }
    // Add root classes that no property touches
    M.classes.forEach(c => { if (!c.parents.length) addClass(c.iri); });
    return els;
  }

  window.SDDTGraph = {
    style, sized, hierarchyElements, schemaElements, treeEdges,
  };
})();
</script>
<script>/* 3차원 Knowledge Graph (3d-force-graph / three.js)
 *   밝은 회색 배경에 Individual을 음영이 있는 구(sphere)로, Object Property를 가는 선으로만 그린다.
 *   이름·Class는 마우스를 올렸을 때만, 범례·필터·묶기는 캔버스 밖 컨트롤로 제공한다.
 *
 *   const kg = KG3D.create(container, G, M, { onSelect(iri) {} });
 *   kg.setOnly(Set) / kg.setHidden(Set) / kg.setGrouped(bool) / kg.highlight(Set, originIri) / kg.clear()
 *   kg.fit() / kg.reheat() / kg.search(text) / kg.png()
 *   KG3D.controls(holder, kg, M)   // 범례(클릭 → 해당 Class만) + Class별로 묶기
 */
(function () {
  'use strict';
  const { NS, local } = window.EPC;

  // 밝은 회색 배경에서 구분되는 짙은 색
  const COLORS = {
    PhysicalEntity: '#15803d', VirtualModel: '#7048d6', DTData: '#0b84a5',
    Tool: '#d4581f', AIAgent: '#c02a7b', VB: '#c08a00',
  };
  const DIM = '#c3c8d0', DIM_LINK = '#d3d7dd', ORIGIN = '#d7263d', INK = '#1b2430';
  const color = g => COLORS[g] || '#dfe6ff';
  const hexA = (hex, a) => {
    const v = parseInt(hex.slice(1), 16);
    return `rgba(${v >> 16 & 255},${v >> 8 & 255},${v & 255},${Math.max(0, Math.min(1, a)).toFixed(3)})`;
  };

  function graphData(G, M) {
    const props = new Set(M.objectProps.map(p => p.iri));
    const nodes = [...M.individuals.values()].map(ind => {
      const c = M.classes.get(ind.types[0]);
      return { id: ind.iri, name: ind.name, title: ind.title || '', cls: c ? (c.label || c.name) : '', group: ind.group, deg: 0 };
    });
    const byId = new Map(nodes.map(n => [n.id, n]));
    const links = [];
    for (const q of G.quads(null, null, null)) {
      if (!props.has(q.predicate.value)) continue;
      const s = byId.get(q.subject.value), o = byId.get(q.object.value);
      if (!s || !o) continue;
      s.deg++; o.deg++;
      links.push({ source: s.id, target: o.id, label: local(q.predicate.value), sg: s.group, tg: o.group });
    }
    return { nodes, links };
  }

  // Class별 묶기: 각 노드를 소속 Class의 기준점 쪽으로 끌어당기는 힘
  function clusterForce(state) {
    let nodes = [];
    const f = alpha => {
      // 연결이 없는 Individual이 멀리 밀려나지 않도록 모든 노드를 중심 쪽으로 약하게 당긴다
      for (const n of nodes) {
        const k0 = (n.deg ? 0.02 : 0.25) * alpha;
        n.vx -= n.x * k0; n.vy -= n.y * k0; n.vz -= n.z * k0;
      }
      if (!state.grouped) return;
      const k = 0.35 * alpha;
      for (const n of nodes) {
        const a = state.anchors[n.group];
        if (!a) continue;
        n.vx += (a.x - n.x) * k; n.vy += (a.y - n.y) * k; n.vz += (a.z - n.z) * k;
      }
    };
    f.initialize = ns => { nodes = ns; };
    return f;
  }

  function create(container, G, M, opts) {
    opts = opts || {};
    if (!window.ForceGraph3D) {
      container.innerHTML = '<p class="loading" style="color:#9aa6c4">The 3D graph library could not be loaded (check the internet connection).</p>';
      return null;
    }
    container.classList.add('kg-space');
    const data = graphData(G, M);
    const adj = new Map(data.nodes.map(n => [n.id, new Set()]));
    data.links.forEach(l => { adj.get(l.source).add(l.target); adj.get(l.target).add(l.source); });

    const groups = Object.keys(COLORS).filter(g => data.nodes.some(n => n.group === g));
    const state = {
      grouped: false, only: new Set(), hidden: new Set(), labels: true,
      hl: null, origin: null,           // 강조된 노드 id 집합, 기준 노드
      anchors: Object.fromEntries(groups.map((g, i) => {
        const a = i * 2 * Math.PI / groups.length;
        return [g, { x: 150 * Math.cos(a), y: 150 * Math.sin(a), z: (i % 2 ? 40 : -40) }];
      })),
    };
    const idOf = x => (typeof x === 'object' ? x.id : x);
    const visible = n => !state.hidden.has(n.group) && (!state.only.size || state.only.has(n.group));
    const lit = id => !state.hl || state.hl.has(id);
    const linkLit = l => state.hl && state.hl.has(idOf(l.source)) && state.hl.has(idOf(l.target));

    const g = ForceGraph3D({ controlType: 'orbit', rendererConfig: { antialias: true, alpha: true, preserveDrawingBuffer: true } })(container)
      // WebGL 배경은 투명으로 두고, 그 뒤의 회색 바탕 + 빛번짐 레이어가 보이게 한다
      .backgroundColor('rgba(0,0,0,0)')
      .showNavInfo(false)
      .graphData(data)
      .nodeRelSize(2.6)
      .nodeVal(n => 1.5 + n.deg * 0.9)            // 연결이 많을수록 큰 구
      .nodeResolution(28)
      .nodeOpacity(1)
      .nodeColor(n => n.id === state.origin ? ORIGIN : lit(n.id) ? color(n.group) : DIM)
      .nodeLabel(n => `<div class="kg-tip3" style="--c:${color(n.group)}"><b>${EPC.esc(n.name)}</b><span>${EPC.esc(n.cls)}</span></div>`)
      .nodeVisibility(visible)
      .linkVisibility(l => visible({ group: l.sg }) && visible({ group: l.tg }))
      .linkColor(l => !state.hl ? color(l.sg) : linkLit(l) ? INK : DIM_LINK)
      .linkOpacity(0.5)
      .linkWidth(l => (linkLit(l) ? 0.6 : 0))
      .linkDirectionalArrowLength(2.2)
      .linkDirectionalArrowRelPos(1)
      .linkDirectionalParticles(l => (linkLit(l) ? 3 : 0))      // 강조된 경로 위로 빛이 흐름
      .linkDirectionalParticleWidth(1.4)
      .linkDirectionalParticleSpeed(0.007)
      .linkDirectionalParticleColor(() => INK)
      .onNodeClick(n => { neighbors(n.id); if (opts.onSelect) opts.onSelect(n.id); })
      .onBackgroundClick(() => { api.clear(); if (opts.onSelect) opts.onSelect(null); });

    g.d3Force('cluster', clusterForce(state));
    g.d3Force('charge').strength(-60);
    g.d3Force('link').distance(28);

    // 처음 배치를 미리 계산해 두고 곧바로 화면에 맞춘다
    g.warmupTicks(120).cooldownTime(4000);
    // 보이는 노드를 감싸는 구에 맞춰 카메라를 정면에 둔다
    // (라이브러리의 zoomToFit은 orbit 컨트롤과 함께 쓸 때 시점이 틀어지는 문제가 있어 직접 계산)
    function fitView(ms) {
      const ns = data.nodes.filter(n => visible(n) && n.x !== undefined);
      if (!ns.length) return;
      const c = ['x', 'y', 'z'].map(k => ns.reduce((a, n) => a + n[k], 0) / ns.length);
      // 바깥으로 튄 소수의 노드보다 그래프 본체가 화면을 크게 채우도록 85% 지점 반지름을 쓴다
      const ds = ns.map(n => Math.hypot(n.x - c[0], n.y - c[1], n.z - c[2])).sort((a, b) => a - b);
      const r = Math.max(25, ds[Math.floor((ds.length - 1) * 0.85)]);
      const fov = (g.camera().fov || 40) * Math.PI / 180;
      const aspect = container.clientWidth / Math.max(1, container.clientHeight);
      const dist = r / Math.sin(Math.min(fov, fov * aspect) / 2) * 0.95;
      // orbit 컨트롤의 회전 중심(target)도 함께 옮겨야 시점이 유지된다
      const ctr = g.controls();
      if (ctr && ctr.target) ctr.target.set(c[0], c[1], c[2]);
      g.cameraPosition({ x: c[0], y: c[1], z: c[2] + dist }, { x: c[0], y: c[1], z: c[2] }, 0);  // 즉시 이동 (애니메이션 전환은 일부 환경에서 적용되지 않음)
    }
    // 처음 한 번, 그리고 배치가 멈출 때(묶기·재배치 후 포함) 화면에 맞춘다
    let fitted = false;
    setTimeout(() => fitView(500), 300);
    g.onEngineStop(() => { if (!fitted) { fitted = true; fitView(700); } });

    // 라벨: 3D 좌표를 화면 좌표로 투영해 HTML로 겹쳐 그린다 (켜고 끌 수 있음)
    const layer = document.createElement('div');
    layer.className = 'kg-labels on';   // 라벨은 기본으로 표시
    container.append(layer);
    const tags = new Map(data.nodes.map(n => {
      const el = document.createElement('span');
      el.textContent = n.name;
      el.style.setProperty('--c', color(n.group));
      layer.append(el);
      return [n.id, el];
    }));
    // 빛번짐(glow): 각 구 뒤에 방사형 그라데이션 후광을 2D로 그린다.
    // WebGL 캔버스 뒤에 깔리므로 구는 선명하게, 주변만 빛나 보인다.
    const glow = document.createElement('canvas');
    glow.className = 'kg-glow';
    container.prepend(glow);
    const gx = glow.getContext('2d');
    const REL = 2.6;   // nodeRelSize와 같아야 함
    const radiusOf = n => Math.cbrt(1.5 + n.deg * 0.9) * REL;
    function drawGlow() {
      const W = container.clientWidth, H = container.clientHeight, dpr = window.devicePixelRatio || 1;
      if (glow.width !== Math.round(W * dpr) || glow.height !== Math.round(H * dpr)) {
        glow.width = Math.round(W * dpr); glow.height = Math.round(H * dpr);
        glow.style.width = W + 'px'; glow.style.height = H + 'px';
      }
      gx.setTransform(dpr, 0, 0, dpr, 0, 0);
      gx.clearRect(0, 0, W, H);
      gx.globalCompositeOperation = 'source-over';
      const cam = g.camera();
      const focal = (H / 2) / Math.tan((cam.fov || 40) * Math.PI / 360);
      for (const n of data.nodes) {
        if (n.x === undefined || !visible(n)) continue;
        const d = Math.hypot(cam.position.x - n.x, cam.position.y - n.y, cam.position.z - n.z);
        if (d < 1) continue;
        const p = g.graph2ScreenCoords(n.x, n.y, n.z);
        const r = radiusOf(n) * focal / d;              // 화면상의 구 반지름
        const R = r * 2.8;                               // 후광 반지름
        if (p.x < -R || p.y < -R || p.x > W + R || p.y > H + R) continue;
        const c = n.id === state.origin ? ORIGIN : color(n.group);
        const a = lit(n.id) ? (state.hl ? 0.55 : 0.32) : 0.05;
        const grd = gx.createRadialGradient(p.x, p.y, r * 0.6, p.x, p.y, R);
        grd.addColorStop(0, hexA(c, a));
        grd.addColorStop(0.35, hexA(c, a * 0.35));
        grd.addColorStop(1, hexA(c, 0));
        gx.fillStyle = grd;
        gx.beginPath(); gx.arc(p.x, p.y, R, 0, 6.2832); gx.fill();
      }
    }
    (function place() {
      drawGlow();
      if (state.labels) {
        for (const n of data.nodes) {
          const el = tags.get(n.id);
          if (n.x === undefined || !visible(n)) { el.style.display = 'none'; continue; }
          const p = g.graph2ScreenCoords(n.x, n.y, n.z);
          const inView = p.x > -50 && p.y > -20 && p.x < container.clientWidth + 50 && p.y < container.clientHeight + 20;
          el.style.display = inView ? '' : 'none';
          el.style.transform = `translate(${p.x}px, ${p.y}px) translate(-50%, 9px)`;
          el.style.opacity = lit(n.id) ? 1 : 0.15;
        }
      }
      requestAnimationFrame(place);
    })();

    const size = () => { g.width(container.clientWidth); g.height(container.clientHeight); };
    size();
    new ResizeObserver(size).observe(container);

    function refresh() {
      g.nodeColor(g.nodeColor()).linkColor(g.linkColor()).linkWidth(g.linkWidth())
        .linkDirectionalParticles(g.linkDirectionalParticles())
        .nodeVisibility(g.nodeVisibility()).linkVisibility(g.linkVisibility());
    }
    function neighbors(id) {
      state.hl = new Set([id, ...adj.get(id)]);
      state.origin = null;
      refresh();
    }

    const api = {
      graph: g, groups, color,
      setLabels(on) { state.labels = on; layer.classList.toggle('on', on); },
      setGrouped(on) { state.grouped = on; fitted = false; g.d3ReheatSimulation(); },
      setOnly(set) { state.only = set; refresh(); setTimeout(() => fitView(500), 50); },
      setHidden(set) { state.hidden = set; refresh(); },
      highlight(ids, origin) { state.hl = new Set(ids); state.origin = origin || null; if (origin) state.hl.add(origin); refresh(); },
      clear() { state.hl = null; state.origin = null; refresh(); },
      fit() { fitView(500); },
      reheat() { fitted = false; g.d3ReheatSimulation(); },
      search(q) {
        q = (q || '').trim().toLowerCase();
        if (!q) return api.clear();
        state.hl = new Set(data.nodes.filter(n => (n.name + ' ' + n.cls + ' ' + n.title).toLowerCase().includes(q)).map(n => n.id));
        state.origin = null;
        refresh();
      },
      png() { return g.renderer().domElement.toDataURL('image/png'); },
      pause(on) { on ? g.pauseAnimation() : g.resumeAnimation(); },
    };
    container._kg = api;   // 디버깅용 참조
    return api;
  }

  // 캔버스 밖 컨트롤: 범례(클릭하면 그 Class만 표시) + Class별로 묶기
  function controls(holder, kg, M) {
    const counts = {};
    M.individuals.forEach(i => { if (i.group) counts[i.group] = (counts[i.group] || 0) + 1; });
    const only = new Set();
    holder.className = 'kg-controls';
    holder.innerHTML = `
      <div class="kg-legend">${kg.groups.map(g =>
        `<button type="button" data-g="${g}" title="Show only ${(EPC.GROUPS[g] || {}).label} (click again to clear)">
          <i style="--c:${kg.color(g)}"></i>${(EPC.GROUPS[g] || {}).label || g} <small>${counts[g] || 0}</small></button>`).join('')}</div>
      <div class="kg-opts">
        <label class="kg-group"><input type="checkbox" data-opt="labels" checked> Show labels</label>
        <label class="kg-group"><input type="checkbox" data-opt="group"> Group by dimension</label>
      </div>`;
    holder.querySelectorAll('.kg-legend button').forEach(b => b.addEventListener('click', () => {
      only.has(b.dataset.g) ? only.delete(b.dataset.g) : only.add(b.dataset.g);
      holder.querySelectorAll('.kg-legend button').forEach(x => x.classList.toggle('on', only.has(x.dataset.g)));
      holder.querySelector('.kg-legend').classList.toggle('filtering', only.size > 0);
      kg.setOnly(new Set(only));
    }));
    holder.querySelector('[data-opt="group"]').addEventListener('change', e => kg.setGrouped(e.target.checked));
    holder.querySelector('[data-opt="labels"]').addEventListener('change', e => kg.setLabels(e.target.checked));
  }

  window.KG3D = { create, controls, color };
})();
</script>
</head>
<body>
<script>window.SINGLE_PAGES = {"index": {"title": "6DDT Ontology", "bodyClass": "", "html": "<style>\n  .intro .edge { stroke: var(--text-faint); stroke-width: 1.5; fill: none; }\n  .intro .lbl { font-family: var(--mono); font-size: 11px; fill: var(--text-faint); font-style: italic; }\n  .intro .box text { font-size: 12.5px; font-weight: 500; fill: var(--text); }\n  .cite { border-left: 3px solid var(--border-strong); padding: .6rem 1rem; background: var(--bg-soft); font-size: .92rem; }\n<\/style>\n<article>\n  <h1 id=\"top\">6DDT Ontology: traceable service execution in building digital twins<\/h1>\n\n  <h2 id=\"what\">What is it<\/h2>\n  <p>The <b>six-dimensional digital twin (6DDT)<\/b> ontology is a metadata schema for building operations and management (O&amp;M).\n    The five-dimensional digital twin (5DDT) treats service as one predefined dimension, so it cannot say\n    <b>who executed a service, how long it took, or which rules produced its result<\/b>. 6DDT replaces that dimension with two\n    <b>executors<\/b>, <b>Tool<\/b> and <b>AI agent<\/b>, and records every execution as a <b>service log<\/b> generated by the\n    tool and the AI agent that ran it. It keeps the physical entity, virtual model, DT data, and connection dimensions, reuses the\n    <a href=\"https://brickschema.org/\" target=\"_blank\" rel=\"noopener\">Brick schema<\/a> for physical entities and the\n    <a href=\"https://skku-bist.github.io/\" target=\"_blank\" rel=\"noopener\">VB schema<\/a> for virtual models, and defines its\n    classes, relationships, and properties in OWL, with SHACL shapes that check the records.<\/p>\n\n  <figure class=\"figure-box intro\">\n    <svg viewBox=\"0 0 720 300\" role=\"img\" aria-label=\"An FDD request goes from the user interface to the AI agent and the FDD tool, which read data and rule models and write one service log\">\n      <defs><marker id=\"ia\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--text-faint)\"/><\/marker><\/defs>\n      <path class=\"edge\" d=\"M178 57 L300 57\" marker-end=\"url(#ia)\"/>\n      <path class=\"edge\" d=\"M420 57 L542 57\" marker-end=\"url(#ia)\"/>\n      <path class=\"edge\" d=\"M611 76 L611 128\" marker-end=\"url(#ia)\"/>\n      <path class=\"edge\" d=\"M542 150 L420 150\" marker-end=\"url(#ia)\"/>\n      <path class=\"edge\" d=\"M300 150 L178 150\" marker-end=\"url(#ia)\"/>\n      <path class=\"edge\" d=\"M109 169 L109 228\" marker-end=\"url(#ia)\"/>\n      <path class=\"edge\" d=\"M178 248 L300 248\" marker-end=\"url(#ia)\"/>\n      <path class=\"edge\" d=\"M542 248 L420 248\" marker-end=\"url(#ia)\"/>\n      <text class=\"lbl\" x=\"239\" y=\"50\" text-anchor=\"middle\">isInputOf<\/text>\n      <text class=\"lbl\" x=\"481\" y=\"50\" text-anchor=\"middle\">invokesService<\/text>\n      <text class=\"lbl\" x=\"620\" y=\"106\">hasInput<\/text>\n      <text class=\"lbl\" x=\"481\" y=\"143\" text-anchor=\"middle\">targetsControlLoop<\/text>\n      <text class=\"lbl\" x=\"239\" y=\"143\" text-anchor=\"middle\">hasSensor<\/text>\n      <text class=\"lbl\" x=\"118\" y=\"204\">generates<\/text>\n      <text class=\"lbl\" x=\"239\" y=\"241\" text-anchor=\"middle\">isInputOf<\/text>\n      <text class=\"lbl\" x=\"481\" y=\"241\" text-anchor=\"middle\">generates<\/text>\n      <g class=\"box\">\n        <rect x=\"40\" y=\"38\" width=\"138\" height=\"38\"/><text x=\"109\" y=\"62\" text-anchor=\"middle\">FDD user interface<\/text>\n        <rect x=\"300\" y=\"38\" width=\"120\" height=\"38\"/><text x=\"360\" y=\"62\" text-anchor=\"middle\">AI agent<\/text>\n        <rect x=\"542\" y=\"38\" width=\"138\" height=\"38\"/><text x=\"611\" y=\"62\" text-anchor=\"middle\">FDD tool<\/text>\n        <rect x=\"542\" y=\"131\" width=\"138\" height=\"38\"/><text x=\"611\" y=\"155\" text-anchor=\"middle\">Rule model 1<\/text>\n        <rect x=\"300\" y=\"131\" width=\"120\" height=\"38\"/><text x=\"360\" y=\"155\" text-anchor=\"middle\">Room loop<\/text>\n        <rect x=\"40\" y=\"131\" width=\"138\" height=\"38\"/><text x=\"109\" y=\"155\" text-anchor=\"middle\">Temperature sensor<\/text>\n        <rect x=\"40\" y=\"230\" width=\"138\" height=\"38\"/><text x=\"109\" y=\"254\" text-anchor=\"middle\">Sensor data<\/text>\n        <rect x=\"300\" y=\"230\" width=\"120\" height=\"38\"/><text x=\"360\" y=\"254\" text-anchor=\"middle\">Service log<\/text>\n        <rect x=\"542\" y=\"230\" width=\"138\" height=\"38\"/><text x=\"611\" y=\"254\" text-anchor=\"middle\">Tool + AI agent<\/text>\n      <\/g>\n    <\/svg>\n    <figcaption>One FDD execution: the request reaches the AI agent through the user interface, the agent invokes the FDD tool, the tool applies rule models to the data of the target loop, and the tool and the agent generate one service log. See <a href=\"#/sddt\">6DDT ontology<\/a>.<\/figcaption>\n  <\/figure>\n\n  <h2 id=\"start\">Getting started<\/h2>\n  <ul>\n    <li>New to ontologies? Read <a href=\"#/ontology\">Ontology concepts<\/a> for TBox, RBox, and ABox, RDF, OWL, SHACL, and the DT models 6DDT builds on.<\/li>\n    <li><a href=\"#/models\">3DDT and 5DDT<\/a> describes the two basic digital twin models, by Grieves and by Tao and colleagues.<\/li>\n    <li><a href=\"#/sddt\">6DDT ontology<\/a> explains the six dimensions, the design principles, the execution cycle, and four core paths.<\/li>\n    <li><a href=\"#/visualize\">Visualization<\/a> draws the class hierarchy, the object properties, and the example Knowledge Graph in 3D; <a href=\"#/reference\">Classes &amp; properties<\/a> lists every class, property, and SHACL shape.<\/li>\n    <li><a href=\"#/examples\">Competency questions<\/a> shows the answers to nine SPARQL questions and the SHACL validation result.<\/li>\n    <li><a href=\"#/files\">Downloads<\/a> has the 6DDT schema, the VB schema, the SHACL shapes, and the example graph.<\/li>\n  <\/ul>\n\n  <h2 id=\"benefits\">What you can do<\/h2>\n  <ul>\n    <li>Find <b>which tool and which AI agent executed<\/b> each service run (<code>sddt:isGeneratedBy<\/code>), and which tools an agent can invoke (<code>sddt:invokesService<\/code>).<\/li>\n    <li>Read the <b>quality of service<\/b> of every run from its service log: invocation ID, start and end time, latency, tool calls, tokens, and status.<\/li>\n    <li>Trace a diagnosis from the <b>fault category<\/b> to the rule models, control loops, points, and rooms it concerns (<code>hasPart<\/code>, <code>hasInput<\/code>, <code>targetsControlLoop<\/code>).<\/li>\n    <li>Reuse <b>Brick<\/b> and <b>VB<\/b> descriptions as they are: they populate 6DDT rather than compete with it.<\/li>\n    <li>Check records with <b>SHACL<\/b> before loading them: one tool and one AI agent per log, valid status, start before end, required IDs.<\/li>\n  <\/ul>\n\n  <h2 id=\"glance\">At a glance<\/h2>\n  <div class=\"grid grid-4\" id=\"stats\">\n    <div class=\"card stat\"><b data-k=\"classes\">–<\/b><span>Classes (6DDT)<\/span><\/div>\n    <div class=\"card stat\"><b data-k=\"objectProps\">–<\/b><span>Object properties<\/span><\/div>\n    <div class=\"card stat\"><b data-k=\"dataProps\">–<\/b><span>Datatype properties<\/span><\/div>\n    <div class=\"card stat\"><b data-k=\"shapes\">–<\/b><span>SHACL node shapes<\/span><\/div>\n  <\/div>\n  <div class=\"grid grid-4\" id=\"stats2\">\n    <div class=\"card stat\"><b data-k=\"individuals\">–<\/b><span>Individuals (example)<\/span><\/div>\n    <div class=\"card stat\"><b data-k=\"logs\">–<\/b><span>Service logs (example)<\/span><\/div>\n    <div class=\"card stat\"><b data-k=\"cq\">–<\/b><span>Competency questions<\/span><\/div>\n    <div class=\"card stat\"><b data-k=\"viol\">–<\/b><span>SHACL violations<\/span><\/div>\n  <\/div>\n  <p class=\"small muted\" id=\"stat-note\"><\/p>\n\n  <h2 id=\"cite\">How to cite<\/h2>\n  <div class=\"cite\">S.M.H. Saif, J. Koo, S. Yoon, A six-dimensional digital twin framework with LLM- and ontology-driven\n    agentic services for building operations and management, manuscript under review.<\/div>\n  <p class=\"small muted\">Schema: <a href=\"https://skku-bist.github.io/assets/6DDT_schema.ttl\" target=\"_blank\" rel=\"noopener\"><code>https://skku-bist.github.io/assets/6DDT_schema.ttl<\/code><\/a> (prefix <code>sddt:<\/code>).<\/p>\n\n  <h2 id=\"collab\">Developed by<\/h2>\n  <p>The BIST Lab, Department of Global Smart City, Sungkyunkwan University (Syed Mostasim Hasnain Saif, Jabeom Koo, and\n    Sungmin Yoon). The work was supported by the National Research Foundation of Korea (NRF) grant funded by the Korea\n    government (MSIT) (No. 2022R1C1C1008541).<\/p>\n  <p><span data-partners=\"lg\"><\/span><\/p>\n<\/article>\n<script>\ndocument.addEventListener('DOMContentLoaded', () => {\n  const { M, files, errors } = SDDT.load();\n  const note = document.getElementById('stat-note');\n  if (!M) { note.textContent = errors.join(' '); return; }\n  const own = arr => arr.filter(x => x.iri.startsWith(SDDT.NS.sddt)).length;\n  const n = { classes: own([...M.classes.values()]), objectProps: own(M.objectProps), dataProps: own(M.dataProps), shapes: M.shapes.length };\n  document.querySelectorAll('#stats [data-k]').forEach(b => b.textContent = n[b.dataset.k]);\n  const R = window.SDDT_RESULTS || {};\n  const logs = [...M.individuals.values()].filter(i => i.types.includes(SDDT.NS.sddt + 'ServiceLog')).length;\n  const n2 = { individuals: M.individuals.size, logs, cq: R.cq ? R.cq.length : undefined,\n    viol: R.shacl ? R.shacl.findings.filter(f => f.severity === 'Violation').length : undefined };\n  document.querySelectorAll('#stats2 [data-k]').forEach(b => b.textContent = n2[b.dataset.k] ?? '–');\n  note.textContent = 'Counted from the published files: ' + files.map(f => f.name).join(', ')\n    + (M.ontology && M.ontology.version ? ` · 6DDT versionInfo ${M.ontology.version}` : '')\n    + '. The example graph is illustrative (invented values).';\n});\n<\/script>\n"}, "ontology": {"title": "Ontology Concepts", "bodyClass": "", "html": "<div class=\"page-hero\"><div class=\"container\">\n  <div class=\"crumb\">01 · CONCEPTS<\/div>\n  <h1>Ontology concepts<\/h1>\n  <p>The minimum needed to read the 6DDT ontology: TBox, RBox, and ABox; RDF, OWL, and SHACL; inference; and the DT models and schemas 6DDT builds on.<\/p>\n<\/div><\/div>\n\n<main class=\"container doc\">\n  <nav class=\"toc\">\n    <b>Contents<\/b>\n    <a href=\"#boxes\">TBox · RBox · ABox<\/a>\n    <a href=\"#rdf\">RDF and Turtle<\/a>\n    <a href=\"#owl\">OWL: class and property axioms<\/a>\n    <a href=\"#infer\">Inference: inverses and the class hierarchy<\/a>\n    <a href=\"#shacl\">SHACL: data validation<\/a>\n    <a href=\"#upper\">Related DT models and schemas<\/a>\n  <\/nav>\n  <article class=\"doc-body\">\n    <h2 id=\"boxes\">TBox · RBox · ABox<\/h2>\n    <p>In description logics a knowledge base has three parts. The 6DDT files follow the same split.<\/p>\n    <div class=\"stack\">\n      <div class=\"stack-row\"><div class=\"name\">TBox<small>6DDT_schema.ttl<\/small><\/div><p><b>Terminology.<\/b> Classes and their hierarchy (subClassOf) and class restrictions. \"A simulation tool is a tool\", \"a service log is DT data generated by exactly one tool and one AI agent\".<\/p><\/div>\n      <div class=\"stack-row\"><div class=\"name\">RBox<small>6DDT_schema.ttl<\/small><\/div><p><b>Roles.<\/b> Object and datatype properties with their axioms: domain, range, inverse, functional, sub-property. \"isGeneratedBy is the inverse of generates\", \"a log has one latency\".<\/p><\/div>\n      <div class=\"stack-row\"><div class=\"name\">ABox<small>6DDT-example.ttl<\/small><\/div><p><b>Assertions.<\/b> Individuals and the facts between them. \"ex:LOG_0002 is a service log generated by ex:FDD_Tool and ex:FDD_Agent\".<\/p><\/div>\n    <\/div>\n    <p>SHACL shapes (<code>6DDT-shapes.ttl<\/code>) sit beside these three and state the <b>data-quality rules<\/b> the ABox must meet.\n      The VB schema (<code>VB_schema.ttl<\/code>) is a second TBox that 6DDT aligns with for virtual models and their data.<\/p>\n\n    <h2 id=\"rdf\">RDF and Turtle<\/h2>\n    <p>Every fact is a <b>subject–predicate–object<\/b> triple. Turtle writes triples in a form people can read.<\/p>\n    <pre data-lang=\"turtle\" data-label=\"6DDT-example.ttl (excerpt)\">\nex:LOG_0002 a sddt:ServiceLog ;                   # subject a (= rdf:type) class\n    sddt:hasServiceInvocationID \"FDD-302-0002\" ;   # literal value\n    sddt:hasServiceLatency 36.2 ;                  # number (xsd:decimal)\n    sddt:isGeneratedBy ex:FDD_Tool , ex:FDD_Agent ;   # object property: individual -> individual\n    sddt:hasFaultCategory \"Fault E-1\" .<\/pre>\n    <p><code>sddt:<\/code> is the 6DDT vocabulary (<code>https://skku-bist.github.io/assets/6DDT_schema.ttl#<\/code>), <code>vb:<\/code> the VB schema\n      (<code>https://skku-bist.github.io/method#<\/code>), <code>brick:<\/code> the Brick schema, and <code>ex:<\/code> the example individuals.<\/p>\n\n    <h2 id=\"owl\">OWL: class and property axioms<\/h2>\n    <p>OWL defines on top of RDF what each thing is. The 6DDT schema stays within OWL 2 DL and is consistent under the HermiT reasoner.<\/p>\n    <div class=\"table-wrap\"><table>\n      <tr><th>Axiom<\/th><th>Meaning<\/th><th>6DDT example<\/th><\/tr>\n      <tr><td><code>rdfs:subClassOf<\/code><\/td><td>Subclass<\/td><td><code>sddt:SimulationTool ⊑ sddt:Tool<\/code>, <code>sddt:ServiceLog ⊑ sddt:DTData<\/code><\/td><\/tr>\n      <tr><td><code>owl:inverseOf<\/code><\/td><td>Inverse property<\/td><td><code>generates<\/code> ↔ <code>isGeneratedBy<\/code>, <code>hasInput<\/code> ↔ <code>isInputOf<\/code>, <code>invokesService<\/code> ↔ <code>isInvokedBy<\/code><\/td><\/tr>\n      <tr><td><code>owl:FunctionalProperty<\/code><\/td><td>At most one value<\/td><td><code>hasServiceInvocationID<\/code>, <code>hasServiceLatency<\/code>, <code>hasFaultCategory<\/code> on a service log<\/td><\/tr>\n      <tr><td><code>rdfs:subPropertyOf<\/code><\/td><td>Sub-property<\/td><td><code>hasToolId<\/code>, <code>hasAgentId<\/code>, <code>hasDTDataId<\/code> ⊑ <code>hasId<\/code><\/td><\/tr>\n      <tr><td><code>owl:someValuesFrom<\/code><\/td><td>At least one value of a class<\/td><td>A tool <code>hasInput<\/code> some <code>sddt:Entity<\/code>; a virtual model <code>isVirtualModelOf<\/code> some physical entity<\/td><\/tr>\n      <tr><td><code>owl:qualifiedCardinality<\/code><\/td><td>Exactly n values of a class<\/td><td>A service log <code>isGeneratedBy<\/code> exactly 1 tool and exactly 1 AI agent<\/td><\/tr>\n    <\/table><\/div>\n\n    <h2 id=\"infer\">Inference: inverses and the class hierarchy<\/h2>\n    <p>Facts are written in one direction only; a reasoner adds the rest. In the example:<\/p>\n    <pre data-lang=\"turtle\" data-label=\"asserted → inferred\">\nex:LOG_0002 sddt:isGeneratedBy ex:FDD_Tool .        # asserted\nex:SD_302_Temp sddt:isGeneratedBy ex:PT_302_Temp .\nex:FDD_Tool a sddt:SimulationTool .\n\n# ⇒ inferred\nex:FDD_Tool sddt:generates ex:LOG_0002 .            # inverse of isGeneratedBy\nex:PT_302_Temp sddt:generates ex:SD_302_Temp .\nex:FDD_Tool a sddt:Tool , sddt:Entity .             # class hierarchy<\/pre>\n    <div class=\"callout\"><p><b class=\"t\">Why validate on the closure<\/b>The example writes <code>isGeneratedBy<\/code> but not <code>generates<\/code>. SHACL runs on the graph after these inferences are added, so a rule stated in either direction is checked without false violations. <code>export_results.py<\/code> does this.<\/p><\/div>\n\n    <h2 id=\"shacl\">SHACL: data validation<\/h2>\n    <p>OWL infers; SHACL checks. A shape states which properties, counts, and values the individuals of a target class must have, and reports a Violation or a Warning when they do not.<\/p>\n    <pre data-lang=\"turtle\" data-label=\"6DDT-shapes.ttl (excerpt)\">\nsddt:ServiceLogShape a sh:NodeShape ; sh:targetClass sddt:ServiceLog ;\n    sh:property [ sh:path sddt:isGeneratedBy ;\n                  sh:qualifiedValueShape [ sh:class sddt:Tool ] ;\n                  sh:qualifiedMinCount 1 ; sh:qualifiedMaxCount 1 ;\n                  sh:message \"A service log must be generated by exactly one tool.\" ] ,\n                [ sh:path sddt:hasServiceStatus ; sh:minCount 1 ; sh:maxCount 1 ;\n                  sh:in ( \"completed\" \"failed\" \"in progress\" ) ] ,\n                [ sh:path sddt:hasStartTime ; sh:datatype xsd:dateTime ;\n                  sh:lessThanOrEquals sddt:hasEndTime ] .<\/pre>\n    <p>A <b>Warning<\/b> marks a record that is incomplete rather than wrong. In the example, the static pressure loop has no registered actuator, and run 0003 is still in progress without a tool-call count.<\/p>\n\n    <h2 id=\"upper\">Related DT models and schemas<\/h2>\n    <div class=\"table-wrap\"><table>\n      <tr><th>Model or schema<\/th><th>What 6DDT takes from it<\/th><th>Reference<\/th><\/tr>\n      <tr><td><b>3DDT model<\/b><\/td><td>Physical entity, virtual entity, and the connection between them<\/td><td>M.W. Grieves, Digital twins: Past, present, and future, in: The Digital Twin, Springer, 2023. <a href=\"https://doi.org/10.1007/978-3-031-21343-4_4\" target=\"_blank\" rel=\"noopener\">doi:10.1007/978-3-031-21343-4_4<\/a><\/td><\/tr>\n      <tr><td><b>5DDT model<\/b><\/td><td>DT data and service as dimensions; 6DDT replaces service with Tool and AI agent<\/td><td>F. Tao, H. Zhang, A. Liu, A.Y.C. Nee, Digital twin in industry: State-of-the-art, IEEE Trans. Ind. Inform. 15 (2019). <a href=\"https://doi.org/10.1109/TII.2018.2873186\" target=\"_blank\" rel=\"noopener\">doi:10.1109/TII.2018.2873186<\/a><br>\n        Q. Qi, F. Tao et al., Enabling technologies and tools for digital twin, J. Manuf. Syst. 58 (2021). <a href=\"https://doi.org/10.1016/j.jmsy.2019.10.001\" target=\"_blank\" rel=\"noopener\">doi:10.1016/j.jmsy.2019.10.001<\/a><\/td><\/tr>\n      <tr><td><b>5DDT schema<\/b> (ontology-enabled 5DDT)<\/td><td>The Brick + VB framework used as the 5DDT baseline<\/td><td>S. Yoon, J. Song, J. Li, Ontology-enabled AI agent-driven intelligent digital twins for building operations and maintenance, J. Build. Eng. 108 (2025). <a href=\"https://doi.org/10.1016/j.jobe.2025.112802\" target=\"_blank\" rel=\"noopener\">doi:10.1016/j.jobe.2025.112802<\/a><\/td><\/tr>\n      <tr><td><b>VB schema<\/b><\/td><td>Virtual models (behavior, correction, distance) and their data; aligned with 6DDT virtual models and DT data<\/td><td>J. Lee, S. Yoon, Metadata schema for virtual building models in digital twins: VB schema implemented in GPT-based applications, Energy Build. 327 (2025). <a href=\"https://doi.org/10.1016/j.enbuild.2024.115039\" target=\"_blank\" rel=\"noopener\">doi:10.1016/j.enbuild.2024.115039<\/a> · <a href=\"https://skku-bist.github.io/\" target=\"_blank\" rel=\"noopener\">schema website<\/a><\/td><\/tr>\n      <tr><td><b>Brick schema<\/b><\/td><td>Location, equipment, and point classes for physical entities<\/td><td>B. Balaji et al., Brick: Metadata schema for portable smart building applications, Appl. Energy 226 (2018). <a href=\"https://doi.org/10.1016/j.apenergy.2018.02.091\" target=\"_blank\" rel=\"noopener\">doi:10.1016/j.apenergy.2018.02.091<\/a> · <a href=\"https://brickschema.org/\" target=\"_blank\" rel=\"noopener\">brickschema.org<\/a><\/td><\/tr>\n      <tr><td><b>PROV-O<\/b><\/td><td>Mapping: DT data to <code>prov:Entity<\/code>, Tool and AI agent to <code>prov:SoftwareAgent<\/code><\/td><td><a href=\"https://www.w3.org/TR/prov-o/\" target=\"_blank\" rel=\"noopener\">W3C PROV-O<\/a><\/td><\/tr>\n    <\/table><\/div>\n  <\/article>\n<\/main>\n"}, "models": {"title": "3DDT and 5DDT", "bodyClass": "", "html": "<style>\n  .dg .edge { stroke: var(--text); stroke-width: 1.3; fill: none; }\n  .dg .lbl { font-family: var(--font); font-size: 11.5px; font-style: italic; font-weight: 700 !important; fill: var(--text) !important; }\n  .dg .box text { font-size: 15px; }\n  .dg.narrow svg { max-width: 560px; margin: 0 auto; }\n<\/style>\n<div class=\"page-hero\"><div class=\"container\">\n  <div class=\"crumb\">02 · DIGITAL TWIN MODELS<\/div>\n  <h1>3DDT and 5DDT<\/h1>\n  <p>The two basic digital twin models: Grieves's three-dimensional model and the five-dimensional model of Tao and colleagues.<\/p>\n<\/div><\/div>\n\n<main class=\"container doc\">\n  <nav class=\"toc\">\n    <b>Contents<\/b>\n    <a href=\"#overview\">Overview<\/a>\n    <a href=\"#d3\">Three-dimensional digital twin (3DDT)<\/a>\n    <a href=\"#d5\">Five-dimensional digital twin (5DDT)<\/a>\n    <a href=\"#compare\">Dimensions compared<\/a>\n    <a href=\"#refs\">References<\/a>\n  <\/nav>\n  <article class=\"doc-body\">\n    <h2 id=\"overview\">Overview<\/h2>\n    <p>A <b>digital twin (DT)<\/b> is a virtual representation of a physical object or system that is kept connected to it, so that data from\n      the physical side update the virtual side and information from the virtual side can be used on the physical side. DT models describe\n      which parts, or <b>dimensions<\/b>, a digital twin has. Two models are widely used: the three-dimensional model introduced by\n      Michael Grieves and the five-dimensional model proposed by Fei Tao and colleagues.<\/p>\n\n    <h2 id=\"d3\">Three-dimensional digital twin (3DDT)<\/h2>\n    <p>Grieves introduced the digital twin concept in the early 2000s in the context of product lifecycle management (PLM). His model has\n      three parts:<\/p>\n    <div class=\"table-wrap\"><table>\n      <tr><th>Dimension<\/th><th>Description<\/th><\/tr>\n      <tr><td><b>Physical entity<\/b><\/td><td>The real object or system in physical space.<\/td><\/tr>\n      <tr><td><b>Virtual entity<\/b><\/td><td>Its digital counterpart in virtual space.<\/td><\/tr>\n      <tr><td><b>Connection<\/b><\/td><td>The link between the two: data flow from the physical to the virtual entity, and information flows back.<\/td><\/tr>\n    <\/table><\/div>\n    <figure class=\"figure-box dg narrow\">\n      <svg viewBox=\"0 0 520 200\" role=\"img\" aria-label=\"3DDT: data from the physical to the virtual entity, information back\">\n        <defs><marker id=\"m1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--text)\"/><\/marker><\/defs>\n        <g class=\"box\">\n          <rect x=\"20\" y=\"60\" width=\"140\" height=\"80\"/><text x=\"90\" y=\"96\" text-anchor=\"middle\">Physical<\/text><text x=\"90\" y=\"116\" text-anchor=\"middle\">entity<\/text>\n          <rect x=\"360\" y=\"60\" width=\"140\" height=\"80\"/><text x=\"430\" y=\"96\" text-anchor=\"middle\">Virtual<\/text><text x=\"430\" y=\"116\" text-anchor=\"middle\">entity<\/text>\n        <\/g>\n        <path class=\"edge\" d=\"M90 60 L90 24 L430 24 L430 58\" marker-end=\"url(#m1)\"/>\n        <path class=\"edge\" d=\"M430 140 L430 176 L90 176 L90 142\" marker-end=\"url(#m1)\"/>\n        <rect x=\"226\" y=\"14\" width=\"68\" height=\"20\" style=\"fill:var(--bg) !important;stroke:none !important\"/><text class=\"lbl\" x=\"260\" y=\"28\" text-anchor=\"middle\">Data<\/text>\n        <rect x=\"205\" y=\"166\" width=\"110\" height=\"20\" style=\"fill:var(--bg) !important;stroke:none !important\"/><text class=\"lbl\" x=\"260\" y=\"180\" text-anchor=\"middle\">Information<\/text>\n      <\/svg>\n      <figcaption>3DDT: physical entity, virtual entity, and the connection between them. Redrawn after Grieves (2023).<\/figcaption>\n    <\/figure>\n\n    <h2 id=\"d5\">Five-dimensional digital twin (5DDT)<\/h2>\n    <p>Tao and colleagues extended the three-dimensional model to five dimensions for use in industry. Next to the physical entity, the\n      virtual model, and the connections, the 5DDT has <b>DT data<\/b> and <b>services<\/b> as dimensions of their own. The model is often\n      written as <code>M<sub>DT<\/sub> = (PE, VE, Ss, DD, CN)<\/code>.<\/p>\n    <div class=\"table-wrap\"><table>\n      <tr><th>Dimension<\/th><th>Symbol<\/th><th>Description<\/th><\/tr>\n      <tr><td><b>Physical entity<\/b><\/td><td>PE<\/td><td>The real object or system.<\/td><\/tr>\n      <tr><td><b>Virtual model<\/b><\/td><td>VE<\/td><td>The digital models that represent the physical entity.<\/td><\/tr>\n      <tr><td><b>Services<\/b><\/td><td>Ss<\/td><td>The functions the digital twin provides, both for running the twin itself and for its users.<\/td><\/tr>\n      <tr><td><b>DT data<\/b><\/td><td>DD<\/td><td>The data of the twin, from the physical entity, the virtual model, and the services, together with their fused data.<\/td><\/tr>\n      <tr><td><b>Connections<\/b><\/td><td>CN<\/td><td>The links that join the other four dimensions to each other.<\/td><\/tr>\n    <\/table><\/div>\n    <p>The connections join every pair of the other four dimensions, which gives six connections in total.<\/p>\n    <figure class=\"figure-box dg\">\n      <svg viewBox=\"0 0 760 360\" role=\"img\" aria-label=\"5DDT: services, DT data, physical entity, and virtual model, all pairwise connected\">\n        <defs><marker id=\"m3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--text)\"/><\/marker><\/defs>\n        <g class=\"box\">\n          <rect x=\"300\" y=\"20\" width=\"160\" height=\"50\"/><text x=\"380\" y=\"51\" text-anchor=\"middle\">Services<\/text>\n          <rect x=\"300\" y=\"145\" width=\"160\" height=\"50\"/><text x=\"380\" y=\"176\" text-anchor=\"middle\">DT data<\/text>\n          <rect x=\"100\" y=\"280\" width=\"160\" height=\"56\"/><text x=\"180\" y=\"304\" text-anchor=\"middle\">Physical<\/text><text x=\"180\" y=\"324\" text-anchor=\"middle\">entity<\/text>\n          <rect x=\"500\" y=\"280\" width=\"160\" height=\"56\"/><text x=\"580\" y=\"304\" text-anchor=\"middle\">Virtual<\/text><text x=\"580\" y=\"324\" text-anchor=\"middle\">model<\/text>\n        <\/g>\n        <path class=\"edge\" d=\"M380 72 L380 143\" marker-start=\"url(#m3)\" marker-end=\"url(#m3)\"/>\n        <path class=\"edge\" d=\"M298 45 L50 45 L50 308 L98 308\" marker-start=\"url(#m3)\" marker-end=\"url(#m3)\"/>\n        <path class=\"edge\" d=\"M462 45 L710 45 L710 308 L662 308\" marker-start=\"url(#m3)\" marker-end=\"url(#m3)\"/>\n        <path class=\"edge\" d=\"M298 170 L180 170 L180 278\" marker-start=\"url(#m3)\" marker-end=\"url(#m3)\"/>\n        <path class=\"edge\" d=\"M462 170 L580 170 L580 278\" marker-start=\"url(#m3)\" marker-end=\"url(#m3)\"/>\n        <path class=\"edge\" d=\"M262 308 L498 308\" marker-start=\"url(#m3)\" marker-end=\"url(#m3)\"/>\n        <text class=\"lbl\" x=\"388\" y=\"112\">Services ↔ DT data<\/text>\n        <text class=\"lbl\" x=\"58\" y=\"112\">Services ↔ Physical entity<\/text>\n        <text class=\"lbl\" x=\"702\" y=\"112\" text-anchor=\"end\">Services ↔ Virtual model<\/text>\n        <text class=\"lbl\" x=\"188\" y=\"230\">DT data ↔ Physical entity<\/text>\n        <text class=\"lbl\" x=\"572\" y=\"230\" text-anchor=\"end\">DT data ↔ Virtual model<\/text>\n        <text class=\"lbl\" x=\"380\" y=\"300\" text-anchor=\"middle\">Physical entity ↔ Virtual model<\/text>\n      <\/svg>\n      <figcaption>5DDT: four dimensions joined pairwise by the fifth, the connections. Redrawn after Tao et al. (2019) and Qi et al. (2021).<\/figcaption>\n    <\/figure>\n\n    <h2 id=\"compare\">Dimensions compared<\/h2>\n    <div class=\"table-wrap\"><table>\n      <tr><th>3DDT<\/th><th>5DDT<\/th><\/tr>\n      <tr><td>Physical entity<\/td><td>Physical entity<\/td><\/tr>\n      <tr><td>Virtual entity<\/td><td>Virtual model<\/td><\/tr>\n      <tr><td>Connection (data and information)<\/td><td>Connections (six pairwise links)<\/td><\/tr>\n      <tr><td class=\"muted\">N/A<\/td><td>DT data<\/td><\/tr>\n      <tr><td class=\"muted\">N/A<\/td><td>Services<\/td><\/tr>\n    <\/table><\/div>\n    <p class=\"small muted\">The 6DDT model used on this site is described in <a href=\"#/sddt\">6DDT ontology<\/a>.<\/p>\n\n    <h2 id=\"refs\">References<\/h2>\n    <ul class=\"small\">\n      <li>M.W. Grieves, Digital twins: Past, present, and future, in: N. Crespi, A.T. Drobot, R. Minerva (Eds.), The Digital Twin, Springer, Cham, 2023, pp. 97–121. <a href=\"https://doi.org/10.1007/978-3-031-21343-4_4\" target=\"_blank\" rel=\"noopener\">doi:10.1007/978-3-031-21343-4_4<\/a><\/li>\n      <li>F. Tao, H. Zhang, A. Liu, A.Y.C. Nee, Digital twin in industry: State-of-the-art, IEEE Trans. Ind. Inform. 15 (2019) 2405–2415. <a href=\"https://doi.org/10.1109/TII.2018.2873186\" target=\"_blank\" rel=\"noopener\">doi:10.1109/TII.2018.2873186<\/a><\/li>\n      <li>Q. Qi, F. Tao, T. Hu, N. Anwer, A. Liu, Y. Wei, L. Wang, A.Y.C. Nee, Enabling technologies and tools for digital twin, J. Manuf. Syst. 58 (2021) 3–21. <a href=\"https://doi.org/10.1016/j.jmsy.2019.10.001\" target=\"_blank\" rel=\"noopener\">doi:10.1016/j.jmsy.2019.10.001<\/a><\/li>\n    <\/ul>\n  <\/article>\n<\/main>\n"}, "sddt": {"title": "6DDT Ontology", "bodyClass": "", "html": "<style>\n  .dg .edge { stroke: var(--text-faint); stroke-width: 1.4; fill: none; }\n  .dg .lbl { font-family: var(--mono); font-size: 10.5px; fill: var(--text-faint); font-style: italic; }\n  .dg text { font-size: 12px; fill: var(--text); }\n  .dg .sub { font-size: 10px; }\n  .dg .num { font-family: var(--mono); font-size: 11px; font-weight: 700 !important; }\n  .pathcard h3 { font-size: .95rem; }\n<\/style>\n<div class=\"page-hero\"><div class=\"container\">\n  <div class=\"crumb\">03 · 6DDT ONTOLOGY<\/div>\n  <h1>6DDT ontology<\/h1>\n  <p>The six dimensions of the 6DDT model and the schema that implements them: executors, service logs, and their links to Brick and VB.<\/p>\n<\/div><\/div>\n\n<main class=\"container doc\">\n  <nav class=\"toc\">\n    <b>Contents<\/b>\n    <a href=\"#why\">Why it is needed<\/a>\n    <a href=\"#def\">Definition<\/a>\n    <a href=\"#dims\">The six dimensions<\/a>\n    <a href=\"#principles\">Design principles<\/a>\n    <a href=\"#core\">Core model<\/a>\n    <a href=\"#cycle\">One execution cycle<\/a>\n    <a href=\"#link\">Four core paths<\/a>\n    <a href=\"#path1\" class=\"sub\">① Executor identity<\/a>\n    <a href=\"#path2\" class=\"sub\">② Diagnostic provenance<\/a>\n    <a href=\"#path3\" class=\"sub\">③ Data lineage<\/a>\n    <a href=\"#path4\" class=\"sub\">④ Brick and VB alignment<\/a>\n    <a href=\"#abox\">Example individuals<\/a>\n    <a href=\"#gaps\">Known gaps<\/a>\n  <\/nav>\n  <article class=\"doc-body\">\n    <h2 id=\"why\">Why it is needed<\/h2>\n    <p>LLM-driven AI agents can now run building services such as fault detection and diagnosis (FDD) on their own. But the\n      runtime facts of each run, such as <b>which agent invoked which tool, how long it took, and which rules produced the result<\/b>,\n      are generated in logs and code and then lost: no building schema can store or query them. IFC, BOT, Brick, and VB describe what\n      a building contains, and 5DDT gives service a dimension, yet none of them has a class for the entity that executes a service.\n      6DDT adds those executors and keeps every execution as a queryable record.<\/p>\n\n    <h2 id=\"def\">Definition<\/h2>\n    <p>6DDT is defined at two levels: the <b>6DDT model<\/b>, a dimensional DT framework that builds on 3DDT and reformulates 5DDT, and\n      the <b>6DDT schema<\/b>, its OWL realization. The schema reuses Brick for physical entities and VB for virtual models, so these\n      schemas populate 6DDT rather than compete with it. Service is not declared in advance: each execution is recorded as a\n      <code>sddt:ServiceLog<\/code> linked to the executors, data, physical entities, and virtual models involved.<\/p>\n\n    <h2 id=\"dims\">The six dimensions<\/h2>\n    <p>The two earlier models are described in <a href=\"#/models\">3DDT and 5DDT<\/a>.<\/p>\n    <div class=\"table-wrap\"><table>\n      <tr><th>6DDT dimension<\/th><th>Definition<\/th><th>In the 6DDT schema<\/th><\/tr>\n      <tr><td><b>Physical entity<\/b><\/td><td>A real-world product or system that exists in real space and has measurable physical characteristics throughout its life cycle.<\/td><td>Location, Equipment, Point (Brick); Control loop<\/td><\/tr>\n      <tr><td><b>Virtual model<\/b><\/td><td>A mathematical, logical, or statistical representation used to approximate, simulate, or calibrate the behavior of a system under defined assumptions.<\/td><td>Physical, Behavior, Rule, Geometric models (aligned with VB)<\/td><\/tr>\n      <tr><td><b>DT data<\/b><\/td><td>Structured or unstructured records of measured, observed, or derived values that capture the state of a system at a time or over a period.<\/td><td>Sensor, virtual model, tool data; model parameter; AI agent answer; service log<\/td><\/tr>\n      <tr><td><b>Tool<\/b><\/td><td>A software platform of code and system messages that selects resources for the user's needs and performs assigned tasks as a service executor.<\/td><td>Modeling, Simulation, Visualization, Interaction tool (User interface)<\/td><\/tr>\n      <tr><td><b>AI agent<\/b><\/td><td>An autonomous system that uses artificial intelligence to perceive, reason, and act on its environment to reach requested objectives.<\/td><td>AI agent (no subclasses)<\/td><\/tr>\n      <tr><td><b>Connection<\/b><\/td><td>The communication channel that transfers data and information between dimensions.<\/td><td><code>sddt:hasInput<\/code>, <code>sddt:generates<\/code>, <code>sddt:hasPart<\/code> and their inverses<\/td><\/tr>\n    <\/table><\/div>\n\n    <h2 id=\"principles\">Design principles<\/h2>\n    <div class=\"grid grid-2\">\n      <div class=\"card\"><h3>Service is not a class<\/h3><p>Service emerges from the interaction of executors, data, and models, following service-dominant logic. The schema keeps its evidence instead: one <code>ServiceLog<\/code> per execution.<\/p
